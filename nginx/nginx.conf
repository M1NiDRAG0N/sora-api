events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 파일 업로드 최대 크기 (application.yml과 동일하게)
    client_max_body_size 20m;

    # 로그
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    upstream sora-api {
        server sora-api:8080;
        keepalive 32;          # upstream 커넥션 재사용 (매 요청마다 TCP 연결 방지)
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # IP 직접 접근 차단
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name soragodong.duckdns.org;

        # SSE (Server-Sent Events) - 알림
        location /notifications/ {
            proxy_pass http://sora-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 필수 설정
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # WebSocket - 채팅
        location /ws {
            proxy_pass http://sora-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # 내부 모니터링 API - 시크릿 헤더 없으면 403
        location /api/internal/ {
            if ($http_x_monitor_token != "sora-monitor-2025") {
                return 403;
            }

            proxy_pass http://sora-api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 일반 요청
        location / {
            proxy_pass http://sora-api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # keepalive 활성화에 필요
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
