spring:
  application:
    name: sora-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-${spring.profiles.active}.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/soragodong?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&autoReconnect=true&characterEncoding=utf8&allowMultiQueries=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate        # prod 기본값, local에서 update로 오버라이드
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
    redis.repositories.enabled: false

  session:
    store-type: redis
    redis:
      repository-type: indexed

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY}

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 86400000

  cache:
    type: redis
    redis:
      time-to-live: 600000

  thymeleaf:
    cache: true                 # prod 기본값, local에서 false로 오버라이드

  file:
    upload:
      path: ${UPLOAD_PATH:/upload}

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${AI_MODEL:llama-3.3-70b-versatile}

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    connection-timeout: 20000
    threads:
      max: 50
      min-spare: 5
  error:
    include-message: always
    include-stacktrace: on_param

logging:
  level:
    root: WARN
    com.scit.soragodong: INFO   # prod 기본값, local에서 DEBUG로 오버라이드
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/soragodong.log
    max-size: 10MB
    max-history: 30
