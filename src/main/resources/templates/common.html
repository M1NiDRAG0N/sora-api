<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소라고동</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/unified-layout.css">
    <link rel="stylesheet" href="/css/finance.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/community.css">
    <link rel="stylesheet" href="/css/findAccount.css"> 
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/timesale.css">
    <link rel="stylesheet" href="/css/usedmarket.css">
    <link rel="stylesheet" href="/css/notification.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script defer th:src="@{https://maps.googleapis.com/maps/api/js(key=${googleMapsApiKey},libraries='places,geocoding')}"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/validation.js"></script>
    <script src="/js/sse-client.js"></script>
</head>

<body>

    <div class="app-container bg-gradient">
        <div th:replace="~{layout/header :: header}"></div>

        <th:block th:if="${currentUri == '/main'}" th:insert="~{main/main :: div}"></th:block>
        <th:block th:if="${currentUri == '/finance'}" th:insert="~{finance/finance :: div}"></th:block>
        <th:block th:if="${currentUri == '/community'}" th:insert="~{community/community :: div}"></th:block>
        <th:block th:if="${currentUri == '/timesale'}" th:insert="~{timesale/timesale :: div}"></th:block>
        <th:block th:if="${currentUri == '/timesale/detail'}" th:insert="~{timesale/timesaledetail :: div}"></th:block>
        <th:block th:if="${currentUri == '/used-market'}" th:insert="~{usedmarket/usedmarket :: div}"></th:block>
        <th:block th:if="${currentUri == '/chatList'}" th:insert="~{chat/chatList :: div}"></th:block>

        <div th:replace="~{layout/nav :: nav}"></div>

        <!-- Global Profile Layer -->
        <th:block th:replace="~{profile/profile :: div}"></th:block>

        <!-- Global Notification Modal -->
        <th:block th:replace="~{notification/notification :: div}"></th:block>

        <!-- ================================================ -->

        <div id="chatLayer" class="page-layer">
            <div class="chat-header">
                <div class="chat-close-btn">
                    <ion-icon name="chevron-down"></ion-icon>
                </div>
                <div class="header-title">소라고동 AI</div>
                <div class="chat-header-spacer"></div>
            </div>

            <div class="chat-body no-scrollbar" id="chatContainer">
            </div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" placeholder="메시지를 입력하세요...">
                <div class="btn-send">
                    <ion-icon name="paper-plane"></ion-icon>
                </div>
            </div>
        </div>

        <!-- 신고하기 모달 (Report Modal) -->
        <div id="reportLayer" class="page-layer" style="background: #fff;">
            <div class="chat-header" style="border-bottom: 1px solid #eee;">
                <div class="chat-close-btn" onclick="ReportModal.close()">
                    <ion-icon name="chevron-down"></ion-icon>
                </div>
                <div class="header-title">🚨 신고하기</div>
                <div class="chat-header-spacer"></div>
            </div>

            <div class="report-content" style="padding: 20px; flex: 1; overflow-y: auto;">
                <div id="report-target-info" style="background: #f8f9fd; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; color: #666;">
                    <strong>대상:</strong> <span id="report-target-type-text"></span> (ID: <span id="report-target-id-text"></span>)
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 10px; font-weight: 700; font-size: 15px;">신고 사유를 선택해주세요</label>
                    <div id="report-reason-list" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- JS에서 사유 목록 생성 -->
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="report-description" style="display: block; margin-bottom: 10px; font-weight: 700; font-size: 15px;">상세 설명 (선택사항)</label>
                    <textarea id="report-description" style="width: 100%; height: 120px; padding: 15px; border: 1px solid #eee; border-radius: 12px; resize: none; font-size: 14px;" placeholder="상세한 내용을 입력해주시면 처리에 도움이 됩니다."></textarea>
                </div>

                <button type="button" class="btn-primary" onclick="ReportModal.submit()" style="margin-top: 10px; background-color: #ff4757; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);">신고 제출</button>
                <button type="button" class="btn-cancel" onclick="ReportModal.close()" style="width: 100%; padding: 15px; border: none; background: #eee; border-radius: 30px; margin-top: 10px; font-weight: 700; color: #666; cursor: pointer;">취소</button>
            </div>
        </div>

    </div>
</body>

</html>
