<!-- ✅ 스크롤 컨텐츠 -->
<div th:fragment="div" class="detail-content" id="detailContent">
    <input type="hidden" id="loginUserIdx" th:value="${#authentication.principal.userIdx}">
    <!-- 가게 정보 카드 -->
    <div class="detail-store-card" id="storeInfo">
        <div class="detail-store-header">
            <img src="" alt="가게 이미지" class="detail-store-img" id="storeImage">
            <div class="detail-store-info">
                <h2 class="detail-store-name" id="storeName">Loading...</h2>
                <div class="detail-store-time" id="storeTime">--:-- ~ --:--</div>
            </div>
        </div>
    </div>

    <!-- 음식 리스트 -->
    <div class="detail-food-list" id="foodList">
        <!-- JavaScript로 동적 생성 -->
    </div>

    <!-- 로딩 상태 -->
    <div class="detail-status" id="detailStatus"></div>

    <!-- 무한스크롤 감지용 -->
    <div id="detailSentinel"></div>
</div>
<!-- 예약 모달 -->
<div class="reservation-modal" id="reservationModal">
    <div class="modal-overlay" onclick="closeReservationModal()"></div>
    <div class="modal-content">
        <!-- 헤더 -->
        <div class="modal-header">
            <div class="modal-back-btn" id="modalCloseBtn">
                <ion-icon name="arrow-back-outline"></ion-icon>
            </div>
            <h2 class="modal-title">상품 예약</h2>
            <div class="modal-spacer"></div>
        </div>

        <!-- 스크롤 영역 -->
        <div class="modal-body">
            <!-- 가게 정보 -->
            <div class="modal-store-info">
                <ion-icon name="storefront-outline"></ion-icon>
                <span id="modalStoreName">로딩 중...</span>
            </div>

            <!-- 상품 정보 -->
            <div class="modal-product-card">
                <img src="" alt="상품 이미지" class="modal-product-img" id="modalProductImg">
                <div class="modal-product-info">
                    <h3 class="modal-product-name" id="modalProductName">상품명</h3>
                    <div class="modal-price-wrap">
                        <span class="modal-price-current" id="modalPrice">0원</span>
                        <span class="modal-price-original" id="modalOriginalPrice">0원</span>
                    </div>
                    <div class="modal-sale-time" id="modalSaleTime">재고 0개 남음</div>
                </div>
            </div>

            <!-- 예약할 수량 -->
            <div class="modal-section">
                <h4 class="modal-section-title">예약할 수량</h4>
                <div class="modal-quantity-control">
                    <button class="quantity-btn" id="decreaseBtn">
                        <ion-icon name="remove-outline"></ion-icon>
                    </button>
                    <input type="number" class="quantity-input" id="quantityInput" value="1" min="1" max="10" readonly>
                    <button class="quantity-btn" id="increaseBtn">
                        <ion-icon name="add-outline"></ion-icon>
                    </button>
                </div>
                <div class="modal-quantity-note">최대 10개 예약 가능</div>
            </div>

            <!-- 이 예약 금액 -->
            <div class="modal-section">
                <h4 class="modal-section-title">이 예약 금액</h4>
                <div class="modal-total-price" id="modalTotalPrice">1,500원</div>
            </div>

            <!-- 안내 문구 -->
            <div class="modal-notice">
                <p>예약 후 타임세일을 통해 재고가 남아 있지 않는다면</p>
                <p>30분 내 찾아가지 않으면 예약이 자동 취소됩니다.</p>
            </div>
        </div>

        <!-- 예약 버튼 -->
        <div class="modal-footer">
            <button class="modal-reserve-btn" id="confirmBtn">
                <span id="reserveButtonText">1개 예약하기</span>
            </button>
        </div>
    </div>
    <script>
        /**
         * ✅ 이미지 URL 생성 헬퍼 함수
         * @param {string|number} pictureIdx - 파일 인덱스 또는 파일 그룹 인덱스
         * @param {string} type - 'file' 또는 'group' (기본값: 'file')
         * @returns {string} - FileController를 통한 이미지 URL
         */
        function getImageUrl(pictureIdx, type = 'file') {
            if (!pictureIdx) {
                return '/images/no-image.png'; // 기본 이미지
            }

            // type이 'group'이면 썸네일 엔드포인트 사용
            if (type === 'group') {
                return `/img/group/${pictureIdx}`;
            }

            // 기본은 파일 ID로 조회
            return `/img/${pictureIdx}`;
        }

        /**
         * 타임세일 상세 페이지 관리
         */
        const TimeSaleDetail = {
            // 현재 가게 정보
            storeIdx: null,
            storeData: null,

            // 상품 데이터 캐시
            productsCache: null,

            // 무한 스크롤 설정
            scroll: {
                page: 0,
                itemsPerPage: 10,
                loading: false,
                hasMore: true,
                observer: null
            },

            /**
             * 초기화
             */
            init: function () {
                console.log('[TimeSaleDetail] 초기화 시작');

                // URL에서 storeIdx 가져오기
                this.storeIdx = this.getStoreIdxFromURL();

                if (!this.storeIdx) {
                    Utils.notify('가게 정보를 찾을 수 없습니다.', 'error');
                    setTimeout(() => {
                        window.location.href = '/timesale';
                    }, 1500);
                    return;
                }

                console.log('[TimeSaleDetail] storeIdx:', this.storeIdx);

                // 이벤트 바인딩
                this.bindEvents();

                // 무한 스크롤 설정
                this.setupIntersectionObserver();

                // 데이터 로드
                this.loadStoreDetail();
                this.loadProducts();

                console.log('[TimeSaleDetail] 초기화 완료');
            },

            /**
             * URL에서 storeIdx 파라미터 추출
             */
            getStoreIdxFromURL: function () {
                const params = new URLSearchParams(window.location.search);
                return params.get('storeIdx');
            },

            /**
             * 이벤트 바인딩
             */
            bindEvents: function () {
                // 뒤로가기 버튼이 있다면
                const backBtn = document.querySelector('.header-back-btn');
                if (backBtn) {
                    backBtn.addEventListener('click', () => {
                        window.location.href = '/timesale';
                    });
                }
            },

            /**
             * Intersection Observer 설정 (무한 스크롤)
             */
            setupIntersectionObserver: function () {
                const options = {
                    root: null,
                    rootMargin: '200px',
                    threshold: 0
                };

                this.scroll.observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && this.scroll.hasMore && !this.scroll.loading) {
                            console.log('[Observer] 무한스크롤 트리거');
                            this.loadMoreProducts();
                        }
                    });
                }, options);

                // Sentinel 요소 관찰 시작
                const sentinel = document.getElementById('detailSentinel');
                if (sentinel) {
                    this.scroll.observer.observe(sentinel);
                    console.log('[Observer] DetailSentinel 관찰 시작');
                }
            },

            /**
             * 가게 상세 정보 로드
             */
            loadStoreDetail: async function () {
                try {
                    console.log('[가게정보] API 호출 시작');
                    console.log('[가게정보] URL:', `/timesale/detail/${this.storeIdx}`);
                    this.showDetailStatus('가게 정보를 불러오는 중...');

                    const storeData = await API.get(`/timesale/detail/${this.storeIdx}`);

                    console.log('[가게정보] API 응답:', storeData);

                    if (!storeData) {
                        throw new Error('가게 정보가 비어있습니다.');
                    }

                    this.storeData = storeData;
                    this.renderStoreInfo(storeData);
                    this.hideDetailStatus();

                } catch (error) {
                    console.error('[가게정보] 로드 실패:', error);
                    console.error('[가게정보] 에러 상세:', error.stack);
                    Utils.notify('가게 정보를 불러오는데 실패했습니다.', 'error');
                    this.showDetailStatus('가게 정보를 불러올 수 없습니다.');
                }
            },

            /**
             * 가게 정보 렌더링
             */
            renderStoreInfo: function (store) {
                const storeImage = document.getElementById('storeImage');
                const storeName = document.getElementById('storeName');
                const storeTime = document.getElementById('storeTime');

                if (!store) {
                    console.error('[renderStoreInfo] store 데이터가 없습니다');
                    return;
                }

                console.log('[renderStoreInfo] 렌더링 시작:', store);

                // ✅ 가게 이미지 - FileController를 통해 썸네일 로드
                const imageUrl = getImageUrl(store.storePictureIdx, 'group');
                storeImage.src = imageUrl;
                storeImage.alt = store.storeName;

                // 가게 이름
                storeName.textContent = store.storeName || '가게명 없음';

                // 운영시간과 할인시간 모두 표시
                let timeText = '';

                // 운영시간
                if (store.storeOpenTime && store.storeCloseTime) {
                    const openTime = this.formatTime(store.storeOpenTime);
                    const closeTime = this.formatTime(store.storeCloseTime);
                    timeText += `🕐 영업: ${openTime} ~ ${closeTime}`;
                }

                // 할인시간
                if (store.eventStartTime && store.eventEndTime) {
                    const startTime = this.formatTime(store.eventStartTime);
                    const endTime = this.formatTime(store.eventEndTime);
                    if (timeText) timeText += `<br/>`;
                    timeText += `⚡ 할인: ${startTime} ~ ${endTime}`;
                }

                // 시간 정보가 없는 경우
                if (!timeText) {
                    timeText = '시간 정보 없음';
                }

                storeTime.innerHTML = timeText;

                console.log('[renderStoreInfo] 렌더링 완료');
            },

            /**
             * 상품 목록 로드
             */
            loadProducts: async function () {
                try {
                    console.log('[상품목록] API 호출 시작');
                    console.log('[상품목록] URL:', `/timesale/detail/${this.storeIdx}/products`);
                    this.showDetailStatus('상품을 불러오는 중...');

                    const products = await API.get(`/timesale/detail/${this.storeIdx}/products`);

                    console.log('[상품목록] API 응답:', products);
                    console.log('[상품목록] 상품 수:', products ? products.length : 0);

                    if (!products) {
                        throw new Error('상품 목록이 비어있습니다.');
                    }

                    this.productsCache = products;
                    this.renderProducts(products);

                } catch (error) {
                    console.error('[상품목록] 로드 실패:', error);
                    console.error('[상품목록] 에러 상세:', error.stack);
                    Utils.notify('상품 목록을 불러오는데 실패했습니다.', 'error');
                    this.showDetailStatus('상품을 불러올 수 없습니다.');
                }
            },

            /**
             * 상품 렌더링
             */
            renderProducts: function (products) {
                const foodList = document.getElementById('foodList');
                foodList.innerHTML = '';

                if (!products) {
                    console.error('[renderProducts] products 데이터가 없습니다');
                    this.showDetailStatus('상품 데이터를 불러올 수 없습니다.');
                    return;
                }

                console.log('[renderProducts] 렌더링 시작:', products.length, '개');

                // 재고 0개 상품 제외
                const availableProducts = products.filter(p => p.productQuantity && p.productQuantity > 0);

                if (availableProducts.length === 0) {
                    this.showDetailStatus('등록된 상품이 없습니다.');
                    return;
                }

                // 첫 페이지 상품만 렌더링
                const items = availableProducts.slice(0, this.scroll.itemsPerPage);
                this.appendProducts(items);

                // 더 많은 데이터가 있는지 확인
                if (availableProducts.length <= this.scroll.itemsPerPage) {
                    this.scroll.hasMore = false;
                }

                // 캐시를 재고 있는 것만으로 교체
                this.productsCache = availableProducts;

                this.hideDetailStatus();
                console.log('[renderProducts] 렌더링 완료');
            },

            /**
             * 더 많은 상품 로드 (무한 스크롤)
             */
            loadMoreProducts: function () {
                if (this.scroll.loading || !this.scroll.hasMore) {
                    return;
                }

                const products = this.productsCache;
                if (!products) return;

                this.scroll.loading = true;
                console.log(`[무한스크롤] 페이지 ${this.scroll.page + 1} 로딩 시작`);

                // 다음 페이지 계산
                this.scroll.page++;
                const start = this.scroll.page * this.scroll.itemsPerPage;
                const end = start + this.scroll.itemsPerPage;
                const items = products.slice(start, end);

                if (items.length === 0) {
                    this.scroll.hasMore = false;
                    this.scroll.loading = false;
                    console.log('[무한스크롤] 모든 데이터 로드 완료');
                    return;
                }

                // 약간의 지연으로 자연스러운 로딩 효과
                setTimeout(() => {
                    this.appendProducts(items);

                    if (end >= products.length) {
                        this.scroll.hasMore = false;
                        console.log('[무한스크롤] 마지막 페이지 도달');
                    }

                    this.scroll.loading = false;
                    console.log(`[무한스크롤] 페이지 ${this.scroll.page} 로딩 완료`);
                }, 300);
            },

            /**
             * 상품 추가 (무한 스크롤용)
             */
            appendProducts: function (products) {
                const foodList = document.getElementById('foodList');
                const fragment = document.createDocumentFragment();

                products.forEach(product => {
                    const card = this.createProductCard(product);
                    fragment.appendChild(card);
                });

                foodList.appendChild(fragment);
            },

            /**
             * 상품 카드 생성
             */
            createProductCard: function (product) {
                const card = document.createElement('div');
                card.className = 'detail-food-item';
                card.dataset.productNum = product.productNum;

                // 할인율 계산
                const discountRate = product.eventPrice && product.price
                    ? Math.round(((product.price - product.eventPrice) / product.price) * 100)
                    : 0;

                // 가격 (할인가 또는 원가)
                const currentPrice = product.eventPrice || product.price;
                const hasDiscount = product.eventPrice && product.eventPrice < product.price;

                // 할인 종료 시간 (가게의 eventEndTime 사용)
                let endTimeText = '';
                if (this.storeData && this.storeData.eventEndTime) {
                    endTimeText = `${this.formatTime(this.storeData.eventEndTime)}까지`;
                }

                // ✅ FileController를 통해 상품 이미지 로드
                const imageUrl = getImageUrl(product.productPictureIdx, 'file');

                card.innerHTML = `
            <img src="${imageUrl}" 
                 alt="${product.productName}" 
                 class="detail-food-img">
            <div class="detail-food-info">
                <h3 class="detail-food-name">${product.productName}</h3>
                <div class="detail-food-price-wrap">
                    <span class="detail-food-price">${Utils.formatNumber(currentPrice)}원</span>
                    ${hasDiscount ? `<span class="detail-food-original-price">원가 ${Utils.formatNumber(product.price)}원</span>` : ''}
                </div>
                <div class="detail-food-meta">
                    ${hasDiscount ? `<span class="detail-food-discount">할인율 ${discountRate}%</span>` : ''}
                    ${endTimeText ? `<span>• ${endTimeText}</span>` : ''}
                </div>
            </div>
        `;

                // 카드 클릭 시 예약 모달 열기
                card.addEventListener('click', () => {
                    console.log('[상품클릭]', product.productName, 'productNum:', product.productNum);
                    openReservationModal(product.productNum);
                });

                return card;
            },

            /**
             * 시간 포맷팅 (HH:MM:SS -> HH:MM AM/PM)
             */
            formatTime: function (timeString) {
                if (!timeString) return '';

                // "HH:MM:SS" 형식 파싱
                const parts = timeString.split(':');
                if (parts.length < 2) return timeString;

                let hours = parseInt(parts[0]);
                const minutes = parts[1];
                const period = hours >= 12 ? 'PM' : 'AM';

                // 12시간 형식으로 변환
                hours = hours % 12 || 12;

                return `${String(hours).padStart(2, '0')}:${minutes} ${period}`;
            },

            /**
             * 상태 메시지 표시
             */
            showDetailStatus: function (message) {
                const status = document.getElementById('detailStatus');
                if (status) {
                    status.textContent = message;
                    status.style.display = 'block';
                }
            },

            /**
             * 상태 메시지 숨기기
             */
            hideDetailStatus: function () {
                const status = document.getElementById('detailStatus');
                if (status) {
                    status.style.display = 'none';
                }
            }
        };

        // DOM 로드 완료 후 초기화
        document.addEventListener('DOMContentLoaded', () => {
            TimeSaleDetail.init();
        });

        // 예약 모달 JavaScript
        const ReservationModal = {
            modal: null,
            overlay: null,
            currentProduct: null,
            quantity: 1,
            maxQuantity: 10,

            /**
             * 초기화
             */
            init: function () {
                this.modal = document.getElementById('reservationModal');
                this.overlay = this.modal.querySelector('.modal-overlay');

                // 이벤트 바인딩
                document.getElementById('modalCloseBtn').addEventListener('click', () => this.close());
                document.getElementById('decreaseBtn').addEventListener('click', () => this.decreaseQuantity());
                document.getElementById('increaseBtn').addEventListener('click', () => this.increaseQuantity());
                document.getElementById('confirmBtn').addEventListener('click', () => this.reserve());
            },

            /**
             * userIdx 가져오기
             */
            getUserIdx: function () {
                // 1순위: Hidden Input
                const hiddenInput = document.getElementById('loginUserIdx');
                if (hiddenInput && hiddenInput.value) {
                    return hiddenInput.value;
                }

                // 2순위: Cookie
                const cookieUserIdx = Utils.getCookie('userIdx');
                if (cookieUserIdx) {
                    return cookieUserIdx;
                }

                // 3순위: localStorage
                const localUserIdx = localStorage.getItem('userIdx');
                if (localUserIdx) {
                    return localUserIdx;
                }

                return null;
            },

            /**
             * 모달 열기
             */
            open: async function (productNum) {
                console.log('[예약모달] 열기 시작 - productNum:', productNum);

                try {
                    // 상품 정보 조회
                    const product = await API.get(`/timesale/product/${productNum}`);
                    console.log('[예약모달] 상품 정보:', product);

                    if (!product) {
                        throw new Error('상품 정보를 찾을 수 없습니다.');
                    }

                    // 현재 상품 저장
                    this.currentProduct = product;
                    this.quantity = 1;
                    this.maxQuantity = Math.min(10, product.productQuantity);

                    // 모달 렌더링
                    this.render();

                    // 모달 표시
                    this.modal.classList.add('active');
                    this.overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';

                } catch (error) {
                    console.error('[예약모달] 열기 실패:', error);
                    Utils.notify('상품 정보를 불러오는데 실패했습니다.', 'error');
                }
            },

            /**
             * 모달 닫기
             */
            close: function () {
                this.modal.classList.remove('active');
                this.overlay.classList.remove('active');
                document.body.style.overflow = '';
                this.currentProduct = null;
                this.quantity = 1;
            },

            /**
             * 수량 감소
             */
            decreaseQuantity: function () {
                if (this.quantity > 1) {
                    this.quantity--;
                    this.updateQuantityDisplay();
                }
            },

            /**
             * 수량 증가
             */
            increaseQuantity: function () {
                if (this.quantity < this.maxQuantity) {
                    this.quantity++;
                    this.updateQuantityDisplay();
                }
            },

            /**
             * 수량 표시 업데이트
             */
            updateQuantityDisplay: function () {
                const quantityInput = document.getElementById('quantityInput');
                const totalPriceEl = document.getElementById('modalTotalPrice');

                if (quantityInput) {
                    quantityInput.value = this.quantity;
                }

                if (totalPriceEl && this.currentProduct) {
                    const price = this.currentProduct.eventPrice || this.currentProduct.price;
                    const total = price * this.quantity;
                    totalPriceEl.textContent = total.toLocaleString() + '원';
                }
            },

            /**
             * 모달 렌더링
             */
            render: function () {
                if (!this.currentProduct) return;

                const product = this.currentProduct;
                const price = product.eventPrice || product.price;
                const totalPrice = price * this.quantity;
                const hasDiscount = product.eventPrice && product.eventPrice < product.price;

                console.log('[예약모달] 렌더링 시작 - product:', product);

                // 가게 이름
                const storeNameEl = document.getElementById('modalStoreName');
                if (storeNameEl) {
                    storeNameEl.textContent = product.storeName || '로딩 중...';
                }

                // ✅ 상품 이미지 - FileController를 통해 로드
                const productImg = document.getElementById('modalProductImg');
                if (productImg) {
                    const imageUrl = getImageUrl(product.productPictureIdx, 'file');
                    productImg.src = imageUrl;
                    productImg.alt = product.productName;
                }

                // 상품명
                const productNameEl = document.getElementById('modalProductName');
                if (productNameEl) {
                    productNameEl.textContent = product.productName;
                }

                // 현재 가격
                const priceEl = document.getElementById('modalPrice');
                if (priceEl) {
                    priceEl.textContent = price.toLocaleString() + '원';
                }

                // 원래 가격 (할인 있을 때만)
                const originalPriceEl = document.getElementById('modalOriginalPrice');
                if (originalPriceEl) {
                    if (hasDiscount) {
                        originalPriceEl.textContent = product.price.toLocaleString() + '원';
                        originalPriceEl.style.display = 'inline';
                    } else {
                        originalPriceEl.style.display = 'none';
                    }
                }

                // 재고 정보
                const saleTimeEl = document.getElementById('modalSaleTime');
                if (saleTimeEl) {
                    saleTimeEl.textContent = `재고 ${product.productQuantity}개 남음`;
                }

                // 수량
                const quantityInput = document.getElementById('quantityInput');
                if (quantityInput) {
                    quantityInput.value = this.quantity;
                    quantityInput.max = this.maxQuantity;
                }

                // 수량 안내
                const quantityNote = this.modal.querySelector('.modal-quantity-note');
                if (quantityNote) {
                    quantityNote.textContent = `최대 ${this.maxQuantity}개 예약 가능`;
                }

                // 총 금액
                const totalPriceEl = document.getElementById('modalTotalPrice');
                if (totalPriceEl) {
                    totalPriceEl.textContent = totalPrice.toLocaleString() + '원';
                }

                console.log('[예약모달] 렌더링 완료');
            },

            /**
             * 예약 처리
             */
            reserve: async function () {
                console.log('[예약] 시작 - 수량:', this.quantity);

                if (!this.currentProduct) {
                    Utils.notify('상품 정보가 없습니다.', 'error');
                    return;
                }

                try {
                    // ⭐ userIdx 가져오기 (우선순위: Hidden Input → Cookie → localStorage)
                    const userIdx = this.getUserIdx();

                    if (!userIdx) {
                        Utils.notify('로그인이 필요합니다.', 'warning');
                        setTimeout(() => {
                            window.location.href = '/auth/login';
                        }, 1000);
                        return;
                    }

                    console.log('[예약] userIdx:', userIdx);

                    // 예약 데이터 준비
                    const reservationData = {
                        userIdx: parseInt(userIdx),  // ⭐ 숫자로 변환
                        productNum: this.currentProduct.productNum,
                        storeIdx: this.currentProduct.storeIdx,
                        productName: this.currentProduct.productName,
                        orderQuantity: this.quantity,
                        totalPrice: (this.currentProduct.eventPrice || this.currentProduct.price) * this.quantity,
                        orderTime: null,
                        orderStatus: null,
                        orderIndex: null,
                        cancelledAt: null,
                        cancelReason: null
                    };

                    console.log('[예약] 데이터:', reservationData);

                    // 예약 API 호출
                    const response = await API.post('/timesale/reserve', reservationData);

                    Utils.notify('예약이 완료되었습니다!', 'success');
                    this.close();

                    // 페이지 새로고침 (재고 업데이트 반영)
                    setTimeout(() => {
                        location.reload();
                    }, 1000);

                } catch (error) {
                    console.error('[예약] 실패:', error);
                    Utils.notify(error.message || '예약에 실패했습니다.', 'error');
                }
            }
        };

        // 전역 함수로 노출
        window.openReservationModal = function (productNum) {
            ReservationModal.open(productNum);
        };

        window.closeReservationModal = function () {
            ReservationModal.close();
        };

        // DOM 로드 후 초기화
        document.addEventListener('DOMContentLoaded', () => {
            ReservationModal.init();
        });
    </script>
</div>
