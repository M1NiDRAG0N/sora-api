<div th:fragment="div" class="sale-content" id="saleContent">
    <input type="hidden" id="loginUserIdx" th:value="${#authentication.principal.userIdx}">
    <div class="map-wrap">
        <div class="map-box">
            <div id="map" style="width: 100%; height: 100%;"></div>
            <div class="map-placeholder" id="mapPlaceholder" style="display: none;">
                Google Maps API 영역
            </div>
        </div>
    </div>

    <div class="tab-wrap">
        <div class="tabs">
            <div class="tab-btn active" id="tabFood">음식</div>
            <div class="tab-btn" id="tabStore">가게</div>
        </div>
    </div>

    <div class="list-wrap" id="listWrap"></div>
    <div class="list-status" id="listStatus"></div>
    <div id="sentinel"></div>
    <!-- 예약 모달 -->
    <div class="reservation-modal" id="reservationModal">
        <div class="modal-overlay" onclick="closeReservationModal()"></div>
        <div class="modal-content">
            <!-- 헤더 -->
            <div class="modal-header">
                <div class="modal-back-btn" id="modalCloseBtn">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </div>
                <h2 class="modal-title">상품 예약</h2>
                <div class="modal-spacer"></div>
            </div>

            <!-- 스크롤 영역 -->
            <div class="modal-body">
                <!-- 가게 정보 -->
                <div class="modal-store-info">
                    <ion-icon name="storefront-outline"></ion-icon>
                    <span id="modalStoreName">로딩 중...</span>
                </div>

                <!-- 상품 정보 -->
                <div class="modal-product-card">
                    <img src="" alt="상품 이미지" class="modal-product-img" id="modalProductImg">
                    <div class="modal-product-info">
                        <h3 class="modal-product-name" id="modalProductName">상품명</h3>
                        <div class="modal-price-wrap">
                            <span class="modal-price-current" id="modalPrice">0원</span>
                            <span class="modal-price-original" id="modalOriginalPrice">0원</span>
                        </div>
                        <div class="modal-sale-time" id="modalSaleTime">재고 0개 남음</div>
                    </div>
                </div>

                <!-- 예약할 수량 -->
                <div class="modal-section">
                    <h4 class="modal-section-title">예약할 수량</h4>
                    <div class="modal-quantity-control">
                        <button class="quantity-btn" id="decreaseBtn">
                            <ion-icon name="remove-outline"></ion-icon>
                        </button>
                        <input type="number" class="quantity-input" id="quantityInput" value="1" min="1" max="10"
                            readonly>
                        <button class="quantity-btn" id="increaseBtn">
                            <ion-icon name="add-outline"></ion-icon>
                        </button>
                    </div>
                    <div class="modal-quantity-note">최대 10개 예약 가능</div>
                </div>

                <!-- 이 예약 금액 -->
                <div class="modal-section">
                    <h4 class="modal-section-title">이 예약 금액</h4>
                    <div class="modal-total-price" id="modalTotalPrice">1,500원</div>
                </div>

                <!-- 안내 문구 -->
                <div class="modal-notice">
                    <p>예약 후 타임세일을 통해 재고가 남아 있지 않는다면</p>
                    <p>30분 내 찾아가지 않으면 예약이 자동 취소됩니다.</p>
                </div>
            </div>

            <!-- 예약 버튼 -->
            <div class="modal-footer">
                <button class="modal-reserve-btn" id="confirmBtn">
                    <span id="reserveButtonText">1개 예약하기</span>
                </button>
            </div>
        </div>
    </div>
    <script>
        /**
         * 이미지 URL 생성 헬퍼 함수
         * @param {string|number} pictureIdx - 파일 인덱스 또는 파일 그룹 인덱스
         * @param {string} type - 'file' 또는 'group' (기본값: 'file')
         * @returns {string} - FileController를 통한 이미지 URL
         */
        function getImageUrl(pictureIdx, type = 'file') {
            if (!pictureIdx) {
                return '/images/no-image.png'; // 기본 이미지
            }

            // type이 'group'이면 썸네일 엔드포인트 사용
            if (type === 'group') {
                return `/img/group/${pictureIdx}`;
            }

            // 기본은 파일 ID로 조회
            return `/img/${pictureIdx}`;
        }

        /**
         * 타임세일 페이지 관리
         */
        const TimeSale = {
            // 현재 활성화된 탭
            currentTab: 'food',

            // 데이터 캐시
            cache: {
                food: null,
                store: null
            },

            // 무한 스크롤 설정
            scroll: {
                page: 0,
                itemsPerPage: 10,
                loading: false,
                hasMore: true,
                observer: null
            },

            /**
             * 초기화
             */
            init: function () {
                console.log('[TimeSale] 초기화 시작');
                this.bindEvents();
                this.setupIntersectionObserver();
                this.loadData('food'); // 초기 로딩 (음식 탭)
                console.log('[TimeSale] 초기화 완료');
            },

            /**
             * 이벤트 바인딩
             */
            bindEvents: function () {
                // 음식 탭 클릭
                document.getElementById('tabFood').addEventListener('click', () => {
                    this.switchTab('food');
                });

                // 가게 탭 클릭
                document.getElementById('tabStore').addEventListener('click', () => {
                    this.switchTab('store');
                });
            },

            /**
             * 탭 전환
             */
            switchTab: function (tab) {
                // 현재 탭과 동일하면 아무것도 하지 않음
                if (this.currentTab === tab) {
                    console.log(`[탭] 이미 ${tab} 탭이 활성화되어 있습니다`);
                    return;
                }

                console.log(`[탭] ${this.currentTab} → ${tab} 전환`);
                this.currentTab = tab;

                // 탭 UI 업데이트
                document.getElementById('tabFood').classList.toggle('active', tab === 'food');
                document.getElementById('tabStore').classList.toggle('active', tab === 'store');

                // 리스트 초기화
                this.resetScroll();

                // 데이터 로드 (캐시가 있으면 API 호출 안함)
                this.loadData(tab);
            },

            /**
             * 스크롤 상태 초기화
             */
            resetScroll: function () {
                console.log('[스크롤] 상태 초기화');
                this.scroll.page = 0;
                this.scroll.hasMore = true;
                this.scroll.loading = false;
                document.getElementById('listWrap').innerHTML = '';
                document.getElementById('listStatus').innerHTML = '';
            },

            /**
             * Intersection Observer 설정 (무한 스크롤)
             */
            setupIntersectionObserver: function () {
                const options = {
                    root: null,
                    rootMargin: '200px', // 화면 하단 200px 전에 트리거
                    threshold: 0
                };

                this.scroll.observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        // sentinel이 화면에 보이고, 더 로드할 데이터가 있고, 로딩 중이 아닐 때만
                        if (entry.isIntersecting && this.scroll.hasMore && !this.scroll.loading) {
                            console.log('[Observer] 무한스크롤 트리거');
                            this.loadMoreItems();
                        }
                    });
                }, options);

                // Sentinel 요소 관찰 시작
                const sentinel = document.getElementById('sentinel');
                if (sentinel) {
                    this.scroll.observer.observe(sentinel);
                    console.log('[Observer] Sentinel 관찰 시작');
                } else {
                    console.error('[Observer] Sentinel 요소를 찾을 수 없습니다');
                }
            },

            /**
             * 데이터 로드 (캐시 우선)
             */
            loadData: async function (tab) {
                // 캐시된 데이터가 있으면 사용 (API 호출 안함)
                if (this.cache[tab]) {
                    console.log(`[${tab}] 캐시된 데이터 사용`);
                    this.renderItems(tab, this.cache[tab]);
                    return;
                }

                // API 호출
                try {
                    console.log(`[${tab}] API 호출 시작`);
                    this.showStatus('로딩 중...');

                    let data;
                    if (tab === 'food') {
                        data = await API.get('/timesale/food/list');
                    } else {
                        data = await API.get('/timesale/store/list');
                    }

                    console.log(`[${tab}] API 응답:`, data);

                    // 캐시에 저장
                    this.cache[tab] = data;

                    // 렌더링
                    this.renderItems(tab, data);
                    this.hideStatus();

                } catch (error) {
                    console.error(`[${tab}] API 호출 실패:`, error);
                    this.showStatus('데이터를 불러오는데 실패했습니다.');
                }
            },

            /**
             * 아이템 렌더링
             */
            renderItems: function (tab, data) {
                const listWrap = document.getElementById('listWrap');

                if (!data || data.length === 0) {
                    listWrap.innerHTML = '<div class="no-data">데이터가 없습니다</div>';
                    this.scroll.hasMore = false;
                    return;
                }

                // 무한 스크롤을 위해 일부만 표시
                const startIdx = this.scroll.page * this.scroll.itemsPerPage;
                const endIdx = startIdx + this.scroll.itemsPerPage;
                const itemsToRender = data.slice(startIdx, endIdx);

                console.log(`[렌더링] ${tab} - ${startIdx}~${endIdx} (총 ${data.length}개)`);

                if (itemsToRender.length === 0) {
                    this.scroll.hasMore = false;
                    console.log('[렌더링] 더 이상 표시할 데이터 없음');
                    return;
                }

                // HTML 생성
                const html = itemsToRender.map(item => {
                    if (tab === 'food') {
                        return this.createFoodCard(item);
                    } else {
                        return this.createStoreCard(item);
                    }
                }).join('');

                // DOM에 추가
                if (this.scroll.page === 0) {
                    listWrap.innerHTML = html;
                } else {
                    listWrap.innerHTML += html;
                }

                // 페이지 증가
                this.scroll.page++;

                // 더 이상 데이터가 없으면
                if (endIdx >= data.length) {
                    this.scroll.hasMore = false;
                    console.log('[렌더링] 모든 데이터 표시 완료');
                }
            },

            /**
             * 음식 카드 HTML 생성
             */
            createFoodCard: function (product) {
                const hasDiscount = product.eventPrice && product.eventPrice < product.price;
                const price = hasDiscount ? product.eventPrice : product.price;
                const discountRate = hasDiscount
                    ? Math.round((1 - product.eventPrice / product.price) * 100)
                    : 0;

                // ✅ FileController를 통해 이미지 로드
                const imageUrl = getImageUrl(product.productPictureIdx, 'file');

                return `
                    <div class="food-card" onclick="openReservationModal(${product.productNum})">
                        <img src="${imageUrl}" alt="${product.productName}" class="food-img">
                        <div class="food-info">
                            <h3 class="food-name">${product.productName}</h3>
                            <div class="food-store">${product.storeName}</div>
                            <div class="food-price-wrap">
                                <span class="food-price">${price.toLocaleString()}원</span>
                                ${hasDiscount ? `
                                    <span class="food-original-price">${product.price.toLocaleString()}원</span>
                                    <span class="food-discount">${discountRate}%</span>
                                ` : ''}
                            </div>
                            <div class="food-stock">재고 ${product.productQuantity}개</div>
                        </div>
                    </div>
                `;
            },

            /**
             * 가게 카드 HTML 생성
             */
            createStoreCard: function (store) {
                // ✅ FileController를 통해 썸네일 로드 (group 엔드포인트 사용)
                const imageUrl = getImageUrl(store.storePictureIdx, 'group');

                return `
                    <div class="store-card" onclick="location.href='/timesale/detail?storeIdx=${store.storeIdx}'">
                        <img src="${imageUrl}" alt="${store.storeName}" class="store-img">
                        <div class="store-info">
                            <h3 class="store-name">${store.storeName}</h3>
                            <div class="store-address">${store.storeAddress}</div>
                            <div class="store-time">${store.storeOpenTime} ~ ${store.storeCloseTime}</div>
                            ${store.eventNote ? `<div class="store-event">${store.eventNote}</div>` : ''}
                        </div>
                    </div>
                `;
            },

            /**
             * 더 많은 아이템 로드 (무한 스크롤)
             */
            loadMoreItems: function () {
                console.log('[무한스크롤] 더 로드');
                this.scroll.loading = true;

                const currentData = this.cache[this.currentTab];
                if (currentData) {
                    this.renderItems(this.currentTab, currentData);
                }

                this.scroll.loading = false;
            },

            /**
             * 상태 메시지 표시
             */
            showStatus: function (message) {
                document.getElementById('listStatus').textContent = message;
            },

            /**
             * 상태 메시지 숨기기
             */
            hideStatus: function () {
                document.getElementById('listStatus').textContent = '';
            }
        };

        /**
         * 예약 모달 관리
         */
        const ReservationModal = {
            modal: null,
            overlay: null,
            currentProduct: null,
            quantity: 1,
            maxQuantity: 10,

            /**
             * 초기화
             */
            init: function () {
                this.modal = document.getElementById('reservationModal');
                this.overlay = this.modal.querySelector('.modal-overlay');

                // 이벤트 바인딩
                document.getElementById('modalCloseBtn').addEventListener('click', () => this.close());
                document.getElementById('decreaseBtn').addEventListener('click', () => this.decreaseQuantity());
                document.getElementById('increaseBtn').addEventListener('click', () => this.increaseQuantity());
                document.getElementById('confirmBtn').addEventListener('click', () => this.reserve());
            },

            /**
             * userIdx 가져오기
             */
            getUserIdx: function () {
                // 1순위: Hidden Input
                const hiddenInput = document.getElementById('loginUserIdx');
                if (hiddenInput && hiddenInput.value) {
                    return hiddenInput.value;
                }

                // 2순위: Cookie
                const cookieUserIdx = Utils.getCookie('userIdx');
                if (cookieUserIdx) {
                    return cookieUserIdx;
                }

                // 3순위: localStorage
                const localUserIdx = localStorage.getItem('userIdx');
                if (localUserIdx) {
                    return localUserIdx;
                }

                return null;
            },

            /**
             * 모달 열기
             */
            open: async function (productNum) {
                console.log('[예약모달] 열기 시작 - productNum:', productNum);

                try {
                    // 상품 정보 조회
                    const product = await API.get(`/timesale/product/${productNum}`);
                    console.log('[예약모달] 상품 정보:', product);

                    if (!product) {
                        throw new Error('상품 정보를 찾을 수 없습니다.');
                    }

                    // 현재 상품 저장
                    this.currentProduct = product;
                    this.quantity = 1;
                    this.maxQuantity = Math.min(10, product.productQuantity);

                    // 모달 렌더링
                    this.render();

                    // 모달 표시
                    this.modal.classList.add('active');
                    this.overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';

                } catch (error) {
                    console.error('[예약모달] 열기 실패:', error);
                    Utils.notify('상품 정보를 불러오는데 실패했습니다.', 'error');
                }
            },

            /**
             * 모달 닫기
             */
            close: function () {
                this.modal.classList.remove('active');
                this.overlay.classList.remove('active');
                document.body.style.overflow = '';
                this.currentProduct = null;
                this.quantity = 1;
            },

            /**
             * 수량 감소
             */
            decreaseQuantity: function () {
                if (this.quantity > 1) {
                    this.quantity--;
                    this.updateQuantityDisplay();
                }
            },

            /**
             * 수량 증가
             */
            increaseQuantity: function () {
                if (this.quantity < this.maxQuantity) {
                    this.quantity++;
                    this.updateQuantityDisplay();
                }
            },

            /**
             * 수량 표시 업데이트
             */
            updateQuantityDisplay: function () {
                const quantityInput = document.getElementById('quantityInput');
                const totalPriceEl = document.getElementById('modalTotalPrice');

                if (quantityInput) {
                    quantityInput.value = this.quantity;
                }

                if (totalPriceEl && this.currentProduct) {
                    const price = this.currentProduct.eventPrice || this.currentProduct.price;
                    const total = price * this.quantity;
                    totalPriceEl.textContent = total.toLocaleString() + '원';
                }
            },

            /**
             * 모달 렌더링
             */
            render: function () {
                if (!this.currentProduct) return;

                const product = this.currentProduct;
                const price = product.eventPrice || product.price;
                const totalPrice = price * this.quantity;
                const hasDiscount = product.eventPrice && product.eventPrice < product.price;

                console.log('[예약모달] 렌더링 시작 - product:', product);

                // 가게 이름
                const storeNameEl = document.getElementById('modalStoreName');
                if (storeNameEl) {
                    storeNameEl.textContent = product.storeName || '로딩 중...';
                }

                // ✅ 상품 이미지 - FileController를 통해 로드
                const productImg = document.getElementById('modalProductImg');
                if (productImg) {
                    const imageUrl = getImageUrl(product.productPictureIdx, 'file');
                    productImg.src = imageUrl;
                    productImg.alt = product.productName;
                }

                // 상품명
                const productNameEl = document.getElementById('modalProductName');
                if (productNameEl) {
                    productNameEl.textContent = product.productName;
                }

                // 현재 가격
                const priceEl = document.getElementById('modalPrice');
                if (priceEl) {
                    priceEl.textContent = price.toLocaleString() + '원';
                }

                // 원래 가격 (할인 있을 때만)
                const originalPriceEl = document.getElementById('modalOriginalPrice');
                if (originalPriceEl) {
                    if (hasDiscount) {
                        originalPriceEl.textContent = product.price.toLocaleString() + '원';
                        originalPriceEl.style.display = 'inline';
                    } else {
                        originalPriceEl.style.display = 'none';
                    }
                }

                // 재고 정보
                const saleTimeEl = document.getElementById('modalSaleTime');
                if (saleTimeEl) {
                    saleTimeEl.textContent = `재고 ${product.productQuantity}개 남음`;
                }

                // 수량
                const quantityInput = document.getElementById('quantityInput');
                if (quantityInput) {
                    quantityInput.value = this.quantity;
                    quantityInput.max = this.maxQuantity;
                }

                // 수량 안내
                const quantityNote = this.modal.querySelector('.modal-quantity-note');
                if (quantityNote) {
                    quantityNote.textContent = `최대 ${this.maxQuantity}개 예약 가능`;
                }

                // 총 금액
                const totalPriceEl = document.getElementById('modalTotalPrice');
                if (totalPriceEl) {
                    totalPriceEl.textContent = totalPrice.toLocaleString() + '원';
                }

                console.log('[예약모달] 렌더링 완료');
            },

            /**
             * 예약 처리
             */
            reserve: async function () {
                console.log('[예약] 시작 - 수량:', this.quantity);

                if (!this.currentProduct) {
                    Utils.notify('상품 정보가 없습니다.', 'error');
                    return;
                }

                try {
                    // ⭐ userIdx 가져오기 (우선순위: Hidden Input → Cookie → localStorage)
                    const userIdx = this.getUserIdx();

                    if (!userIdx) {
                        Utils.notify('로그인이 필요합니다.', 'warning');
                        setTimeout(() => {
                            window.location.href = '/auth/login';
                        }, 1000);
                        return;
                    }

                    console.log('[예약] userIdx:', userIdx);

                    // 예약 데이터 준비
                    const reservationData = {
                        userIdx: parseInt(userIdx),  // ⭐ 숫자로 변환
                        productNum: this.currentProduct.productNum,
                        storeIdx: this.currentProduct.storeIdx,
                        productName: this.currentProduct.productName,
                        orderQuantity: this.quantity,
                        totalPrice: (this.currentProduct.eventPrice || this.currentProduct.price) * this.quantity,
                        orderTime: null,
                        orderStatus: null,
                        orderIndex: null,
                        cancelledAt: null,
                        cancelReason: null
                    };

                    console.log('[예약] 데이터:', reservationData);

                    // 예약 API 호출
                    const response = await API.post('/timesale/reserve', reservationData);

                    Utils.notify('예약이 완료되었습니다!', 'success');
                    this.close();

                    // 페이지 새로고침 (재고 업데이트 반영)
                    setTimeout(() => {
                        location.reload();
                    }, 1000);

                } catch (error) {
                    console.error('[예약] 실패:', error);
                    Utils.notify(error.message || '예약에 실패했습니다.', 'error');
                }
            }
        };

        // 전역 함수로 노출
        window.openReservationModal = function (productNum) {
            ReservationModal.open(productNum);
        };

        window.closeReservationModal = function () {
            ReservationModal.close();
        };

        // DOM 로드 후 초기화
        document.addEventListener('DOMContentLoaded', () => {
            TimeSale.init();
            ReservationModal.init();
        });
    </script>
</div>
