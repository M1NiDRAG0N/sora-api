<div th:fragment="div" class="timesale-page" id="saleContent">
    <input type="hidden" id="loginUserIdx" th:value="${#authentication.principal.userIdx}">
    <div class="map-wrap">
        <div class="map-box">
            <div id="map" style="width: 100%; height: 100%; display: none;"></div>
            <div class="map-placeholder" id="mapPlaceholder" style="display: flex;">
                지도를 불러오는 중...
            </div>
        </div>
    </div>

    <div class="sale-content no-scrollbar" id="saleScrollContainer">
        <div class="tab-wrap">
            <div class="tabs">
                <div class="tab-btn active" id="tabFood">음식</div>
                <div class="tab-btn" id="tabStore">가게</div>
            </div>
        </div>

        <div class="list-wrap" id="listWrap"></div>
        <div class="list-status" id="listStatus"></div>
        <div id="sentinel"></div>
    </div>
    <!-- 예약 모달 -->
    <div class="reservation-modal" id="reservationModal">
        <div class="modal-overlay" onclick="closeReservationModal()"></div>
        <div class="modal-content">
            <!-- 헤더 -->
            <div class="modal-header">
                <div class="modal-back-btn" id="modalCloseBtn">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </div>
                <h2 class="modal-title">상품 예약</h2>
                <div class="modal-spacer"></div>
            </div>

            <!-- 스크롤 영역 -->
            <div class="modal-body">
                <!-- 가게 정보 -->
                <div class="modal-store-info">
                    <ion-icon name="storefront-outline"></ion-icon>
                    <span id="modalStoreName">로딩 중...</span>
                </div>

                <!-- 상품 정보 -->
                <div class="modal-product-card">
                    <img src="" alt="상품 이미지" class="modal-product-img" id="modalProductImg">
                    <div class="modal-product-info">
                        <h3 class="modal-product-name" id="modalProductName">상품명</h3>
                        <div class="modal-price-wrap">
                            <span class="modal-price-current" id="modalPrice">0원</span>
                            <span class="modal-price-original" id="modalOriginalPrice">0원</span>
                        </div>
                        <div class="modal-sale-time" id="modalSaleTime">재고 0개 남음</div>
                    </div>
                </div>

                <!-- 예약할 수량 -->
                <div class="modal-section">
                    <h4 class="modal-section-title">예약할 수량</h4>
                    <div class="modal-quantity-control">
                        <button class="quantity-btn" id="decreaseBtn">
                            <ion-icon name="remove-outline"></ion-icon>
                        </button>
                        <input type="number" class="quantity-input" id="quantityInput" value="1" min="1" max="10"
                            readonly>
                        <button class="quantity-btn" id="increaseBtn">
                            <ion-icon name="add-outline"></ion-icon>
                        </button>
                    </div>
                    <div class="modal-quantity-note">최대 10개 예약 가능</div>
                </div>

                <!-- 이 예약 금액 -->
                <div class="modal-section">
                    <h4 class="modal-section-title">이 예약 금액</h4>
                    <div class="modal-total-price" id="modalTotalPrice">1,500원</div>
                </div>

                <!-- 안내 문구 -->
                <div class="modal-notice">
                    <p>예약 후 타임세일을 통해 재고가 남아 있지 않는다면</p>
                    <p>30분 내 찾아가지 않으면 예약이 자동 취소됩니다.</p>
                </div>
            </div>

            <!-- 예약 버튼 -->
            <div class="modal-footer">
                <button class="modal-reserve-btn" id="confirmBtn">
                    <span id="reserveButtonText">예약하기</span>
                </button>
            </div>
        </div>
    </div>
    <script>
        /**
         * 이미지 URL 생성 헬퍼 함수
         * @param {string|number} fileIdx - FILE_IDX
         * @returns {string} - FileController 경로
         */
        function getImageUrl(fileIdx) {
            if (!fileIdx) {
                return '/images/no-image.png';
            }
            return `/img/${fileIdx}`;
        }

        function formatTime(timeString) {
            if (!timeString) return '';
            const parts = timeString.split(':');
            if (parts.length < 2) return timeString;
            let hours = parseInt(parts[0]);
            const minutes = parts[1];
            const period = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${String(hours).padStart(2, '0')}:${minutes} ${period}`;
        }

        /**
         * 타임세일 페이지 관리
         */
        const TimeSale = {
            // 현재 활성화된 탭
            currentTab: 'food',

            // 데이터 캐시
            cache: {
                food: null,
                store: null,
                _storeLoc: null  // 음식 정렬용 가게 좌표 (가게탭 캐시와 분리)
            },

            // 유저 위치 (거리 정렬용)
            userLocation: null,

            // 무한 스크롤 설정
            scroll: {
                page: 0,
                itemsPerPage: 10,
                loading: false,
                hasMore: true,
                observer: null
            },

            /**
             * 초기화
             */
            init: async function () {
                console.log('[TimeSale] 초기화 시작');
                this.bindEvents();
                await this.loadUserLocation();
                this.loadData('food');
                console.log('[TimeSale] 초기화 완료');
            },

            /**
             * 이벤트 바인딩
             */
            bindEvents: function () {
                // 음식 탭 클릭
                document.getElementById('tabFood').addEventListener('click', () => {
                    this.switchTab('food');
                });

                // 가게 탭 클릭
                document.getElementById('tabStore').addEventListener('click', () => {
                    this.switchTab('store');
                });
            },

            /**
             * 탭 전환
             */
            switchTab: function (tab) {
                // 현재 탭과 동일하면 아무것도 하지 않음
                if (this.currentTab === tab) {
                    console.log(`[탭] 이미 ${tab} 탭이 활성화되어 있습니다`);
                    return;
                }

                console.log(`[탭] ${this.currentTab} → ${tab} 전환`);
                this.currentTab = tab;

                // 탭 UI 업데이트
                document.getElementById('tabFood').classList.toggle('active', tab === 'food');
                document.getElementById('tabStore').classList.toggle('active', tab === 'store');

                // 리스트 초기화
                this.resetScroll();

                // 데이터 로드 (캐시가 있으면 API 호출 안함)
                this.loadData(tab);
            },

            /**
             * 스크롤 상태 초기화
             */
            resetScroll: function () {
                console.log('[스크롤] 상태 초기화');
                this.scroll.page = 0;
                this.scroll.hasMore = true;
                this.scroll.loading = false;
                if (this.scroll.observer) {
                    this.scroll.observer.disconnect();
                    this.scroll.observer = null;
                }
                document.getElementById('listWrap').innerHTML = '';
                document.getElementById('listStatus').innerHTML = '';
            },

            /**
             * Intersection Observer 설정 (무한 스크롤)
             */
            setupIntersectionObserver: function () {
                const sentinel = document.getElementById('sentinel');
                if (!sentinel) {
                    console.error('[Observer] Sentinel 요소를 찾을 수 없습니다');
                    return;
                }

                const scrollContainer = document.getElementById('saleScrollContainer');

                const options = {
                    root: scrollContainer || null,
                    rootMargin: '200px',
                    threshold: 0
                };

                if (this.scroll.observer) {
                    this.scroll.observer.disconnect();
                }

                this.scroll.observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && this.scroll.hasMore && !this.scroll.loading) {
                            console.log('[Observer] 무한스크롤 트리거');
                            this.loadMoreItems();
                        }
                    });
                }, options);

                this.scroll.observer.observe(sentinel);
                console.log('[Observer] Sentinel 관찰 시작, root:', scrollContainer);
            },

            /**
             * 유저 위치 로드 (거리 정렬용)
             */
            loadUserLocation: async function () {
                try {
                    const userIdxEl = document.getElementById('loginUserIdx');
                    if (!userIdxEl || !userIdxEl.value) return;
                    const res = await fetch(`/timesale/map/user/${userIdxEl.value}`);
                    if (!res.ok) return;
                    const user = await res.json();
                    const lat = user.userLat ?? user.user_lat ?? user.lat ?? null;
                    const lng = user.userLng ?? user.user_lng ?? user.lng ?? null;
                    if (lat != null && lng != null) {
                        this.userLocation = { lat: parseFloat(lat), lng: parseFloat(lng) };
                        console.log('[정렬] 유저 위치:', this.userLocation);
                    }
                } catch (e) {
                    console.error('[정렬] 유저 위치 로드 실패:', e);
                }
            },

            /**
             * 데이터 로드 + 거리순 정렬 (음식/가게 공통)
             */
            loadData: async function (tab) {
                if (this.cache[tab]) {
                    console.log(`[${tab}] 캐시된 데이터 사용`);
                    this.renderItems(tab, this.cache[tab]);
                    setTimeout(() => { this.setupIntersectionObserver(); }, 100);
                    return;
                }

                try {
                    console.log(`[${tab}] API 호출 시작`);
                    this.showStatus('로딩 중...');

                    let data;
                    if (tab === 'food') {
                        // 음식 + 가게 좌표 동시 로드 (_storeLoc: 음식 정렬 전용)
                        const [foodData, storeData] = await Promise.all([
                            API.get('/timesale/food/list'),
                            this.cache._storeLoc ? Promise.resolve(this.cache._storeLoc) : API.get('/timesale/store/list')
                        ]);
                        if (!this.cache._storeLoc) this.cache._storeLoc = storeData;

                        // storeIdx → {lat, lng} 맵
                        const storeLocMap = {};
                        storeData.forEach(s => {
                            if (s.storeLat != null && s.storeLng != null) {
                                storeLocMap[s.storeIdx] = { lat: s.storeLat, lng: s.storeLng };
                            }
                        });

                        if (this.userLocation) {
                            data = this.sortFoodByDistance(foodData, storeLocMap, this.userLocation);
                        } else {
                            data = foodData;
                        }
                    } else {
                        data = await API.get('/timesale/store/list');
                        if (this.userLocation) {
                            data = this.sortStoreByDistance(data, this.userLocation);
                        }
                    }

                    console.log(`[${tab}] 정렬 완료:`, data.length, '건');
                    this.cache[tab] = data;
                    this.renderItems(tab, data);
                    this.hideStatus();
                    setTimeout(() => { this.setupIntersectionObserver(); }, 100);

                } catch (error) {
                    console.error(`[${tab}] API 호출 실패:`, error);
                    this.showStatus('데이터를 불러오는데 실패했습니다.');
                }
            },

            /**
             * 음식 거리순 정렬 (음식→소속 가게 좌표→유저 거리)
             */
            sortFoodByDistance: function (foodList, storeLocMap, userLoc) {
                return [...foodList].sort((a, b) => {
                    const locA = storeLocMap[a.storeIdx];
                    const locB = storeLocMap[b.storeIdx];
                    const distA = locA ? this.calcDistance(userLoc.lat, userLoc.lng, locA.lat, locA.lng) : null;
                    const distB = locB ? this.calcDistance(userLoc.lat, userLoc.lng, locB.lat, locB.lng) : null;
                    if (distA === null && distB === null) return 0;
                    if (distA === null) return 1;
                    if (distB === null) return -1;
                    return distA - distB;
                });
            },

            /**
             * 가게 거리순 정렬
             */
            sortStoreByDistance: function (storeList, userLoc) {
                return [...storeList].sort((a, b) => {
                    const distA = this.calcDistance(userLoc.lat, userLoc.lng, a.storeLat, a.storeLng);
                    const distB = this.calcDistance(userLoc.lat, userLoc.lng, b.storeLat, b.storeLng);
                    if (distA === null && distB === null) return 0;
                    if (distA === null) return 1;
                    if (distB === null) return -1;
                    return distA - distB;
                });
            },

            /**
             * Haversine - 두 좌표 간 거리 (km)
             */
            calcDistance: function (lat1, lng1, lat2, lng2) {
                if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return null;
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            },

            /**
             * 아이템 렌더링
             */
            renderItems: function (tab, data) {
                const listWrap = document.getElementById('listWrap');

                if (!data || data.length === 0) {
                    listWrap.innerHTML = '<div class="no-data">데이터가 없습니다</div>';
                    this.scroll.hasMore = false;
                    return;
                }

                // 무한 스크롤을 위해 일부만 표시
                const startIdx = this.scroll.page * this.scroll.itemsPerPage;
                const endIdx = startIdx + this.scroll.itemsPerPage;
                const itemsToRender = data.slice(startIdx, endIdx);

                console.log(`[렌더링] ${tab} - ${startIdx}~${endIdx} (총 ${data.length}개)`);

                if (itemsToRender.length === 0) {
                    this.scroll.hasMore = false;
                    console.log('[렌더링] 더 이상 표시할 데이터 없음');
                    return;
                }

                // HTML 생성 (음식탭: 재고 0개 제외)
                const html = itemsToRender
                    .filter(item => tab !== 'food' || (item.productQuantity > 0))
                    .map(item => {
                        if (tab === 'food') {
                            return this.createFoodCard(item);
                        } else {
                            return this.createStoreCard(item);
                        }
                    }).join('');

                // DOM에 추가
                if (this.scroll.page === 0) {
                    listWrap.innerHTML = html;
                } else {
                    listWrap.innerHTML += html;
                }

                // 페이지 증가
                this.scroll.page++;

                // 더 이상 데이터가 없으면
                if (endIdx >= data.length) {
                    this.scroll.hasMore = false;
                    console.log('[렌더링] 모든 데이터 표시 완료');
                }
            },

            /**
             * 음식 카드 HTML 생성
             */
            createFoodCard: function (product) {
                const hasDiscount = product.eventPrice && product.eventPrice < product.price;
                const price = hasDiscount ? product.eventPrice : product.price;
                const discountRate = hasDiscount
                    ? Math.round((1 - product.eventPrice / product.price) * 100)
                    : 0;

                // ✅ 이미지 경로 생성
                const imageUrl = getImageUrl(product.productPictureIdx);

                return `
                    <div class="food-card" onclick="openReservationModal(${product.productNum})">
                        <img src="${imageUrl}" alt="${product.productName}" class="food-img">
                        <div class="food-info">
                            <h3 class="food-name">${product.productName}</h3>
                            <div class="food-store">${product.storeName}</div>
                            <div class="food-price-wrap">
                                <span class="food-price">${price.toLocaleString()}원</span>
                                ${hasDiscount ? `
                                    <span class="food-original-price">${product.price.toLocaleString()}원</span>
                                    <span class="food-discount">${discountRate}%</span>
                                ` : ''}
                            </div>
                            ${product.productQuantity > 0 ? `<div class="food-stock">재고 ${product.productQuantity}개</div>` : ''}
                        </div>
                    </div>
                `;
            },

            /**
             * 가게 카드 HTML 생성
             */
            createStoreCard: function (store) {
                // ✅ 이미지 경로 생성
                const imageUrl = getImageUrl(store.storePictureIdx);

                const openTime = formatTime(store.storeOpenTime);
                const closeTime = formatTime(store.storeCloseTime);
                const hasEvent = store.eventStartTime && store.eventEndTime;
                const eventStart = hasEvent ? formatTime(store.eventStartTime) : '';
                const eventEnd = hasEvent ? formatTime(store.eventEndTime) : '';

                return `
                    <div class="store-card" onclick="location.href='/timesale/detail?storeIdx=${store.storeIdx}'">
                        <div class="store-info">
                            <h3 class="store-name">${store.storeName}</h3>
                            <div class="store-address">${store.storeAddress}</div>
                            <div class="store-time">${openTime} ~ ${closeTime}</div>
                            ${hasEvent ? `<div class="store-time" style="color:#ff6b6b;">⚡ 할인 ${eventStart} ~ ${eventEnd}</div>` : ''}
                            ${store.eventNote ? `<div class="store-event">${store.eventNote}</div>` : ''}
                            </div>
                        <div class="store-thumb">
                            <img src="${imageUrl}" alt="${store.storeName}" class="store-img">
                        </div>
                    </div>
                `;
            },

            /**
             * 더 많은 아이템 로드 (무한 스크롤)
             */
            loadMoreItems: function () {
                console.log('[무한스크롤] 더 로드');
                this.scroll.loading = true;

                const currentData = this.cache[this.currentTab];
                if (currentData) {
                    this.renderItems(this.currentTab, currentData);
                }

                this.scroll.loading = false;
            },

            /**
             * 상태 메시지 표시
             */
            showStatus: function (message) {
                document.getElementById('listStatus').textContent = message;
            },

            /**
             * 상태 메시지 숨기기
             */
            hideStatus: function () {
                document.getElementById('listStatus').textContent = '';
            }
        };

        /**
         * 예약 모달 관리
         */
        const ReservationModal = {
            modal: null,
            overlay: null,
            currentProduct: null,
            quantity: 1,
            maxQuantity: 10,

            /**
             * 초기화
             */
            init: function () {
                this.modal = document.getElementById('reservationModal');
                this.overlay = this.modal.querySelector('.modal-overlay');

                // 이벤트 바인딩
                document.getElementById('modalCloseBtn').addEventListener('click', () => this.close());
                document.getElementById('decreaseBtn').addEventListener('click', () => this.decreaseQuantity());
                document.getElementById('increaseBtn').addEventListener('click', () => this.increaseQuantity());
                document.getElementById('confirmBtn').addEventListener('click', () => this.reserve());
            },

            /**
             * userIdx 가져오기
             */
            getUserIdx: function () {
                // 1순위: Hidden Input
                const hiddenInput = document.getElementById('loginUserIdx');
                if (hiddenInput && hiddenInput.value) {
                    return hiddenInput.value;
                }

                // 2순위: Cookie
                const cookieUserIdx = Utils.getCookie('userIdx');
                if (cookieUserIdx) {
                    return cookieUserIdx;
                }

                // 3순위: localStorage
                const localUserIdx = localStorage.getItem('userIdx');
                if (localUserIdx) {
                    return localUserIdx;
                }

                return null;
            },

            /**
             * 모달 열기
             */
            open: async function (productNum) {
                console.log('[예약모달] 열기 시작 - productNum:', productNum);

                try {
                    // 상품 정보 조회
                    const product = await API.get(`/timesale/product/${productNum}`);
                    console.log('[예약모달] 상품 정보:', product);

                    if (!product) {
                        throw new Error('상품 정보를 찾을 수 없습니다.');
                    }

                    // 현재 상품 저장
                    this.currentProduct = product;
                    this.quantity = 1;
                    this.maxQuantity = Math.min(10, product.productQuantity);

                    // 모달 렌더링
                    this.render();

                    // 모달 표시
                    this.modal.classList.add('active');
                    this.overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';

                } catch (error) {
                    console.error('[예약모달] 열기 실패:', error);
                    Utils.notify('상품 정보를 불러오는데 실패했습니다.', 'error');
                }
            },

            /**
             * 모달 닫기
             */
            close: function () {
                this.modal.classList.remove('active');
                this.overlay.classList.remove('active');
                document.body.style.overflow = '';
                this.currentProduct = null;
                this.quantity = 1;
            },

            /**
             * 수량 감소
             */
            decreaseQuantity: function () {
                if (this.quantity > 1) {
                    this.quantity--;
                    this.updateQuantityDisplay();
                }
            },

            /**
             * 수량 증가
             */
            increaseQuantity: function () {
                if (this.quantity < this.maxQuantity) {
                    this.quantity++;
                    this.updateQuantityDisplay();
                }
            },

            /**
             * 수량 표시 업데이트
             */
            updateQuantityDisplay: function () {
                const quantityInput = document.getElementById('quantityInput');
                const totalPriceEl = document.getElementById('modalTotalPrice');
                const reserveTextEl = document.getElementById('reserveButtonText');

                if (quantityInput) {
                    quantityInput.value = this.quantity;
                }

                if (totalPriceEl && this.currentProduct) {
                    const price = this.currentProduct.eventPrice || this.currentProduct.price;
                    const total = price * this.quantity;
                    totalPriceEl.textContent = total.toLocaleString() + '원';
                }

                // 버튼 텍스트도 갱신
                if (reserveTextEl) {
                    reserveTextEl.textContent = `${this.quantity}개 예약하기`;
                }
            },

            /**
             * 모달 렌더링
             */
            render: function () {
                if (!this.currentProduct) return;

                const product = this.currentProduct;
                const price = product.eventPrice || product.price;
                const totalPrice = price * this.quantity;
                const hasDiscount = product.eventPrice && product.eventPrice < product.price;

                console.log('[예약모달] 렌더링 시작 - product:', product);

                // 가게 이름
                const storeNameEl = document.getElementById('modalStoreName');
                if (storeNameEl) {
                    storeNameEl.textContent = product.storeName || '로딩 중...';
                }

                // ✅ 상품 이미지
                const productImg = document.getElementById('modalProductImg');
                if (productImg) {
                    const imageUrl = getImageUrl(product.productPictureIdx);
                    productImg.src = imageUrl;
                    productImg.alt = product.productName;
                }

                // 상품명
                const productNameEl = document.getElementById('modalProductName');
                if (productNameEl) {
                    productNameEl.textContent = product.productName;
                }

                // 현재 가격
                const priceEl = document.getElementById('modalPrice');
                if (priceEl) {
                    priceEl.textContent = price.toLocaleString() + '원';
                }

                // 원래 가격 (할인 있을 때만)
                const originalPriceEl = document.getElementById('modalOriginalPrice');
                if (originalPriceEl) {
                    if (hasDiscount) {
                        originalPriceEl.textContent = product.price.toLocaleString() + '원';
                        originalPriceEl.style.display = 'inline';
                    } else {
                        originalPriceEl.style.display = 'none';
                    }
                }

                // 재고 정보
                const saleTimeEl = document.getElementById('modalSaleTime');
                if (saleTimeEl) {
                    saleTimeEl.textContent = `재고 ${product.productQuantity}개 남음`;
                }

                // 수량
                const quantityInput = document.getElementById('quantityInput');
                if (quantityInput) {
                    quantityInput.value = this.quantity;
                    quantityInput.max = this.maxQuantity;
                }

                // 수량 안내
                const quantityNote = this.modal.querySelector('.modal-quantity-note');
                if (quantityNote) {
                    quantityNote.textContent = `최대 ${this.maxQuantity}개 예약 가능`;
                }

                // 총 금액
                const totalPriceEl = document.getElementById('modalTotalPrice');
                if (totalPriceEl) {
                    totalPriceEl.textContent = totalPrice.toLocaleString() + '원';
                }

                // 예약 버튼 텍스트 초기화 (수량이 1로 설정됐을 때)
                this.updateQuantityDisplay();

                console.log('[예약모달] 렌더링 완료');
            },

            /**
             * 예약 처리
             */
            reserve: async function () {
                console.log('[예약] 시작 - 수량:', this.quantity);

                if (!this.currentProduct) {
                    Utils.notify('상품 정보가 없습니다.', 'error');
                    return;
                }

                try {
                    // ⭐ userIdx 가져오기 (우선순위: Hidden Input → Cookie → localStorage)
                    const userIdx = this.getUserIdx();

                    if (!userIdx) {
                        Utils.notify('로그인이 필요합니다.', 'warning');
                        setTimeout(() => {
                            window.location.href = '/auth/login';
                        }, 1000);
                        return;
                    }

                    console.log('[예약] userIdx:', userIdx);

                    // 예약 데이터 준비
                    const reservationData = {
                        userIdx: parseInt(userIdx),  // ⭐ 숫자로 변환
                        productNum: this.currentProduct.productNum,
                        storeIdx: this.currentProduct.storeIdx,
                        productName: this.currentProduct.productName,
                        orderQuantity: this.quantity,
                        totalPrice: (this.currentProduct.eventPrice || this.currentProduct.price) * this.quantity,
                        orderTime: null,
                        orderStatus: null,
                        orderIndex: null,
                        cancelledAt: null,
                        cancelReason: null
                    };

                    console.log('[예약] 데이터:', reservationData);

                    // 예약 API 호출
                    const response = await API.post('/timesale/reserve', reservationData);

                    Utils.notify('예약이 완료되었습니다!', 'success');
                    this.close();

                    // 페이지 새로고침 (재고 업데이트 반영)
                    setTimeout(() => {
                        location.reload();
                    }, 1000);

                } catch (error) {
                    console.error('[예약] 실패:', error);
                    Utils.notify(error.message || '예약에 실패했습니다.', 'error');
                }
            }
        };

        // 전역 함수로 노출
        window.openReservationModal = function (productNum) {
            ReservationModal.open(productNum);
        };

        window.closeReservationModal = function () {
            ReservationModal.close();
        };

        // DOM 로드 후 초기화
        document.addEventListener('DOMContentLoaded', () => {
            TimeSale.init();
            ReservationModal.init();
        });
    </script>

    <!-- 구글맵 API -->
    <script th:inline="javascript">
        const TimeSaleMap = {
            map: null,
            markers: [],
            userMarker: null,
            infoWindows: [],

            init: async function () {
                console.log('[TimeSaleMap] 초기화 시작');
                try {
                    const defaultCenter = { lat: 37.5665, lng: 126.9780 };
                    const { Map } = await google.maps.importLibrary("maps");

                    // 맵 로드 성공 시 placeholder 숨기고 map 표시
                    document.getElementById('map').style.display = 'block';
                    document.getElementById('mapPlaceholder').style.display = 'none';

                    const mapEl = document.getElementById('map');

                    this.map = new Map(mapEl, {
                        center: defaultCenter,
                        zoom: 14,
                        mapId: 'timesale_map',
                        zoomControl: true,
                        streetViewControl: false,
                        mapTypeControl: false,
                        fullscreenControl: false,
                        gestureHandling: 'greedy',
                        draggable: true,
                    });

                    // 지도가 완전히 렌더링된 후 resize 이벤트 강제 트리거 (드래그 영역 확정)
                    google.maps.event.addListenerOnce(this.map, 'idle', () => {
                        google.maps.event.trigger(this.map, 'resize');
                        console.log('[TimeSaleMap] resize 트리거 완료');
                    });

                    // 유저 마커 먼저 (중심 설정) → 가게 마커
                    await this.loadUserMarker();
                    await this.loadStoreMarkers();

                    console.log('[TimeSaleMap] 초기화 완료');
                } catch (e) {
                    console.error('[TimeSaleMap] 초기화 실패:', e);
                }
            },

            loadUserMarker: async function () {
                const userIdxEl = document.getElementById('loginUserIdx');
                console.log('[TimeSaleMap] loginUserIdx 값:', userIdxEl ? userIdxEl.value : '없음');

                if (!userIdxEl || !userIdxEl.value) {
                    console.warn('[TimeSaleMap] userIdx 없음 - 로그인 확인 필요');
                    return;
                }

                try {
                    const url = `/timesale/map/user/${userIdxEl.value}`;
                    console.log('[TimeSaleMap] 유저 API 호출:', url);

                    const res = await fetch(url);
                    console.log('[TimeSaleMap] 유저 API 응답 상태:', res.status);

                    if (!res.ok) {
                        console.warn('[TimeSaleMap] 유저 API 실패 - status:', res.status);
                        return;
                    }

                    const user = await res.json();
                    console.log('[TimeSaleMap] 유저 데이터 전체:', JSON.stringify(user));

                    // Spring JSON 직렬화에 따라 필드명이 다를 수 있으므로 가능한 키 모두 시도
                    const lat = user.userLat ?? user.user_lat ?? user.lat ?? null;
                    const lng = user.userLng ?? user.user_lng ?? user.lng ?? null;

                    console.log('[TimeSaleMap] 파싱된 좌표 - lat:', lat, 'lng:', lng);

                    if (lat == null || lng == null) {
                        console.warn('[TimeSaleMap] 유저 좌표 없음. 실제 필드명:', Object.keys(user));
                        return;
                    }

                    const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

                    const pin = new PinElement({
                        background: '#4A90E2',
                        borderColor: '#2C5F8A',
                        glyphColor: '#FFFFFF',
                        glyph: '👤',
                        scale: 1.2,
                    });

                    this.userMarker = new AdvancedMarkerElement({
                        map: this.map,
                        position: { lat: lat, lng: lng },
                        content: pin.element,
                        title: `나 (${user.userNickname})`,
                    });

                    // 유저 위치로 중심 이동
                    this.map.setCenter({ lat: lat, lng: lng });
                    console.log('[TimeSaleMap] 유저 마커 추가 및 중심 이동 완료:', user.userNickname, lat, lng);

                } catch (e) {
                    console.error('[TimeSaleMap] 유저 마커 로드 실패:', e);
                }
            },

            loadStoreMarkers: async function () {
                try {
                    const res = await fetch('/timesale/store/list');
                    if (!res.ok) throw new Error('가게 목록 API 실패');

                    const stores = await res.json();
                    console.log('[TimeSaleMap] 가게 수:', stores.length);

                    const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

                    stores.forEach(store => {
                        if (store.storeLat == null || store.storeLng == null) return;

                        const isEvent = store.eventState && store.eventState.includes('진행');
                        const pin = new PinElement({
                            background: isEvent ? '#E74C3C' : '#F39C12',
                            borderColor: isEvent ? '#922B21' : '#9A6E0A',
                            glyphColor: '#FFFFFF',
                            glyph: '🏪',
                        });

                        const marker = new AdvancedMarkerElement({
                            map: this.map,
                            position: { lat: store.storeLat, lng: store.storeLng },
                            content: pin.element,
                            title: store.storeName,
                        });

                        // 핀 클릭 시 바로 상세 페이지로 이동
                        marker.addListener('click', () => {
                            window.location.href = `/timesale/detail?storeIdx=${store.storeIdx}`;
                        });

                        this.markers.push(marker);
                    });

                    console.log('[TimeSaleMap] 가게 마커 추가 완료:', this.markers.length);
                } catch (e) {
                    console.error('[TimeSaleMap] 가게 마커 로드 실패:', e);
                }
            }
        };

        // 타임세일 전용 구글맵 로드
        (async function loadGoogleMaps() {
            try {
                const res = await fetch('/timesale/map/key');
                const apiKey = await res.text();

                if (!apiKey || apiKey === 'default-key' || apiKey.trim() === '') {
                    console.warn('[GoogleMaps] API 키가 없습니다.');
                    document.getElementById('map').style.display = 'none';
                    document.getElementById('mapPlaceholder').style.display = 'flex';
                    return;
                }

                // 구글맵 로드 완료 후 호출될 전역 콜백
                window.initTimeSaleMap = () => TimeSaleMap.init();

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=maps,marker&callback=initTimeSaleMap`;
                script.async = true;
                script.defer = true;
                script.onerror = () => {
                    console.error('[GoogleMaps] API 로드 실패');
                    document.getElementById('map').style.display = 'none';
                    document.getElementById('mapPlaceholder').style.display = 'flex';
                };
                document.head.appendChild(script);
            } catch (e) {
                console.error('[GoogleMaps] API 키 조회 실패:', e);
            }
        })();
    </script>
