<!-- 통일된 구조: 중고거래 페이지 -->
<div class="page-wrapper usedmarket-page" th:fragment="div">
    
    <!-- [1] 헤더 (고정) - 검색 영역 -->
    <div class="page-header">
        <div class="header-row">
            <input type="text" id="mainSearchInput" class="header-search-input" placeholder="삼성1동 근처에서 검색">
            <ion-icon name="search" class="search-icon"></ion-icon>
        </div>
    </div>

    <!-- [2] 콘텐츠 (스크롤 영역) - 상품 리스트 -->
    <div class="page-content">
        <div class="content-inner">
            <div class="content-list" id="contentList">
                <!-- 더미 아이템 -->
                <div class="market-item">
                    <img src="https://picsum.photos/200?random=1" class="item-thumb" alt="상품">
                    <div class="item-info">
                        <div>
                            <div class="item-title">아이패드 에어 5세대 스페이스 그레이 풀박스 팝니다</div>
                            <div class="item-meta">역삼1동 · 2분 전</div>
                            <div class="item-price">650,000원</div>
                        </div>
                        <div class="item-stats">
                            <span class="stat-icon"><ion-icon name="chatbubble-outline"></ion-icon> 2</span>
                            <span class="stat-icon"><ion-icon name="heart-outline"></ion-icon> 5</span>
                        </div>
                    </div>
                </div>

                <div class="market-item">
                    <img src="https://picsum.photos/200?random=2" class="item-thumb" alt="상품">
                    <div class="item-info">
                        <div>
                            <div class="item-title">소라고동 한정판 굿즈 미개봉</div>
                            <div class="item-meta">청담동 · 1시간 전</div>
                            <div class="item-price">50,000원</div>
                        </div>
                        <div class="item-stats">
                            <span class="stat-icon"><ion-icon name="chatbubble-outline"></ion-icon> 1</span>
                            <span class="stat-icon"><ion-icon name="heart-outline"></ion-icon> 4</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="statusContainer" class="status-container hide">
                <ion-icon name="reload-outline" class="spin-icon"></ion-icon>
                <span>불러오는 중...</span>
            </div>

            <div class="scroll-sentinel"></div>
        </div>
    </div>

    <!-- [3] 모달 레이어 (고정) -->
    <div class="modal-layers">
        
        <!-- 공용 오버레이 (배경) -->
        <div class="modal-overlay"></div>
        
        <!-- 글쓰기 모달 -->
        <div class="modal-container" id="writeModal">
            <div class="modal-content modal-write">
                <div class="modal-write-header">
                    <button type="button" class="modal-close-btn" onclick="UsedMarketUI.closeWriteModal()">
                        <ion-icon name="chevron-back"></ion-icon>
                    </button>
                    <div class="modal-write-title">내 물건 팔기</div>
                    <div style="width: 40px;"></div>
                </div>

                <div class="modal-write-body">
                    <div class="image-attach-row" id="imageRow">
                        <div class="camera-btn" id="cameraBtn">
                            <ion-icon name="camera" class="camera-icon"></ion-icon>
                            <span class="camera-count" id="imgCount">0/10</span>
                        </div>
                    </div>
                    <input type="file" id="imgUpload" hidden multiple accept="image/*">

                    <label class="input-label">제목</label>
                    <input type="text" class="input-box-styled" id="productTitle" placeholder="제목을 입력하세요">

                    <label class="input-label">자세한 설명</label>
                    <textarea class="textarea-box-styled" id="productDesc" placeholder="게시글 내용을 작성해주세요."></textarea>

                    <label class="input-label">가격</label>
                    <input type="number" class="input-box-styled" id="productPrice" placeholder="가격을 입력해주세요 (원)">

                    <label class="input-label">거래 희망 장소</label>
                    <div class="location-select-box">
                        <span id="locText" class="loc-placeholder">위치 추가</span>
                        <ion-icon name="chevron-forward"></ion-icon>
                    </div>
                    <input type="hidden" id="lat">
                    <input type="hidden" id="lng">
                </div>

                <div class="modal-write-footer">
                    <button class="btn-submit-full" onclick="UsedMarketUI.submitProduct()">작성완료</button>
                </div>
            </div>
        </div>

        <!-- 상세보기 모달 -->
        <div class="modal-container" id="viewModal">
            <div class="modal-content modal-view">
                <div class="modal-view-header">
                    <button type="button" class="modal-close-btn" onclick="UsedMarketUI.closeViewModal()">
                        <ion-icon name="chevron-back"></ion-icon>
                    </button>
                    <div>상세보기</div>
                    <button type="button" class="modal-close-btn">
                        <ion-icon name="ellipsis-horizontal"></ion-icon>
                    </button>
                </div>

                <div class="modal-view-body">
                    <div class="swiper product-swiper">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="https://picsum.photos/400/400?random=1"></div>
                            <div class="swiper-slide"><img src="https://picsum.photos/400/400?random=2"></div>
                        </div>
                        <div class="swiper-pagination"></div>
                    </div>

                    <div class="seller-info">
                        <div class="profile">
                            <img src="https://i.pravatar.cc/100?img=12" class="profile-img">
                            <div>
                                <div class="seller-name" id="view-seller">이용민</div>
                                <div class="seller-location" id="view-location">어디동</div>
                            </div>
                        </div>
                        <div class="temp-badge" id="view-temp">36.5°C 😊</div>
                    </div>

                    <div class="content">
                        <h1 class="title" id="view-title">뭐시기 뭐시기 팝니다</h1>
                        <div class="meta" id="view-time">1분 전</div>
                        <div class="desc" id="view-desc">기스 하나 없는 S급 상품입니다.</div>

                        <div class="detail-stats" id="view-stats">관심 5 · 채팅 2 · 조회 123</div>

                        <div class="map-area">
                            <div class="map-title">거래 희망 장소 <span class="map-loc-name" id="view-location-name">역삼1동</span></div>
                            <div id="detailMap"></div>
                        </div>
                    </div>
                </div>

                <div class="modal-view-footer">
                    <ion-icon name="heart-outline" class="heart-icon"></ion-icon>
                    <div class="price-info">
                        <div class="price" id="view-price"></div>
                        <div class="price-sub">가격 제안 불가</div>
                    </div>
                    <button class="btn-primary chat-btn">채팅하기</button>
                </div>
            </div>
        </div>

    </div>

    <!-- [4] FAB 버튼 (부동 버튼) -->
    <button class="page-floating-btn" onclick="UsedMarketUI.openWriteModal()">
        <ion-icon name="pencil-outline"></ion-icon>
    </button>

    <script>
        const UsedMarketUI = {
            init: function() {
                new Swiper('.product-swiper', { pagination: { el: '.swiper-pagination' }, loop: true });
                this.bindEvents();
            },
            
            bindEvents: function() {
                // 상품 클릭 시 상세보기 열기
                document.querySelectorAll('.market-item').forEach(item => {
                    item.addEventListener('click', () => this.openViewModal());
                });
                
                // 카메라 버튼 - 파일 선택
                const cameraBtn = document.getElementById('cameraBtn');
                if (cameraBtn) {
                    cameraBtn.addEventListener('click', () => {
                        document.getElementById('imgUpload').click();
                    });
                }
                
                // 이미지 업로드
                const imgUpload = document.getElementById('imgUpload');
                if (imgUpload) {
                    imgUpload.addEventListener('change', (e) => this.handleFileSelect(e.target));
                }
                
                // 오버레이 클릭 시 모달 닫기
                const overlay = document.querySelector('.modal-overlay');
                if (overlay) {
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            this.closeAllModals();
                        }
                    });
                }
            },
            
            getOverlay: function() {
                return document.querySelector('.modal-overlay');
            },
            
            updateOverlay: function() {
                const overlay = this.getOverlay();
                const hasActiveModal = document.querySelector('.modal-container.active');
                if (overlay) {
                    if (hasActiveModal) {
                        overlay.classList.add('active');
                    } else {
                        overlay.classList.remove('active');
                    }
                }
            },

            openWriteModal: function() { 
                document.getElementById('writeModal').classList.add('active');
                this.updateOverlay();
            },
            
            closeWriteModal: function() { 
                document.getElementById('writeModal').classList.remove('active');
                this.updateOverlay();
            },
            
            openViewModal: function() { 
                document.getElementById('viewModal').classList.add('active');
                this.updateOverlay();
            },
            
            closeViewModal: function() { 
                document.getElementById('viewModal').classList.remove('active');
                this.updateOverlay();
            },
            
            closeAllModals: function() {
                document.querySelectorAll('.modal-container').forEach(modal => {
                    modal.classList.remove('active');
                });
                this.updateOverlay();
            },

            submitProduct: function() {
                if (!document.getElementById('productTitle').value || !document.getElementById('productPrice').value) {
                    alert('필수 정보를 입력해주세요');
                    return;
                }
                alert('작성이 완료되었습니다!');
                this.closeWriteModal();
            },

            handleFileSelect: function(input) {
                const cameraBtn = document.getElementById('cameraBtn');
                Array.from(input.files).forEach(file => {
                    if (!file.type.startsWith('image/')) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const html = `<div class="preview-box"><img src="${e.target.result}" class="preview-img"><div class="btn-remove-img" onclick="this.parentElement.remove(); UsedMarketUI.updateImageCount();"><ion-icon name="close"></ion-icon></div></div>`;
                        cameraBtn.insertAdjacentHTML('afterend', html);
                        this.updateImageCount();
                    };
                    reader.readAsDataURL(file);
                });
                input.value = '';
            },

            updateImageCount: function() {
                document.getElementById('imgCount').innerText = `${document.querySelectorAll('.preview-box').length}/10`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => UsedMarketUI.init());
    </script>
</div>
