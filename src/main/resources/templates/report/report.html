<!-- 신고하기 모달 (Report Modal) -->
<div id="reportLayer" class="page-layer" style="background: #fff;">
    <div class="chat-header" style="border-bottom: 1px solid #eee;">
        <div class="chat-close-btn" onclick="ReportModal.close()">
            <ion-icon name="chevron-down"></ion-icon>
        </div>
        <div class="header-title">🚨 신고하기</div>
        <div class="chat-header-spacer"></div>
    </div>

    <div class="report-content" style="padding: 20px; flex: 1; overflow-y: auto;">
        <div id="report-target-info" style="background: #f8f9fd; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; color: #666;">
            <strong>대상:</strong> <span id="report-target-type-text"></span> (ID: <span id="report-target-id-text"></span>)
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px; font-weight: 700; font-size: 15px;">신고 사유를 선택해주세요</label>
            <div id="report-reason-list" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- JS에서 사유 목록 생성 -->
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="report-description" style="display: block; margin-bottom: 10px; font-weight: 700; font-size: 15px;">상세 설명 (선택사항)</label>
            <textarea id="report-description" style="width: 100%; height: 120px; padding: 15px; border: 1px solid #eee; border-radius: 12px; resize: none; font-size: 14px;" placeholder="상세한 내용을 입력해주시면 처리에 도움이 됩니다."></textarea>
        </div>

        <button type="button" class="btn-primary" onclick="ReportModal.submit()" style="margin-top: 10px; background-color: #ff4757; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);">신고 제출</button>
        <button type="button" class="btn-cancel" onclick="ReportModal.close()" style="width: 100%; padding: 15px; border: none; background: #eee; border-radius: 30px; margin-top: 10px; font-weight: 700; color: #666; cursor: pointer;">취소</button>
    </div>
</div>
