<div class="detail-content no-scrollbar" th:fragment="div">

    <div class="dashboard-card">
        <div class="compare-box">
            <span id="compareText">지출 비교 분석 중...</span>
        </div>
    </div>

    <div class="dashboard-card">
        <div class="charts-row">
            <div class="chart-col">
                <div class="chart-title">Last Month</div>
                <div class="chart-box">
                    <canvas id="chartLast"></canvas>
                    <div id="chartLastBox" class="chart-center-text">
                        <span class="chart-center-value">0</span>
                    </div>
                </div>
            </div>
            <div class="chart-col">
                <div class="chart-title">This Month</div>
                <div class="chart-box">
                    <canvas id="chartThis"></canvas>
                    <div id="chartThisBox" class="chart-center-text">
                        <span class="chart-center-value">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="budget-header">한 달 지출 목표 금액</div>
        <div class="budget-bar-wrap">
            <div class="bar-segment bg-red">Wait</div>
            <div class="bar-segment bg-green">Wait</div>
        </div>

        <div class="budget-info-container">
            <div class="budget-row">
                <div class="row-left"><span class="dot-bullet"></span> 한 달 예산</div>
                <div class="row-right">
                    <div class="amount-text clickable budget-amount">0</div>
                    <div class="sub-text">누르면 (설정 가능)</div>
                </div>
            </div>
            <div class="budget-row">
                <div class="row-left"><span class="dot-bullet"></span> 한 달 지출 </div>
                <div class="row-right">
                    <div class="amount-text  expense-amount">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="calendar-sheet">
        <div class="cal-header">
            <button class="cal-nav-btn" id="btnPrevMonth">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </button>
            <span class="cal-title toggle-calendar-view" id="calTitle">Loading...</span>
            <button class="cal-nav-btn" id="btnNextMonth">
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </button>
        </div>
        <div id="calendarContainer" class="date-scroller"></div>
    </div>

    <div id="dayDetailSection" class="day-detail-section">
        <div class="dd-header-date" id="ddDateTitle"></div>

        <div class="dd-summary-row">
            <span class="dd-label">잔액보기</span>
            <span class="dd-count" id="ddCount">0건</span>
        </div>

        <div id="ddList"></div>

        <div class="fab-container">
            <div class="fab-edit open-modal">
                <ion-icon name="pencil"></ion-icon>
            </div>
        </div>
    </div>

    <div class="bottom-spacer"></div>

    <div id="writeModal" class="modal-overlaies">
        <div class="modal-card">
            <div class="modal-title">입출금</div>

            <div class="input-group">
                <label class="modal-label">카테고리</label>
                <div class="input-relative">
                    <select id="inpCategory" class="modal-input">
                        <option value="월급">월급</option>
                        <option value="식비">식비</option>
                        <option value="교통비">교통비</option>
                        <option value="쇼핑">쇼핑</option>
                        <option value="경조사">경조사</option>
                        <option value="저축">저축</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
            </div>

            <div>
                <div class="row-inputs">
                    <div class="input-group sm">
                        <label class="modal-label" for="inpType">입/출</label>
                        <select id="inpType" class="modal-input input-center">
                            <option value="plus">입금</option>
                            <option value="minus">출금</option>
                        </select>
                    </div>
                    <div class="input-group lg">
                        <label class="modal-label">금액 (원)</label>
                        <input type="text" id="inpAmount" class="modal-input" placeholder="0" inputmode="numeric">
                    </div>
                </div>

                <div class="check-group-wrapper">
                    <div class="check-group">
                        <input type="checkbox" id="inpFixed" class="check-input">
                        <label for="inpFixed" class="check-label">매월 반복 (고정 지출)</label>
                    </div>

                    <div id="durationArea" class="duration-input-box" style="display: none;">
                        <input type="number" id="inpDuration" class="modal-input small-input" value="12" min="1">
                        <span class="duration-text">개월 동안</span>
                    </div>
                </div>
                <div class="input-group mt-5">
                    <textarea id="inpMemo" class="modal-textarea" placeholder="내용을 입력하세요..."></textarea>
                </div>

                <button type="button" class="modal-btn">입력</button>
                <div class="modal-close-btn">닫기</div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlaies">
        <div class="modal-card" style="max-width: 300px; padding: 30px 20px;">
            <div class="modal-title" style="color: var(--danger-red);">삭제 확인</div>
            <p style="text-align: center; color: #666; font-size: 14px; margin: 10px 0 20px; line-height: 1.5;">
                정말 이 내역을 삭제하시겠습니까?<br>삭제 후에는 복구할 수 없습니다.
            </p>

            <div style="display: flex; gap: 10px; width: 100%;">
                <button type="button" class="modal-btn btn-secondary"
                    style="background-color: #f1f2f6; color: #666; margin-top:0; box-shadow:none;"
                    onclick="finance.closeDeleteModal()">취소</button>
                <button type="button" class="modal-btn"
                    style="background-color: var(--danger-red); color: white; margin-top:0;"
                    onclick="finance.confirmDelete()">삭제</button>
            </div>
        </div>
    </div>

    <div id="budgetModal" class="modal-overlaies">
        <div class="modal-card">
            <div class="modal-title">한 달 예산 설정</div>
            <p class="modal-label" style="text-align:center; margin-bottom:20px;">이번 달 목표 지출 금액을 입력하세요.</p>

            <div class="input-group">
                <input type="text" id="inpBudget" class="modal-input input-center" placeholder="0" inputmode="numeric">
            </div>

            <button type="button" class="modal-btn" onclick="finance.saveBudget()">설정 완료</button>
            <div class="modal-close-btn" onclick="finance.closeBudgetModal()">취소</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            finance.init();
        });

        const finance = {
            currentDate: new Date(),
            selectedDay: null,
            selectedYear: null,
            selectedMonth: null,
            currentDetailData: [],
            isGridView: false,
            editingIndex: null,
            editingId: null,
            pendingDeleteId: null,
            mockDB: {},
            currentBudget: 0,

            chartLast: null,
            chartThis: null,

            init: () => {
                finance.initCharts();
                finance.evtHandler();
                finance.updateHeader();
                finance.loadData();
            },

            showToast: (message) => {
                const oldToast = document.querySelector('.toast-box');
                if (oldToast) oldToast.remove();

                const toast = document.createElement('div');
                toast.className = 'toast-box';
                toast.innerHTML = message;
                document.body.appendChild(toast);

                requestAnimationFrame(() => { toast.classList.add('show'); });
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 400);
                }, 2500);
            },

            loadData: () => {
                const yearMonth = `${finance.currentDate.getFullYear()}-${String(finance.currentDate.getMonth() + 1).padStart(2, '0')}`;

                fetch(`/finance/list?yearMonth=${yearMonth}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                })
                    .then(response => response.json())
                    .then(data => {
                        let list = [];
                        if (Array.isArray(data)) {
                            list = data;
                        } else {
                            list = data.list || [];
                            finance.currentBudget = data.budget || 0;
                        }

                        const newDB = {};
                        const curYear = finance.currentDate.getFullYear();
                        const curMonth = finance.currentDate.getMonth() + 1;

                        let thisMonthIncome = 0;
                        let thisMonthExpense = 0;
                        const thisMonthStats = {};
                        let thisMonthChartTotal = 0;

                        list.forEach(dto => {
                            const amt = Number(dto.amount);
                            const isPlus = (dto.type === 'plus' || dto.type === '+');
                            const dateObj = new Date(dto.date);
                            if (isNaN(dateObj)) return;

                            const startY = dateObj.getFullYear();
                            const startM = dateObj.getMonth() + 1;
                            const d = dateObj.getDate();

                            const isCurrentMonth = (startY === curYear && startM === curMonth);
                            let isValidFixed = false;

                            const fixedFlag = (dto.isFixed === true || dto.fixed === true || dto.isFixed === 'Y' || dto.isFixed === 1 || dto.isFixed === 'true');
                            const durationVal = parseInt(dto.duration) || 0;

                            if (fixedFlag) {
                                const diffYear = curYear - startY;
                                const diffMonth = curMonth - startM;
                                const monthsPassed = (diffYear * 12) + diffMonth;
                                let maxDuration = (durationVal > 0) ? durationVal : 999;

                                if (monthsPassed >= 0 && monthsPassed < maxDuration) {
                                    isValidFixed = true;
                                }
                            }

                            if (isCurrentMonth || isValidFixed) {
                                if (!newDB[d]) newDB[d] = [];
                                newDB[d].push({
                                    financeIdx: dto.financeIdx,
                                    cat: dto.category,
                                    amount: amt.toLocaleString(),
                                    rawAmount: amt,
                                    type: dto.type,
                                    memo: dto.memo,
                                    time: dto.time,
                                    isFixed: fixedFlag,
                                    duration: durationVal
                                });

                                if (isPlus) {
                                    thisMonthIncome += amt;
                                } else {
                                    thisMonthExpense += amt;
                                    if (!thisMonthStats[dto.category]) thisMonthStats[dto.category] = 0;
                                    thisMonthStats[dto.category] += amt;
                                    thisMonthChartTotal += amt;
                                }
                            }
                        });

                        finance.mockDB = newDB;

                        const budgetAmtEl = document.querySelector('.budget-amount');
                        const expenseAmtEl = document.querySelector('.expense-amount');
                        const barRed = document.querySelector('.bar-segment.bg-red');
                        const barGreen = document.querySelector('.bar-segment.bg-green');

                        if (budgetAmtEl) budgetAmtEl.innerText = finance.currentBudget.toLocaleString();
                        if (expenseAmtEl) {
                            expenseAmtEl.innerText = thisMonthExpense > 0 ? `${thisMonthExpense.toLocaleString()}원` : "0원";
                            expenseAmtEl.classList.add('text-red');
                        }

                        // 🚨 [수정된 핵심 부분] 예산 퍼센트 계산 (소수점 2자리 + 초과 시 UI 보호)
                        let usagePercent = 0;
                        if (finance.currentBudget > 0) {
                            usagePercent = (thisMonthExpense / finance.currentBudget) * 100;
                            if (thisMonthExpense > 0 && usagePercent < 0.01) usagePercent = 0.01;
                        } else if (thisMonthExpense > 0) {
                            usagePercent = 100;
                        }

                        let displayPercent = Number(usagePercent.toFixed(2)); // 실제 % (초과분 표시)
                        let remainPercent = Number((100 - usagePercent).toFixed(2));

                        let barWidthPercent = usagePercent > 100 ? 100 : usagePercent; // UI 막대는 최대 100%까지만
                        let remainWidthPercent = 100 - barWidthPercent;

                        if (barRed) {
                            barRed.style.width = `${barWidthPercent}%`;
                            barRed.innerText = displayPercent > 0 ? `${displayPercent}%` : '';
                        }
                        if (barGreen) {
                            barGreen.style.width = `${remainWidthPercent}%`;
                            barGreen.innerText = remainPercent > 0 ? `${remainPercent}%` : '';
                        }

                        if (finance.isGridView) finance.renderGrid();
                        else finance.renderScroller();

                        if (finance.selectedDay &&
                            finance.selectedYear === finance.currentDate.getFullYear() &&
                            finance.selectedMonth === finance.currentDate.getMonth()) {
                            finance.currentDetailData = finance.mockDB[finance.selectedDay] ? [...finance.mockDB[finance.selectedDay]] : [];
                            finance.showDetails(null);
                        }

                        finance.updateCharts(list, thisMonthStats, thisMonthChartTotal);
                    })
                    .catch(error => console.error("에러:", error));
            },

            refreshDetailOnly: () => {
                if (!finance.selectedDay) return;
                const ym = `${finance.selectedYear}-${String(finance.selectedMonth + 1).padStart(2, '0')}`;

                fetch(`/finance/list?yearMonth=${ym}`, { method: 'GET', headers: { 'Content-Type': 'application/json' } })
                    .then(res => res.json())
                    .then(data => {
                        let list = Array.isArray(data) ? data : (data.list || []);
                        const dayData = [];
                        const targetDay = finance.selectedDay;

                        list.forEach(dto => {
                            const amt = Number(dto.amount);
                            const dateObj = new Date(dto.date);
                            if (isNaN(dateObj)) return;

                            const startY = dateObj.getFullYear();
                            const startM = dateObj.getMonth() + 1;
                            const d = dateObj.getDate();
                            const fixedFlag = (dto.isFixed === true || dto.fixed === true || dto.isFixed === 'Y' || dto.isFixed === 1 || dto.isFixed === 'true');

                            let isTargetMonth = (startY === finance.selectedYear && startM === (finance.selectedMonth + 1));
                            let isValidFixed = false;

                            if (fixedFlag) {
                                const diffYear = finance.selectedYear - startY;
                                const diffMonth = (finance.selectedMonth + 1) - startM;
                                const monthsPassed = (diffYear * 12) + diffMonth;
                                let maxDur = (parseInt(dto.duration) > 0) ? parseInt(dto.duration) : 999;
                                if (monthsPassed >= 0 && monthsPassed < maxDur) isValidFixed = true;
                            }

                            if ((isTargetMonth || isValidFixed) && d === targetDay) {
                                dayData.push({
                                    financeIdx: dto.financeIdx,
                                    cat: dto.category,
                                    amount: amt.toLocaleString(),
                                    rawAmount: amt,
                                    type: dto.type,
                                    memo: dto.memo,
                                    time: dto.time,
                                    isFixed: fixedFlag,
                                    duration: parseInt(dto.duration) || 0
                                });
                            }
                        });

                        finance.currentDetailData = dayData;
                        finance.showDetails(null);
                    });
            },

            openBudgetModal: () => {
                const yearStr = finance.currentDate.getFullYear();
                const monthStr = finance.currentDate.getMonth() + 1;
                document.querySelector('#budgetModal .modal-title').innerText = `${yearStr}년 ${monthStr}월 예산 설정`;

                const inpBudget = document.getElementById('inpBudget');
                if (inpBudget) inpBudget.value = finance.currentBudget ? finance.currentBudget.toLocaleString() : '';
                document.getElementById('budgetModal').classList.add('active');
            },

            closeBudgetModal: () => {
                document.getElementById('budgetModal').classList.remove('active');
            },

            saveBudget: () => {
                const inpBudget = document.getElementById('inpBudget');
                const rawVal = inpBudget.value.replace(/,/g, '');
                const budgetVal = Number(rawVal);

                if (isNaN(budgetVal) || budgetVal < 0) {
                    finance.showToast("올바른 금액을 입력해주세요!");
                    return;
                }
                const yearMonth = `${finance.currentDate.getFullYear()}-${String(finance.currentDate.getMonth() + 1).padStart(2, '0')}`;

                fetch('/finance/budget/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: budgetVal, yearMonth: yearMonth })
                }).then(res => {
                    if (res.ok) { finance.showToast("예산이 설정되었습니다! 💰"); finance.closeBudgetModal(); finance.loadData(); }
                    else finance.showToast("설정에 실패했습니다.");
                }).catch(err => finance.showToast("서버 오류가 발생했습니다."));
            },

            updateCharts: (list, thisStats, thisTotal) => {
                const curDate = finance.currentDate;
                const lastDate = new Date(curDate.getFullYear(), curDate.getMonth() - 1, 1);
                const lastYear = lastDate.getFullYear();
                const lastMonth = lastDate.getMonth() + 1;

                const lastMonthStats = {};
                let lastTotal = 0;

                list.forEach(item => {
                    if (item.type === 'plus' || item.type === '+') return;
                    const dObj = new Date(item.date);
                    if (isNaN(dObj)) return;
                    const startY = dObj.getFullYear();
                    const startM = dObj.getMonth() + 1;

                    let isLastMonthTarget = (startY === lastYear && startM === lastMonth);
                    const fixedFlag = (item.isFixed === true || item.fixed === true || item.isFixed === 'Y' || item.isFixed === 1 || item.isFixed === 'true');
                    const durationVal = parseInt(item.duration) || 0;

                    if (fixedFlag) {
                        const diffYear = lastYear - startY;
                        const diffMonth = lastMonth - startM;
                        const monthsPassedLast = (diffYear * 12) + diffMonth;
                        let maxDuration = (durationVal > 0) ? durationVal : 999;
                        if (monthsPassedLast >= 0 && monthsPassedLast < maxDuration) isLastMonthTarget = true;
                    }

                    if (isLastMonthTarget) {
                        const amt = Number(item.amount);
                        if (!lastMonthStats[item.category]) lastMonthStats[item.category] = 0;
                        lastMonthStats[item.category] += amt;
                        lastTotal += amt;
                    }
                });

                const applyToChart = (chart, stats, totalVal, centerTextId) => {
                    if (!chart) return;
                    const labels = Object.keys(stats);
                    const realData = Object.values(stats);
                    const displayData = realData.map(val => {
                        const percent = totalVal > 0 ? (val / totalVal) * 100 : 0;
                        if (val > 0 && percent < 2) return totalVal * 0.02;
                        return val;
                    });

                    const box = document.getElementById(centerTextId);
                    const initialLabel = "Total 지출";
                    const initialValue = totalVal > 0 ? `${totalVal.toLocaleString()}원` : "0원";

                    const renderCenterText = (label, value) => {
                        box.innerHTML = `<span class="chart-center-label">${label}</span><span class="chart-center-value">${value}</span>`;
                    };

                    renderCenterText(initialLabel, initialValue);

                    chart.data.labels = labels.length > 0 ? labels : ['내역 없음'];
                    chart.data.datasets[0].data = displayData.length > 0 ? displayData : [1];

                    const colorMap = {
                        '월급': '#2ecc71', '식비': '#ff7675', '교통비': '#fdcb6e',
                        '쇼핑': '#a29bfe', '경조사': '#fab1a0', '저축': '#74b9ff', '기타': '#dfe6e9'
                    };
                    chart.data.datasets[0].backgroundColor = labels.length > 0 ? labels.map(label => colorMap[label] || '#C9CBCF') : ['#E5E5E5'];
                    chart.options.plugins.tooltip.enabled = false;
                    chart.options.onHover = (event, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const label = chart.data.labels[index];
                            if (label !== '내역 없음') renderCenterText(label, `${realData[index].toLocaleString()}원`);
                        } else renderCenterText(initialLabel, initialValue);
                    };
                    chart.update();
                };

                applyToChart(finance.chartLast, lastMonthStats, lastTotal, 'chartLastBox');
                applyToChart(finance.chartThis, thisStats, thisTotal, 'chartThisBox');
                // 충고 영역 제거, 전월 대비 금액만 출력
                const compareEl = document.getElementById('compareText');
                if (compareEl) {
                    const diff = thisTotal - lastTotal;
                    let resultText = '';
                    let colorClass = '';

                    if (diff > 0) {
                        resultText = `+${diff.toLocaleString()}원`;
                        colorClass = 'text-red';
                    } else if (diff < 0) {
                        resultText = `-${Math.abs(diff).toLocaleString()}원`;
                        colorClass = 'text-green';
                    } else {
                        resultText = '0원';
                        colorClass = '';
                    }

                    compareEl.innerHTML = `
                        <div class="ledger-wrap">
                            <div class="ledger-header">월간 지출 비교 분석</div>
                            <div class="ledger-row ledger-total ${colorClass}">
                                <span class="ledger-label">전월 대비</span>
                                <span class="ledger-val">${resultText}</span>
                            </div>
                        </div>
                    `;
                }
            },

            initCharts: () => {
                Chart.register(ChartDataLabels);
                const getCommonOpts = () => ({
                    responsive: true, maintainAspectRatio: false, cutout: '70%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false }, datalabels: { display: false } },
                    elements: { arc: { borderWidth: 0 } }
                });

                if (document.getElementById('chartLast')) {
                    finance.chartLast = new Chart(document.getElementById('chartLast'), { type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] }, options: getCommonOpts() });
                }
                if (document.getElementById('chartThis')) {
                    finance.chartThis = new Chart(document.getElementById('chartThis'), { type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] }, options: getCommonOpts() });
                }
            },

            evtHandler: () => {
                const budgetBtn = document.querySelector('.budget-amount');
                if (budgetBtn) budgetBtn.addEventListener('click', () => finance.openBudgetModal());

                const inpBudget = document.getElementById('inpBudget');
                if (inpBudget) {
                    inpBudget.addEventListener('input', function () {
                        let val = this.value.replace(/[^0-9]/g, '');
                        if (val) this.value = Number(val).toLocaleString(); else this.value = '';
                    });
                }

                const chkFixed = document.getElementById('inpFixed'), durationArea = document.getElementById('durationArea'), amtInput = document.getElementById('inpAmount');
                if (chkFixed && durationArea) {
                    chkFixed.addEventListener('change', function () {
                        if (this.checked) { durationArea.style.display = 'flex'; document.getElementById('inpDuration').value = 12; }
                        else { durationArea.style.display = 'none'; }
                    });
                }

                if (amtInput) {
                    amtInput.addEventListener('input', function () {
                        let val = this.value.replace(/[^0-9]/g, '');
                        if (val) this.value = Number(val).toLocaleString(); else this.value = '';
                    });
                }

                document.querySelector('.toggle-calendar-view').addEventListener('click', () => finance.toggleCalendarView());
                document.querySelector('.open-modal').addEventListener('click', () => finance.openModal(null));
                document.querySelector('.modal-btn').addEventListener('click', () => finance.saveData());
                document.querySelector('.modal-close-btn').addEventListener('click', () => finance.closeModal());
                document.getElementById('btnPrevMonth').addEventListener('click', () => { finance.changeMonth(-1); finance.loadData(); });
                document.getElementById('btnNextMonth').addEventListener('click', () => { finance.changeMonth(1); finance.loadData(); });
            },

            changeMonth: (offset) => {
                finance.currentDate.setDate(1);
                finance.currentDate.setMonth(finance.currentDate.getMonth() + offset);
                finance.updateHeader();
            },

            updateHeader: () => { const options = { year: 'numeric', month: 'long' }; const dateStr = finance.currentDate.toLocaleDateString('en-US', options); document.getElementById('calTitle').innerText = dateStr; },

            calcDaySummary: (day) => {
                if (!finance.mockDB[day]) return { inc: 0, exp: 0 };
                let inc = 0, exp = 0;
                finance.mockDB[day].forEach(item => {
                    const val = Number(String(item.amount).replace(/,/g, ''));
                    if (item.type === 'plus' || item.type === '+') inc += val; else exp += val;
                });
                return { inc, exp };
            },

            renderScroller: () => {
                const container = document.getElementById('calendarContainer');
                const year = finance.currentDate.getFullYear(), month = finance.currentDate.getMonth();
                const lastDay = new Date(year, month + 1, 0).getDate();
                const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                container.innerHTML = ''; container.className = 'date-scroller';
                for (let i = 1; i <= lastDay; i++) {
                    const d = new Date(year, month, i), summary = finance.calcDaySummary(i);
                    let moneyTag = '';
                    if (summary.inc > 0) moneyTag += `<span class="money-tag money-inc">+${summary.inc.toLocaleString()}</span>`;
                    if (summary.exp > 0) moneyTag += `<span class="money-tag money-exp">-${summary.exp.toLocaleString()}</span>`;
                    const el = document.createElement('div');
                    const isToday = new Date().toDateString() === d.toDateString();
                    el.className = `date-card ${isToday ? 'active' : ''}`;
                    el.id = `day-card-${i}`;
                    el.innerHTML = `<div class="date-day-label">${dayNames[d.getDay()]}</div><div class="date-number">${i}</div><div class="date-money-space">${moneyTag}</div>`;
                    el.addEventListener('click', () => finance.showDetails(i));
                    container.appendChild(el);
                }
                setTimeout(() => {
                    let activeEl = container.querySelector('.date-card.active');
                    if (!activeEl) activeEl = document.getElementById('day-card-1');
                    if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }, 100);
            },

            renderGrid: () => {
                const container = document.getElementById('calendarContainer');
                const year = finance.currentDate.getFullYear(), month = finance.currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay(), lastDay = new Date(year, month + 1, 0).getDate();
                const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                const realToday = new Date();
                container.innerHTML = ''; container.className = 'calendar-grid';
                let html = '<div class="grid-header-row">' + dayNames.map(d => `<div class="grid-header-cell">${d}</div>`).join('') + '</div><div class="grid-dates-container">';
                for (let i = 0; i < firstDay; i++) html += `<div class="grid-date-cell empty"></div>`;
                for (let i = 1; i <= lastDay; i++) {
                    const summary = finance.calcDaySummary(i);
                    let moneyHtml = (summary.inc > 0 ? `<div class="grid-money inc">+${summary.inc.toLocaleString()}</div>` : '') + (summary.exp > 0 ? `<div class="grid-money exp">-${summary.exp.toLocaleString()}</div>` : '');
                    const isToday = (year === realToday.getFullYear() && month === realToday.getMonth() && i === realToday.getDate());
                    html += `<div class="grid-date-cell" data-day="${i}"><div class="grid-date-num ${isToday ? 'today' : ''}">${i}</div>${moneyHtml}</div>`;
                }
                container.innerHTML = html + '</div>';
                document.querySelectorAll('.grid-date-cell:not(.empty)').forEach(cell => cell.addEventListener('click', () => finance.showDetails(parseInt(cell.getAttribute('data-day')))));
            },

            toggleCalendarView: () => { finance.isGridView = !finance.isGridView; if (finance.isGridView) finance.renderGrid(); else finance.renderScroller(); },

            showDetails: (day) => {
                if (day !== null) {
                    finance.selectedDay = day;
                    finance.selectedYear = finance.currentDate.getFullYear();
                    finance.selectedMonth = finance.currentDate.getMonth();
                    finance.currentDetailData = finance.mockDB[day] ? [...finance.mockDB[day]] : [];
                }

                document.querySelectorAll('.date-card').forEach(e => e.classList.remove('active'));
                const detailSection = document.getElementById('dayDetailSection'); detailSection.classList.add('active');

                const dateStr = new Date(finance.selectedYear, finance.selectedMonth, finance.selectedDay).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('ddDateTitle').innerText = dateStr;

                const listContainer = document.getElementById('ddList'); listContainer.innerHTML = '';
                document.getElementById('ddCount').innerText = `${finance.currentDetailData.length}건`;

                if (finance.currentDetailData.length === 0) listContainer.innerHTML = '<div class="empty-msg">내역이 없습니다.</div>';
                else finance.currentDetailData.forEach((item, index) => {
                    const div = document.createElement('div'); div.className = 'dd-item';
                    const colorClass = item.type === 'plus' ? 'plus' : 'minus', sign = item.type === 'plus' ? '+' : '-';
                    div.innerHTML = `<div class="dd-item-top"><span class="dd-title">${item.cat}${item.isFixed ? '<span class="badge-fixed">고정</span>' : ''} <span class="btn-edit-small" onclick="finance.openModal(${index})"><ion-icon name="pencil" class="icon-sm"></ion-icon></span><span class="btn-delete-small" onclick="finance.deleteData(${item.financeIdx})"><ion-icon name="trash-outline" class="icon-sm"></ion-icon></span></span><span class="dd-amount ${colorClass}">${sign} ${item.amount}</span></div><div class="dd-memo-box">${item.memo}</div><div class="dd-time">${item.time}</div>`;
                    listContainer.appendChild(div);
                });

                if (day !== null) detailSection.scrollIntoView({ behavior: 'smooth' });
            },

            openModal: (editIndex) => {
                if (!finance.selectedDay) { finance.showToast("날짜를 먼저 선택해주세요! 📅"); return; }

                finance.editingIndex = editIndex;
                const chkFixed = document.getElementById('inpFixed'), durationArea = document.getElementById('durationArea'), inpDuration = document.getElementById('inpDuration');

                if (editIndex !== null) {
                    const item = finance.currentDetailData[editIndex];
                    finance.editingId = item.financeIdx;
                    document.getElementById('inpCategory').value = item.cat;
                    document.getElementById('inpType').value = item.type;
                    document.getElementById('inpAmount').value = Number(String(item.amount).replace(/,/g, '')).toLocaleString();
                    document.getElementById('inpMemo').value = item.memo;
                    chkFixed.checked = item.isFixed;
                    durationArea.style.display = item.isFixed ? 'flex' : 'none';
                    inpDuration.value = item.duration || 12;
                } else {
                    finance.editingId = null;
                    document.getElementById('inpCategory').value = '식비';
                    document.getElementById('inpAmount').value = '';
                    document.getElementById('inpMemo').value = '';
                    chkFixed.checked = false;
                    durationArea.style.display = 'none';
                }
                document.getElementById('writeModal').classList.add('active');
            },

            closeModal: () => { document.getElementById('writeModal').classList.remove('active'); },

            saveData: () => {
                const cat = document.getElementById('inpCategory').value,
                    type = document.getElementById('inpType').value,
                    memo = document.getElementById('inpMemo').value,
                    isFixed = document.getElementById('inpFixed').checked;

                const rawAmtStr = document.getElementById('inpAmount').value.replace(/,/g, '');
                const rawAmt = Number(rawAmtStr);

                let duration = isFixed ? (parseInt(document.getElementById('inpDuration').value) || 12) : 0;

                if (!rawAmtStr || rawAmt < 0) { finance.showToast("금액을 정확히 입력해주세요! 💸"); return; }

                const dateStr = `${finance.selectedYear}-${String(finance.selectedMonth + 1).padStart(2, '0')}-${String(finance.selectedDay).padStart(2, '0')}`;
                const now = new Date();
                const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

                fetch('/finance/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        financeIdx: finance.editingId, category: cat, amount: rawAmt, type: type,
                        memo: memo, date: dateStr, time: timeStr, isFixed: isFixed, duration: duration
                    })
                }).then(res => {
                    if (res.ok) {
                        finance.showToast('저장되었습니다! 🎉');
                        finance.closeModal();

                        if (finance.selectedYear === finance.currentDate.getFullYear() && finance.selectedMonth === finance.currentDate.getMonth()) {
                            finance.loadData();
                        } else {
                            finance.loadData();
                            setTimeout(() => finance.refreshDetailOnly(), 200);
                        }
                    } else { res.text().then(msg => finance.showToast('실패: ' + msg)); }
                }).catch(err => finance.showToast('서버 오류가 발생했습니다.'));
            },

            deleteData: (id) => {
                finance.pendingDeleteId = id;
                document.getElementById('deleteModal').classList.add('active');
            },

            closeDeleteModal: () => {
                finance.pendingDeleteId = null;
                document.getElementById('deleteModal').classList.remove('active');
            },

            confirmDelete: () => {
                if (!finance.pendingDeleteId) return;

                fetch('/finance/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ financeIdx: finance.pendingDeleteId })
                }).then(res => {
                    if (res.ok) {
                        finance.showToast("삭제되었습니다. 🗑️");
                        finance.closeDeleteModal();

                        if (finance.selectedYear === finance.currentDate.getFullYear() && finance.selectedMonth === finance.currentDate.getMonth()) {
                            finance.loadData();
                        } else {
                            finance.loadData();
                            setTimeout(() => finance.refreshDetailOnly(), 200);
                        }
                    } else { finance.showToast("삭제 실패!"); }
                });
            },
        };
        // 🚨 기존 DOMContentLoaded 이벤트 안에 OCR 이벤트 핸들러 추가
        document.addEventListener('DOMContentLoaded', () => {
            finance.init();
        });
    </script>
</div>
