<!-- 통일된 구조: 가계부 페이지 -->
<div class="page-wrapper finance-page" th:fragment="div">
    
    <!-- [2] 콘텐츠 (스크롤 영역) -->
    <div class="page-content">
        <div class="net-worth-section">
            <div class="net-worth-label">순자산</div>
            <div class="net-worth-amount">1억 582만 3,000원</div>
            <div class="net-worth-diff" id="netWorthMessage">어제보다 20억 줄었어요</div>
        </div>
        <div class="content-inner">
            <!-- 대시보드 -->
            <div class="dashboard-card">
                <div class="charts-row">
                    <div class="chart-col">
                        <div class="chart-title">Last Month</div>
                        <div class="chart-box"><canvas id="chartLast"></canvas>
                            <div class="chart-center-text"><span class="chart-center-value">Total</span></div>
                        </div>
                    </div>
                    <div class="chart-col">
                        <div class="chart-title">This Month</div>
                        <div class="chart-box"><canvas id="chartThis"></canvas>
                            <div class="chart-center-text"><span class="chart-center-value">Total</span></div>
                        </div>
                    </div>
                </div>

                <div class="budget-header">한 달 지출 목표 금액</div>
                <div class="budget-bar-wrap">
                    <div class="bar-segment bg-red">68%</div>
                    <div class="bar-segment bg-green">32%</div>
                </div>

                <div class="budget-info-container">
                    <div class="budget-row">
                        <div class="row-left"><span class="dot-bullet"></span> 예산</div>
                        <div class="row-right">
                            <div class="amount-text clickable budget-amount">2,500,000,000</div>
                            <div class="sub-text">누르면 (설정 가능)</div>
                        </div>
                    </div>
                    <div class="budget-row">
                        <div class="row-left"><span class="dot-bullet"></span> 지출</div>
                        <div class="row-right">
                            <div class="amount-text clickable expense-amount">1,700,000,000</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 달력 -->
            <div class="calendar-sheet">
                <div class="cal-header">
                    <span class="cal-title toggle-calendar-view">January 2026</span>
                </div>
                <div id="calendarContainer" class="date-scroller"></div>
            </div>

            <!-- 거래 목록 -->
            <div id="dayDetailSection" class="day-detail-section">
                <div class="dd-header-date" id="ddDateTitle"></div>

                <div class="dd-summary-row">
                    <span class="dd-label">잔액보기</span>
                    <span class="dd-count" id="ddCount">0건</span>
                </div>

                <div id="ddList"></div>

                <div class="fab-edit open-modal">
                    <ion-icon name="pencil"></ion-icon>
                </div>
            </div>

            <div style="height: 100px;"></div>
        </div>
    </div>

    <!-- [3] 모달 레이어 (고정) -->
    <div class="modal-layers">
        <!-- 공용 오버레이 (배경) -->
        <div class="modal-overlay"></div>
        
        <!-- 입출금 모달 -->
        <div class="modal-container" id="writeModal">
            <div class="modal-content">
                <div class="modal-title">입출금</div>

                <div class="input-group">
                    <label class="modal-label">카테고리</label>
                    <div style="position:relative;">
                        <select id="inpCategory" class="modal-input">
                            <option value="식비">식비</option>
                            <option value="교통비">교통비</option>
                            <option value="쇼핑">쇼핑</option>
                            <option value="월급">월급</option>
                            <option value="용돈">용돈</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>

                <div class="row-inputs">
                    <div class="input-group sm">
                        <label class="modal-label">구분</label>
                        <select id="inpType" class="modal-input text-center">
                            <option value="minus">-</option>
                            <option value="plus">+</option>
                        </select>
                    </div>
                    <div class="input-group lg">
                        <label class="modal-label">금액 (원)</label>
                        <input type="number" id="inpAmount" class="modal-input" placeholder="0">
                    </div>
                </div>

                <div class="input-group">
                    <textarea id="inpMemo" class="modal-textarea" placeholder="내용을 입력하세요... (예: 친구에게 빌림)"></textarea>
                </div>

                <div class="modal-footer">
                    <button class="modal-btn-save" onclick="finance.saveData()">입력</button>
                    <button class="modal-close-btn" onclick="finance.closeModal()">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const finance = {
            selectedDay: null,
            isGridView: false,
            messageIndex: 0,
            messages: [
                '어제보다 20억 줄었어요',
                '이번 달 저축이 잘되고 있어요!',
                '목표까지 남은 금액: 1억원',
                '지난주 지출이 늘었어요',
                '평균보다 30% 많이 저축했어요'
            ],
            mockDB: {
                1: [{ cat: '월급', amount: '5,000,000', type: 'plus', memo: '1월 급여 입금완료', time: '09:00' }, { cat: '통신비', amount: '60,000', type: 'minus', memo: '휴대폰 요금 자동이체', time: '13:00' }],
                4: [{ cat: '카드대금', amount: '999,950', type: 'minus', memo: '신용카드 대금 결제', time: '15:30' }],
                21: [{ cat: '코인 떡상!', amount: '999,999,999', type: 'plus', memo: '무슨 말이 필요해~~', time: '11:30' }],
                25: [{ cat: '편의점', amount: '4,500', type: 'minus', memo: '커피, 삼각김밥', time: '08:20' }]
            },

            init: () => {
                finance.initCharts();
                finance.evtHandler();
                finance.renderScroller();
                finance.startMessageRotation();
            },

            evtHandler: () => {
                document.querySelector('.toggle-calendar-view').addEventListener('click', () => finance.toggleCalendarView());
                document.querySelector('.open-modal').addEventListener('click', () => finance.openModal());
                document.querySelector('.budget-amount').addEventListener('click', () => finance.showBudgetAlert());
                document.querySelector('.expense-amount').addEventListener('click', () => finance.showExpenseAlert());
                document.querySelector('.modal-btn-save').addEventListener('click', () => finance.saveData());
                document.querySelector('.modal-close-btn').addEventListener('click', () => finance.closeModal());
            },

            initCharts: () => {
                Chart.register(ChartDataLabels);
                const commonOpts = { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { display: false }, tooltip: { enabled: false }, datalabels: { color: 'white', font: { weight: 'bold', size: 9 }, formatter: (v, c) => v > 15 ? c.chart.data.labels[c.dataIndex] : '' } }, elements: { arc: { borderWidth: 0 } } };
                new Chart(document.getElementById('chartLast'), { type: 'doughnut', data: { labels: ['A', 'B'], datasets: [{ data: [70, 30], backgroundColor: ['#EF4444', '#10B981'] }] }, options: commonOpts });
                new Chart(document.getElementById('chartThis'), { type: 'doughnut', data: { labels: ['A', 'B'], datasets: [{ data: [40, 60], backgroundColor: ['#3B82F6', '#F59E0B'] }] }, options: commonOpts });
            },

            renderScroller: () => {
                const calendarContainer = document.getElementById('calendarContainer');
                const today = new Date();
                const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

                calendarContainer.innerHTML = '';
                calendarContainer.className = 'date-scroller';
                for (let i = -10; i <= 10; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() + i);
                    const num = d.getDate();
                    const dayStr = dayNames[d.getDay()];
                    let moneyTag = '';
                    if (finance.mockDB[num]) {
                        const first = finance.mockDB[num][0];
                        if (first.type === 'plus') moneyTag = `<span class="money-tag money-inc">+${first.amount}</span>`;
                        else moneyTag = `<span class="money-tag money-exp">-${first.amount}</span>`;
                    }
                    const el = document.createElement('div');
                    el.className = `date-card ${i === 0 ? 'active' : ''}`;
                    el.id = `day-card-${num}`;
                    el.innerHTML = `<div style="font-size: 10px; color: #BBB; font-weight: 600; margin-bottom: 4px;">${dayStr}</div><div class="date-number">${num}</div><div style="height:12px">${moneyTag}</div>`;
                    el.addEventListener('click', () => finance.showDetails(num));
                    calendarContainer.appendChild(el);
                }
                setTimeout(() => {
                    const active = document.querySelector('.date-card.active');
                    if (active) calendarContainer.scrollLeft = active.offsetLeft - calendarContainer.clientWidth / 2 + active.clientWidth / 2;
                }, 10);
            },

            renderGrid: () => {
                const calendarContainer = document.getElementById('calendarContainer');
                const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

                calendarContainer.innerHTML = '';
                calendarContainer.className = 'calendar-grid';
                let html = '<div class="grid-header-row">';
                dayNames.forEach(d => html += `<div class="grid-header-cell">${d}</div>`);
                html += '</div><div class="grid-dates-container">';
                for (let i = 0; i < 3; i++) html += `<div class="grid-date-cell"></div>`;
                for (let i = 1; i <= 31; i++) {
                    let moneyHtml = '';
                    if (finance.mockDB[i]) {
                        const first = finance.mockDB[i][0];
                        const cls = first.type === 'plus' ? 'money-inc' : 'money-exp';
                        moneyHtml = `<div class="grid-money ${cls}">${first.type === 'plus' ? '+' : '-'} ${first.amount}</div>`;
                    }
                    html += `<div class="grid-date-cell" data-day="${i}"><div class="grid-date-num">${i}</div>${moneyHtml}</div>`;
                }
                html += '</div>';
                calendarContainer.innerHTML = html;

                // 그리드 셀 이벤트 핸들러 추가
                document.querySelectorAll('.grid-date-cell').forEach(cell => {
                    cell.addEventListener('click', () => {
                        const day = parseInt(cell.getAttribute('data-day'));
                        finance.showDetails(day);
                    });
                });
            },

            showDetails: (day) => {
                finance.selectedDay = day;

                document.querySelectorAll('.date-card').forEach(e => e.classList.remove('active'));
                const target = document.getElementById(`day-card-${day}`);
                if (target) target.classList.add('active');

                const detailSection = document.getElementById('dayDetailSection');
                detailSection.style.display = 'block';

                document.getElementById('ddDateTitle').innerText = `2026 January ${day}`;

                const list = finance.mockDB[day] || [];
                document.getElementById('ddCount').innerText = `${list.length}건`;

                const listContainer = document.getElementById('ddList');
                listContainer.innerHTML = '';

                if (list.length === 0) {
                    listContainer.innerHTML = '<div class="empty-msg">내역이 없습니다.</div>';
                } else {
                    list.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'dd-item';
                        const colorClass = item.type === 'plus' ? 'plus' : 'minus';
                        const icon = item.type === 'plus' ? 'caret-up' : 'caret-down';
                        div.innerHTML = `
                            <div class="dd-item-top">
                                <span class="dd-title">${item.cat}</span>
                                <span class="dd-amount ${colorClass}">
                                    ${item.amount}
                                    <ion-icon name="${icon}"></ion-icon>
                                </span>
                            </div>
                            <div class="dd-memo-box">
                                ${item.memo}
                            </div>
                            <div class="dd-time">${item.time}</div>
                        `;
                        listContainer.appendChild(div);
                    });
                }
                detailSection.scrollIntoView({ behavior: 'smooth' });
            },

            toggleCalendarView: () => {
                finance.isGridView = !finance.isGridView;
                if (finance.isGridView) finance.renderGrid();
                else finance.renderScroller();
            },

            getOverlay: () => {
                return document.querySelector('.modal-overlay');
            },
            
            updateOverlay: () => {
                const overlay = finance.getOverlay();
                const hasActiveModal = document.querySelector('.modal-container.active');
                if (overlay) {
                    if (hasActiveModal) {
                        overlay.classList.add('active');
                    } else {
                        overlay.classList.remove('active');
                    }
                }
            },

            openModal: () => {
                if (typeof finance.selectedDay === 'undefined' || !finance.selectedDay) {
                    alert("먼저 달력에서 날짜를 선택해주세요.");
                    return;
                }
                document.getElementById('inpAmount').value = '';
                document.getElementById('inpMemo').value = '';
                document.getElementById('writeModal').classList.add('active');
                finance.updateOverlay();
            },

            closeModal: () => {
                document.getElementById('writeModal').classList.remove('active');
                finance.updateOverlay();
            },

            saveData: () => {
                const cat = document.getElementById('inpCategory').value;
                const type = document.getElementById('inpType').value;
                const amt = document.getElementById('inpAmount').value;
                const memo = document.getElementById('inpMemo').value;

                if (!amt) {
                    alert("금액을 입력해주세요.");
                    return;
                }

                const now = new Date();
                const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

                const newItem = {
                    cat: cat,
                    amount: Number(amt).toLocaleString(),
                    type: type,
                    memo: memo,
                    time: timeStr
                };

                if (!finance.mockDB[finance.selectedDay]) finance.mockDB[finance.selectedDay] = [];
                finance.mockDB[finance.selectedDay].unshift(newItem);

                finance.showDetails(finance.selectedDay);
                finance.closeModal();
            },

            showBudgetAlert: () => {
                alert('기능 추가 예정입니다.');
            },

            showExpenseAlert: () => {
                alert('기능 추가 예정입니다.');
            },

            goToWrite: () => {
                if (finance.selectedDay) {
                    localStorage.setItem('selectedDate', finance.selectedDay);
                }
                location.href = 'detailswrite.html';
            },

            startMessageRotation: () => {
                const msgEl = document.getElementById('netWorthMessage');
                if (!msgEl) return;
                
                setInterval(() => {
                    finance.messageIndex = (finance.messageIndex + 1) % finance.messages.length;
                    msgEl.style.opacity = '0.5';
                    
                    setTimeout(() => {
                        msgEl.innerText = finance.messages[finance.messageIndex];
                        msgEl.style.opacity = '0.95';
                    }, 150);
                }, 5000);
            }
        };

        // 오버레이 클릭 시 모달 닫기
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.querySelector('.modal-overlay');
            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        finance.closeModal();
                    }
                });
            }
            finance.init();
        });
    </script>
</div>
