<div th:fragment="div" id="notiModal" class="modal-container page-wrapper">

    <!-- 헤더 -->
    <div class="modal-view-header">
        <button type="button" class="modal-close-btn" id="notiCloseBtn">
            <ion-icon name="chevron-back"></ion-icon>
        </button>
        <div class="modal-write-title">내 알림</div>
        <button type="button" class="noti-read-all-btn" id="notiReadAllBtn">모두 읽기</button>
    </div>

    <!-- 알림 목록 -->
    <div class="scroll-flex-1 noti-list-container" id="notiListContainer">
        <div class="noti-loading" id="notiLoading">
            <div class="noti-spinner"></div>
        </div>
        <div class="noti-empty" id="notiEmpty" style="display:none;">
            <ion-icon name="notifications-off-outline"></ion-icon>
            <p>알림이 없습니다</p>
        </div>
    </div>


    <script>
        const NotificationUI = {
            swipeState: null,

            init: function () {
                this.bindModalEvents();
                this.bindSwipe();
                window.addEventListener('sse-notification', () => this.loadNotifications());
            },

            bindModalEvents: function () {
                document.getElementById('notiCloseBtn')?.addEventListener('click', () => this.close());
                document.querySelector('.open-noti-modal')?.addEventListener('click', () => this.open());
                document.getElementById('notiReadAllBtn')?.addEventListener('click', () => this.markAllRead());
            },

            open: function () {
                document.getElementById('notiModal')?.classList.add('active');
                this.loadNotifications();
            },

            close: function () {
                document.getElementById('notiModal')?.classList.remove('active');
                const badge = document.getElementById('notiUnreadBadge');
                if (!badge) return;
                API.get('/notifications/unread-count')
                    .then(res => {
                        const count = res?.data ?? 0;
                        badge.textContent = count > 99 ? '99+' : count;
                        badge.style.display = count > 0 ? 'flex' : 'none';
                    })
                    .catch(() => {});
            },

            loadNotifications: async function () {
                const container = document.getElementById('notiListContainer');
                const loading = document.getElementById('notiLoading');
                const empty = document.getElementById('notiEmpty');

                loading.style.display = 'flex';
                empty.style.display = 'none';
                container.querySelectorAll('.noti-wrap').forEach(el => el.remove());

                try {
                    const res = await API.get('/notifications');
                    const items = res?.data ?? [];

                    loading.style.display = 'none';
                    if (items.length === 0) {
                        empty.style.display = 'flex';
                        return;
                    }
                    items.forEach(item => container.appendChild(this.createItem(item)));
                } catch (e) {
                    loading.style.display = 'none';
                    empty.style.display = 'flex';
                }
            },

            createItem: function (item) {
                const cfg = this.typeConfig(item.notiType);
                const wrap = document.createElement('div');

                const isNotify = item.notiType === 'ADMIN_NOTICE';
                wrap.className = 'noti-wrap' +
                    (item.isRead ? '' : ' unread') +
                    (isNotify ? ' admin-notice-bg' : '');
                wrap.dataset.idx = item.notiIdx;
                wrap.dataset.type = item.notiType;
                wrap.dataset.ref = item.refId;
                wrap.dataset.read = item.isRead;

                const showUnreadDot = !item.isRead && item.notiType !== 'ADMIN_NOTICE';

                wrap.innerHTML = `
                    <div class="noti-item">
                        <div class="noti-icon" style="background:${cfg.bg}; color:${cfg.color};">
                            <ion-icon name="${cfg.icon}"></ion-icon>
                        </div>
                        <div class="noti-content">
                            <div class="noti-text">${this.escapeHtml(item.message)}</div>
                            <div class="noti-time">${Utils.timeAgo(item.createdAt)}</div>
                        </div>
                        ${showUnreadDot ? '<div class="noti-unread-dot"></div>' : ''}
                    </div>
                    <div class="noti-delete-btn">
                        <ion-icon name="trash-outline"></ion-icon>삭제
                    </div>
                `;

                wrap.addEventListener('click', (e) => {
                    if (e.target.closest('.noti-delete-btn')) return;
                    if (wrap.classList.contains('swiped')) return;
                    this.handleClick(wrap);
                });
                wrap.querySelector('.noti-delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.deleteItem(wrap);
                });

                return wrap;
            },

            handleClick: async function (wrap) {
                const notiIdx = wrap.dataset.idx;
                const type = wrap.dataset.type;
                const refId = wrap.dataset.ref;

                if (wrap.dataset.read === 'false') {
                    try {
                        await API.patch(`/notifications/${notiIdx}/read`);
                        wrap.classList.remove('unread');
                        wrap.dataset.read = 'true';
                        wrap.querySelector('.noti-unread-dot')?.remove();
                    } catch (e) {}
                }

                const usedTypes = ['USED_KEYWORD_MATCH', 'USED_LIKE', 'USED_STATE_CHANGE'];
                const communityTypes = ['LIKE', 'COMMUNITY_LIKE', 'COMMENT'];
                const noticeTypes = ['REPORT_RESULT', 'ADMIN_NOTICE'];
                const validRefId = refId && refId !== 'null' && refId !== 'undefined';

                if (usedTypes.includes(type) && validRefId) {
                    this.close();
                    location.href = `/used-market?openDetail=${refId}`;
                } else if (communityTypes.includes(type) && validRefId) {
                    this.close();
                    location.href = `/community?detail=${refId}`;
                } else if (noticeTypes.includes(type) && validRefId) {
                    this.close();
                    window.openNoticeModal?.(refId);
                }
            },

            deleteItem: async function (wrap) {
                const notiIdx = wrap.dataset.idx;
                try {
                    await API.delete(`/notifications/${notiIdx}`);
                    wrap.classList.add('removing');
                    setTimeout(() => {
                        wrap.classList.add('removed');
                        wrap.addEventListener('transitionend', () => {
                            wrap.remove();
                            if (!document.querySelector('.noti-wrap')) {
                                document.getElementById('notiEmpty').style.display = 'flex';
                            }
                        }, { once: true });
                    }, 50);
                } catch (e) {
                    Utils.notify('삭제에 실패했습니다.', 'error');
                }
            },

            markAllRead: async function () {
                const unreads = document.querySelectorAll('.noti-wrap.unread');
                if (unreads.length === 0) return;
                await Promise.all([...unreads].map(wrap =>
                    API.patch(`/notifications/${wrap.dataset.idx}/read`)
                        .then(() => {
                            wrap.classList.remove('unread');
                            wrap.dataset.read = 'true';
                            wrap.querySelector('.noti-unread-dot')?.remove();
                        })
                        .catch(() => {})
                ));
            },

            // ===== 스와이프 to 삭제 =====
            bindSwipe: function () {
                const container = document.getElementById('notiListContainer');
                if (!container) return;

                const MAX = 80, THRESHOLD = 40;
                const SNAP = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                let startX = 0, startY = 0, target = null, isSwiping = false;

                const snapTo = (wrap, open) => {
                    const item = wrap.querySelector('.noti-item');
                    const del = wrap.querySelector('.noti-delete-btn');
                    if (!item || !del) return;
                    if (open) wrap.classList.add('swiped'); else wrap.classList.remove('swiped');
                    item.style.transition = `transform ${open ? '0.3s' : '0.25s'} ${SNAP}`;
                    del.style.transition  = `transform ${open ? '0.3s' : '0.25s'} ${SNAP}`;
                    item.style.transform  = open ? `translateX(-${MAX}px)` : 'translateX(0)';
                    del.style.transform   = open ? 'translateX(0%)'        : 'translateX(100%)';
                    item.addEventListener('transitionend', () => {
                        item.style.transition = item.style.transform = '';
                        del.style.transition  = del.style.transform  = '';
                    }, { once: true });
                };

                container.addEventListener('pointerdown', (e) => {
                    const wrap = e.target.closest('.noti-wrap');
                    if (!wrap) return;
                    startX = e.clientX; startY = e.clientY;
                    target = wrap; isSwiping = false;
                });

                container.addEventListener('pointermove', (e) => {
                    if (!target) return;
                    const dx = e.clientX - startX, dy = e.clientY - startY;
                    if (!isSwiping) {
                        if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
                        if (Math.abs(dy) >= Math.abs(dx)) { target = null; return; }
                        isSwiping = true;
                    }
                    e.preventDefault();
                    const item = target.querySelector('.noti-item');
                    const del  = target.querySelector('.noti-delete-btn');
                    // 고무줄: -80px 초과 시 저항감 적용
                    const tx    = dx < -MAX ? -MAX + (dx + MAX) * 0.15 : Math.min(dx, 0);
                    const ratio = Math.min(Math.abs(tx) / MAX, 1);
                    item.style.transition = del.style.transition = 'none';
                    item.style.transform  = `translateX(${tx}px)`;
                    del.style.transform   = `translateX(${(1 - ratio) * 100}%)`;
                }, { passive: false });

                container.addEventListener('pointerup', (e) => {
                    if (!target || !isSwiping) { target = null; isSwiping = false; return; }
                    // 스와이프 후 발생하는 click 이벤트가 handleClick으로 전달되지 않도록 캡처 단계에서 차단
                    container.addEventListener('click', ev => ev.stopImmediatePropagation(), { once: true, capture: true });
                    const shouldOpen = e.clientX - startX < -THRESHOLD;
                    if (shouldOpen) document.querySelectorAll('.noti-wrap.swiped').forEach(w => { if (w !== target) snapTo(w, false); });
                    snapTo(target, shouldOpen);
                    target = null; isSwiping = false;
                });

                container.addEventListener('click', (e) => {
                    if (!e.target.closest('.noti-wrap.swiped'))
                        document.querySelectorAll('.noti-wrap.swiped').forEach(w => snapTo(w, false));
                });
            },

            typeConfig: function (type) {
                const map = {
                    USED_KEYWORD_MATCH: { icon: 'pricetag',         bg: '#e6fcf5', color: '#0ca678' },
                    USED_LIKE:          { icon: 'heart',             bg: '#fff0f0', color: '#fa5252' },
                    USED_STATE_CHANGE:  { icon: 'swap-horizontal',   bg: '#fff4e6', color: '#fd7e14' },
                    LIKE:               { icon: 'heart',             bg: '#fff0f0', color: '#fa5252' },
                    COMMUNITY_LIKE:     { icon: 'heart',             bg: '#fff0f0', color: '#fa5252' },
                    COMMENT:            { icon: 'chatbubbles',       bg: '#e8f4fd', color: '#0095f6' },
                    CHAT:               { icon: 'chatbubbles',       bg: '#e8f4fd', color: '#0095f6' },
                    KEYWORD:            { icon: 'pricetag',          bg: '#e6fcf5', color: '#0ca678' },
                    REPORT_RESULT:      { icon: 'megaphone',         bg: '#fff4e6', color: '#fd7e14' },
                    ADMIN_NOTICE:       { icon: 'shield-checkmark',  bg: '#eef2ff', color: '#4f46e5' },
                };
                return map[type] ?? { icon: 'notifications', bg: '#f0f0f0', color: '#888' };
            },

            escapeHtml: function (str) {
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }
        };

        document.addEventListener('DOMContentLoaded', () => NotificationUI.init());
    </script>
</div>
