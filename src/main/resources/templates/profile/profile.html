<div th:fragment="div" id="profile-layer" class="profile-layer">

    <div class="app-container" style="background: transparent; box-shadow: none;">
        <!-- Header -->
        <header class="profile-header">
            <button class="profile-icon-btn btn-back">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
            <div class="profile-header-title" id="profile-title">내 프로필</div>
            <div style="position: relative;">
                <button class="profile-icon-btn" id="profile-header-right-icon">
                    <ion-icon name="ellipsis-horizontal"></ion-icon>
                </button>
                <div id="profile-dropdown" class="custom-dropdown-menu">
                    <button class="menu-item danger" id="btn-logout">로그아웃</button>
                </div>
            </div>
        </header>

        <div class="profile-scroll-content">
            <!-- Profile Info -->
            <div class="profile-info-section">
                <img src="/images/default-profile.png" class="profile-img" id="profile-user-img">
                <div class="profile-text-group">
                    <div class="profile-user-name" id="profile-user-name">Loading...</div>
                    <div class="profile-user-desc" id="profile-user-desc">...</div>
                </div>
            </div>

            <!-- Stats Box 내가 쓴 글 / 내가 쓴 댓글 / 누른 좋아요 그 박스임.-->
            <div class="profile-stats-box" id="profile-stats-box">
                <!-- Injected via JS -->
            </div>

            <!-- Action Button -->
            <button class="profile-action-btn edit" id="profile-main-btn">프로필 수정</button>

            <!-- Manner Score -->
            <div class="profile-manner-card">
                <div class="profile-manner-header">
                    <span>매너 점수</span>
                    <span class="profile-manner-score" id="profile-manner-val">50점</span>
                </div>
                <div class="profile-progress-bg">
                    <div class="profile-progress-bar" id="profile-manner-bar" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Dynamic Content List -->
            <div id="profile-dynamic-area" class="profile-dynamic-content"></div>

        </div>
    </div>

    <!-- ========================================== -->
    <!--             [NEW] 프로필수정               -->
    <!-- ========================================== -->
    <div id="profileEditModal" class="full-screen-modal">
        <div class="page-header transparent">
            <button class="profile-icon-btn btn-back" id="btn-close-edit">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
            <div class="profile-header-title">프로필 수정</div>
            <div class="header-right" id="btn-save-profile"
                style="font-weight: 700; color: var(--primary); cursor: pointer;">
                저장
            </div>
        </div>
        <!-- <header class="profile-header" style="background: transparent; box-shadow: none;">
            <button class="profile-icon-btn btn-back" id="btn-close-edit">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
            <div class="profile-header-title">프로필 수정</div>
            <div class="profile-icon-btn" id="btn-save-profile"
                style="font-weight: 700; color: var(--primary); cursor: pointer; width: auto; padding-right: 20px;">
                저장
            </div>
        </header> -->
        <div class="form-area bar">
            <div class="signup-form-section">

                <!-- Profile Image Edit -->
                <div class="profile-edit-img-wrapper">
                    <img src="/images/default-profile.png" id="edit-profile-img-preview" class="profile-edit-img">
                    <div class="camera-badge" id="btn-upload-img">
                        <ion-icon name="camera"></ion-icon>
                    </div>
                    <input type="file" id="edit-file-input" accept="image/*" style="display: none;">
                </div>

                <!-- Nickname -->
                <div class="input-group">
                    <label class="label">닉네임</label>
                    <div style="display:flex; gap: 8px;">
                        <input type="text" id="edit-nickname" class="input-field" placeholder="닉네임 입력" maxlength="8">
                        <button type="button" id="btn-check-nickname-edit" class="btn-check-nickname"
                            style="white-space:nowrap; padding: 0 15px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight: 600;">중복
                            확인</button>
                    </div>
                    <span id="edit-nickname-status" class="nickname-status"></span>
                </div>

                <!-- Address -->
                <div class="input-group">
                    <label class="label">주소</label>
                    <div style="display:flex; gap: 8px;">
                        <input type="text" id="edit-address" class="input-field" placeholder="주소 입력">
                        <button type="button" class="geocode_btn" id="btn-search-addr">찾기</button>
                    </div>
                    <input type="hidden" id="edit-lat">
                    <input type="hidden" id="edit-lng">
                </div>

                <div class="divider" style="margin: 20px 0; border-bottom: 1px solid #eee;"></div>


                <!-- Current Password (Optional unless changing password) -->
                <div class="input-group">
                    <label class="label">현재 비밀번호 (비밀번호 변경 시 필수)</label>
                    <input type="password" id="edit-current-pw" class="input-field" placeholder="비밀번호 변경 시에만 입력해주세요">
                </div>
                <!-- Password Change -->
                <div class="input-group">
                    <label class="label">비밀번호 변경 (선택)</label>
                    <input type="password" id="edit-new-pw" class="input-field"
                        placeholder="새 비밀번호 (8자리 이상 대문자/소문자/숫자/특수문자)">
                    <input type="password" id="edit-new-pw-check" class="input-field" placeholder="새 비밀번호 확인"
                        style="margin-top: 8px;">
                </div>

                <div class="divider" style="margin: 20px 0; border-bottom: 1px solid #eee;"></div>



            </div>
        </div>
    </div>

    <script>
        // ==========================================
        //  1. Event Handler (이벤트 리스너 모음)
        // ==========================================
        const ProfileEventHandler = {
            init: () => {
                const layer = document.getElementById('profile-layer');
                // 뒤로가기 버튼
                layer.querySelector('.btn-back').addEventListener('click', ProfileApp.close);

                // 프로필 메인 버튼 (수정/채팅)
                document.getElementById('profile-main-btn').addEventListener('click', async () => {
                    const isMe = ProfileApp.state.data && ProfileApp.state.data.myProfile;
                    if (isMe) {
                        ProfileEdit.open();
                    } else {
                        try {
                            const otherUserIdx = ProfileApp.state.data.userIdx;
                            if (!otherUserIdx) return;
                            const roomId = await API.post('/api/chat/room', {
                                type: 'NORMAL',
                                otherUserIdx: otherUserIdx,
                                usedIdx: null
                            });
                            location.href = `/chat/room/${roomId}`;
                        } catch (error) {
                            Utils.notify("채팅방을 열 수 없습니다.", "error");
                        }
                    }
                });

                // 통계 탭 클릭 (Delegation) ///   내가 쓴 글 / 내가 쓴 댓글 / 누른 좋아요
                document.getElementById('profile-stats-box').addEventListener('click', (e) => {
                    const item = e.target.closest('.profile-stat-item');
                    if (item && !item.classList.contains('readonly')) {
                        const key = item.dataset.tabKey;
                        if (key) ProfileApp.switchTab(key);
                    }
                });
                // 리스트 내부 서브탭 & 아이템 클릭 (Delegation)   ///   중고거래 / 커뮤니티 선택
                document.getElementById('profile-dynamic-area').addEventListener('click', (e) => {
                    // 서브탭 클릭
                    const subTabBtn = e.target.closest('.profile-sub-tab-btn');
                    if (subTabBtn) {
                        const key = subTabBtn.dataset.subKey;
                        if (key) ProfileApp.switchSubTab(key);
                        return;
                    }
                    // 리스트 아이템 클릭
                    const listItem = e.target.closest('.profile-list-item');
                    if (listItem) {
                        const id = listItem.dataset.id;
                        const type = listItem.dataset.type;
                        if (id) ProfileApp.goToDetail(id, type);
                    }
                });

                // --- Dropdown Toggle ---
                document.getElementById('profile-header-right-icon').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dropdown = document.getElementById('profile-dropdown');
                    dropdown.classList.toggle('active');
                });

                // Close dropdown when clicking outside
                document.addEventListener('click', (e) => {
                    const dropdown = document.getElementById('profile-dropdown');
                    const iconBtn = document.getElementById('profile-header-right-icon');
                    if (dropdown && dropdown.classList.contains('active') && !dropdown.contains(e.target) && !iconBtn.contains(e.target)) {
                        dropdown.classList.remove('active');
                    }
                });

                // Logout Logic
                document.getElementById('btn-logout').addEventListener('click', async () => {
                    try {
                        const response = await fetch('/logout', { method: 'POST' });
                        if (response.ok || response.redirected) {
                            window.location.href = '/auth/login';
                        } else {
                            window.location.href = '/auth/login';
                        }
                    } catch (e) {
                        console.error(e);
                        window.location.href = '/auth/login';
                    }
                });

                // --- Edit Modal Events ---
                document.getElementById('btn-close-edit').addEventListener('click', ProfileEdit.close);
                document.getElementById('btn-save-profile').addEventListener('click', ProfileEdit.save);

                // Image Upload
                document.getElementById('btn-upload-img').addEventListener('click', () => {
                    document.getElementById('edit-file-input').click();
                });
                document.getElementById('edit-file-input').addEventListener('change', ProfileEdit.handleImageSelect);

                // Address Search
                document.getElementById('btn-search-addr').addEventListener('click', ProfileEdit.searchAddress);

                // Nickname Check
                document.getElementById('btn-check-nickname-edit').addEventListener('click', ProfileEdit.checkNickname);
                document.getElementById('edit-nickname').addEventListener('input', () => {
                    const originalNickname = ProfileApp.state.data ? ProfileApp.state.data.nickname : '';
                    const currentNickname = document.getElementById('edit-nickname').value.trim();
                    const statusEl = document.getElementById('edit-nickname-status');

                    if (currentNickname === originalNickname) {
                        statusEl.textContent = '';
                        ProfileEdit.isNicknameChecked = true;
                    } else {
                        statusEl.textContent = '';
                        ProfileEdit.isNicknameChecked = false;
                    }
                });
            }
        };

        // ==========================================
        //  2. Renderer (HTML 생성 함수 모음)
        // ==========================================
        const ProfileRenderer = {
            createStatsHTML: (tabs, currentTab) => {
                let html = '';
                tabs.forEach(t => {
                    const isActive = (currentTab === t.key) ? 'active' : '';
                    const clickAttr = t.active ? `data-tab-key="${t.key}"` : 'class="profile-stat-item readonly"';
                    const className = t.active ? `profile-stat-item ${isActive}` : 'profile-stat-item readonly';

                    // data-tab-key 속성 추가
                    html += `
                        <div class="${className}" ${t.active ? `data-tab-key="${t.key}"` : ''}>
                            <div class="profile-stat-label">${t.label}</div>
                            <div class="profile-stat-value">${t.value}</div>
                        </div>
                    `;
                });
                return html;
            },

            createListHTML: (title, showSubTabs, subTab, items, currentTab) => {
                let html = `<div class="profile-section-title">${title}</div>`;

                if (showSubTabs) {
                    const mkActive = subTab === 'market' ? 'active' : '';
                    const cmActive = subTab === 'community' ? 'active' : '';
                    html += `
                        <div class="profile-sub-tabs">
                            <button class="profile-sub-tab-btn ${mkActive}" data-sub-key="market">중고거래</button>
                            <button class="profile-sub-tab-btn ${cmActive}" data-sub-key="community">커뮤니티</button>
                        </div>
                    `;
                }

                if (items.length > 0) {
                    items.forEach(item => {
                        // 썸네일 처리 (usedListRes는 thumbnailPath, profileItemDto는 thumbnail)
                        const thumbSrc = item.thumbnailPath || item.thumbnail;
                        const thumb = thumbSrc
                            ? `<img src="${thumbSrc}" class="profile-list-thumb">`
                            : "";

                        // 시간 처리
                        const timeVal = item.createdAt || item.timeAgo; // DTO 차이 대응
                        const timeStr = (typeof Utils !== 'undefined') ? Utils.timeAgo(timeVal) : timeVal;

                        // 뱃지 및 가격 처리
                        let badgeHtml = '';
                        let priceHtml = '';
                        let type = item.type || (subTab === 'market' ? 'market' : 'community');
                        let id = item.id || item.usedIdx || item.boardIdx; // DTO 필드명 차이 대응

                        // 중고거래 아이템 (UsedListRes)
                        if (subTab === 'market' || type === 'market') {
                            const state = (item.usedState === 'TRADING' || item.usedState === 'SALE') ? '판매중' : (item.usedState === 'RESERVED' ? '예약중' : '판매완료');
                            const stateClass = (item.usedState === 'TRADING' || item.usedState === 'SALE') ? 'market' : 'comm'; // 색상 구분용
                            badgeHtml = `<span class="profile-badge ${stateClass}">${state}</span>`;
                            priceHtml = `<div class="profile-list-price">${(item.usedPrice || item.price || 0).toLocaleString()}원</div>`;
                        } else {
                            // 커뮤니티 아이템
                            let catName = (currentTab === 'comments') ? "댓글" : (item.category || item.boardCategory);
                            badgeHtml = `<span class="profile-badge comm">${catName}</span>`;
                        }

                        // onclick 제거하고 data-id와 data-type 추가
                        html += `
                            <div class="profile-list-item" data-id="${id}" data-type="${type}">
                                <div class="profile-list-info">
                                    <div class="profile-list-meta">
                                        ${badgeHtml} ${timeStr}
                                    </div>
                                    <div class="profile-list-title">${item.title || item.usedTitle || item.boardTitle || item.replyContent}</div>
                                    ${priceHtml} 
                                    <div class="profile-feed-preview">${item.contentPreview || item.usedContent || ''}</div>
                                </div>
                                ${thumb}
                            </div>
                        `;
                    });
                } else {
                    const msg = (subTab === 'market') ? "내역이 없습니다." : "내역이 없습니다.";
                    html += `<div class="profile-empty-state">${msg}</div>`;
                }
                return html;
            }
        };

        // ==========================================
        //  3. Profile App (데이터 및 로직 관리)
        // ==========================================
        const ProfileApp = {
            state: {
                data: null,
                currentTab: 'posts',
                subTab: 'community',
                isLoading: false
            },

            // 초기화
            init: () => {
                ProfileEventHandler.init();
            },

            open: async (targetUserIdx = null) => {
                ProfileApp.resetUI();

                // 데이터 로딩과 최소 딜레이(800ms)를 병렬로 수행
                const dataPromise = ProfileApp.loadData(targetUserIdx);
                const delayPromise = new Promise(resolve => setTimeout(resolve, 800));

                await Promise.all([dataPromise, delayPromise]);

                ProfileApp.showModal();

                if (!history.state || history.state.modal !== 'profile') {
                    history.pushState({ modal: 'profile', userIdx: targetUserIdx }, 'Profile', '');
                }
                ProfileApp.bindHistoryEvent();
            },

            showModal: () => {
                const layer = document.getElementById('profile-layer');
                if (typeof window.modalZIndex === 'undefined') window.modalZIndex = 5000;
                window.modalZIndex++;
                layer.style.zIndex = window.modalZIndex;

                layer.style.display = 'flex';
                void layer.offsetWidth;
                layer.classList.add('active');
            },

            bindHistoryEvent: () => {
                window.onpopstate = function (event) {
                    const viewForm = document.querySelector('#viewForm');
                    if (viewForm && viewForm.classList.contains('active')) {
                        if (typeof CommunityView !== 'undefined') CommunityView.closeView();
                        return;
                    }
                    if (document.getElementById('profileEditModal').classList.contains('active')) {
                        ProfileEdit.close();
                        return;
                    }
                    if (document.getElementById('profile-layer').classList.contains('active')) {
                        ProfileApp.close();
                    }
                };
            },

            close: () => {
                const layer = document.getElementById('profile-layer');
                layer.classList.remove('active');
                layer.classList.add('closing');

                setTimeout(() => {
                    layer.style.display = 'none';
                    layer.classList.remove('closing');
                    ProfileApp.resetState();
                }, 300);
            },

            resetUI: () => {
                document.getElementById('profile-user-name').innerText = '';
                document.getElementById('profile-user-desc').innerText = '';
                document.getElementById('profile-user-img').src = '/images/default-profile.png';
                document.getElementById('profile-manner-val').innerText = '50점';
                document.getElementById('profile-manner-bar').style.width = '0%';
                document.getElementById('profile-stats-box').innerHTML = '';
                document.getElementById('profile-dynamic-area').innerHTML = '<div class="profile-empty-state">로딩 중...</div>';
            },

            resetState: () => {
                ProfileApp.state.data = null;
                ProfileApp.state.currentTab = 'posts';
                ProfileApp.state.subTab = 'community';
            },

            loadData: async (userIdx) => {
                try {
                    ProfileApp.state.isLoading = true;
                    const url = userIdx ? `/profile/api/${userIdx}` : '/profile/api/me';

                    const data = await API.get(url);
                    ProfileApp.state.data = data;

                    ProfileApp.render();

                } catch (e) {
                    console.error(e);
                    Utils.notify("프로필 정보를 불러올 수 없습니다.", "error");
                    ProfileApp.close();
                } finally {
                    ProfileApp.state.isLoading = false;
                }
            },

            render: () => {
                if (!ProfileApp.state.data) return;
                ProfileApp.renderHeader();
                ProfileApp.renderStats();
                ProfileApp.renderList();
            },

            renderHeader: () => {
                const { data } = ProfileApp.state;
                const isMe = data.myProfile;

                document.getElementById('profile-title').innerText = isMe ? "내 프로필" : "프로필";
                document.getElementById('profile-user-name').innerText = data.nickname;
                document.getElementById('profile-user-desc').innerText = data.description || "소개글이 없습니다.";
                document.getElementById('profile-user-img').src = data.profileImg || "/images/default-profile.png";

                const score = data.mannerScore || 36;
                document.getElementById('profile-manner-val').innerText = score + "점";
                document.getElementById('profile-manner-bar').style.width = Math.min(score, 100) + "%";

                const rightIcon = document.getElementById('profile-header-right-icon');
                const mainBtn = document.getElementById('profile-main-btn');

                if (isMe) {
                    rightIcon.innerHTML = '<ion-icon name="ellipsis-horizontal"></ion-icon>';
                    mainBtn.innerText = "프로필 수정";
                    mainBtn.className = "profile-action-btn edit";
                } else {
                    rightIcon.innerHTML = '<ion-icon name="ellipsis-vertical"></ion-icon>';
                    mainBtn.innerText = "1:1 채팅하기";
                    mainBtn.className = "profile-action-btn";
                }
            },

            renderStats: () => {
                const { data, currentTab } = ProfileApp.state;
                const isMe = data.myProfile;
                const statsBox = document.getElementById('profile-stats-box');

                let tabs = [
                    { key: 'posts', label: '작성한 글', value: data.postCount, active: true },
                    { key: 'comments', label: '작성한 댓글', value: data.commentCount, active: isMe }
                ];

                if (isMe) {
                    tabs.push({ key: 'likes', label: '관심 목록', value: data.likeCount, active: true });
                }

                statsBox.innerHTML = ProfileRenderer.createStatsHTML(tabs, currentTab);
            },

            switchTab: (key) => {
                ProfileApp.state.currentTab = key;
                ProfileApp.state.subTab = 'community'; // 기본 탭
                ProfileApp.renderStats();
                ProfileApp.renderList();
            },

            switchSubTab: (key) => {
                ProfileApp.state.subTab = key;
                ProfileApp.renderList();
            },

            renderList: () => {
                const { data, currentTab, subTab } = ProfileApp.state;
                const container = document.getElementById('profile-dynamic-area');

                let items = [];
                let title = "";
                let showSubTabs = false;

                if (currentTab === 'posts') {
                    title = "작성한 글 목록";
                    showSubTabs = true;
                    if (data.posts && Array.isArray(data.posts)) {
                        items = data.posts.filter(p => p.type === subTab);
                    }
                } else if (currentTab === 'comments') {
                    title = "내가 쓴 댓글";
                    items = data.comments || [];
                } else if (currentTab === 'likes') {
                    title = "관심 목록";
                    showSubTabs = true;

                    // 이미 백엔드에서 합쳐서 내려주므로 필터링만 하면 됨
                    if (data.likes && Array.isArray(data.likes)) {
                        items = data.likes.filter(p => p.type === subTab);
                    }
                }

                container.innerHTML = ProfileRenderer.createListHTML(title, showSubTabs, subTab, items, currentTab);
            }, goToDetail: (id, type) => {
                if (type === 'market') {
                    // 중고거래 목록 페이지로 이동
                    location.href = `/used-market?openDetail=${id}`;
                } else {
                    // 커뮤니티 (또는 댓글)
                    if (typeof CommunityView !== 'undefined') {
                        try {
                            CommunityView.openView(id);
                        } catch (e) {
                            console.error("CommunityView error:", e);
                            const profileUserIdx = ProfileApp.state.data ? ProfileApp.state.data.userIdx : '';
                            location.href = `/community?openBoard=${id}&from=profile&profileUser=${profileUserIdx}`;
                        }
                    } else {
                        const profileUserIdx = ProfileApp.state.data ? ProfileApp.state.data.userIdx : '';
                        location.href = `/community?openBoard=${id}&from=profile&profileUser=${profileUserIdx}`;
                    }
                }
            }
        };

        // ==========================================
        //  4. Profile Edit (수정 로직)
        // ==========================================
        const ProfileEdit = {
            selectedFile: null,
            isNicknameChecked: true,

            open: () => {
                const data = ProfileApp.state.data;
                if (!data) return;

                // Pre-fill fields
                document.getElementById('edit-nickname').value = data.nickname;
                document.getElementById('edit-address').value = data.description; // 주소
                document.getElementById('edit-nickname-status').textContent = '';
                ProfileEdit.isNicknameChecked = true;
                document.getElementById('edit-profile-img-preview').src = data.profileImg || "/images/default-profile.png";

                // Clear password fields
                document.getElementById('edit-current-pw').value = '';
                document.getElementById('edit-new-pw').value = '';
                document.getElementById('edit-new-pw-check').value = '';
                ProfileEdit.selectedFile = null;

                const modal = document.getElementById('profileEditModal');
                if (typeof window.modalZIndex === 'undefined') window.modalZIndex = 5000;
                window.modalZIndex++;
                modal.style.zIndex = window.modalZIndex;
                modal.classList.add('active');

                // Push history state to handle back button
                history.pushState({ modal: 'profileEdit' }, 'Edit Profile', '');
            },

            close: () => {
                const modal = document.getElementById('profileEditModal');
                modal.classList.remove('active');
                if (history.state && history.state.modal === 'profileEdit') {
                    // history.back(); // This might trigger closing the main profile too if not careful
                    // Just rely on the popstate event handler in ProfileApp
                }
            },

            checkNickname: async () => {
                const userNickname = document.getElementById('edit-nickname').value.trim();
                const originalNickname = ProfileApp.state.data ? ProfileApp.state.data.nickname : '';

                if (!userNickname) {
                    Utils.notify('닉네임을 입력해주세요', 'warning');
                    return;
                }

                if (userNickname === originalNickname) {
                    const statusEl = document.getElementById('edit-nickname-status');
                    statusEl.textContent = '현재 사용 중인 닉네임입니다';
                    statusEl.style.color = '#FF4B4B';
                    ProfileEdit.isNicknameChecked = true;
                    return;
                }

                try {
                    const res = await API.post('/auth/check-nickname', { userNickname });
                    const statusEl = document.getElementById('edit-nickname-status');
                    if (res.data.isDuplicate) {
                        statusEl.textContent = '이미 사용 중인 닉네임입니다';
                        statusEl.style.color = '#FF4B4B';
                        Utils.notify('이미 사용 중인 닉네임입니다', 'warning');
                        ProfileEdit.isNicknameChecked = false;
                    } else {
                        statusEl.textContent = '사용 가능한 닉네임입니다';
                        statusEl.style.color = '#00C46B';
                        Utils.notify('사용 가능한 닉네임입니다', 'success');
                        ProfileEdit.isNicknameChecked = true;
                    }
                } catch (error) {
                    Utils.notify('닉네임 확인 실패: ' + error.message, 'error');
                }
            },

            handleImageSelect: (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    Utils.notify('이미지 파일만 업로드 가능합니다.', 'error');
                    return;
                }

                ProfileEdit.selectedFile = file;

                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('edit-profile-img-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            searchAddress: () => {
                const addrInput = document.getElementById('edit-address');
                const address = addrInput.value.trim();

                if (!address) {
                    Utils.notify('주소를 입력해주세요.', 'warning');
                    return;
                }

                if (typeof google === 'undefined' || !google.maps || !google.maps.Geocoder) {
                    Utils.notify('지도 API가 로드되지 않았습니다.', 'error');
                    return;
                }

                new google.maps.Geocoder().geocode({ address: address }, (results, status) => {
                    if (status === 'OK') {
                        const lat = results[0].geometry.location.lat();
                        const lng = results[0].geometry.location.lng();
                        const formattedAddress = results[0].formatted_address;

                        document.getElementById('edit-address').value = formattedAddress;
                        document.getElementById('edit-lat').value = lat;
                        document.getElementById('edit-lng').value = lng;
                    } else {
                        Utils.notify('주소를 찾을 수 없습니다.', 'error');
                    }
                });
            },

            save: async () => {
                const nickname = document.getElementById('edit-nickname').value.trim();
                const address = document.getElementById('edit-address').value.trim();
                const lat = document.getElementById('edit-lat').value;
                const lng = document.getElementById('edit-lng').value;
                const currentPw = document.getElementById('edit-current-pw').value;
                const newPw = document.getElementById('edit-new-pw').value;
                const newPwCheck = document.getElementById('edit-new-pw-check').value;

                if (newPw && !currentPw) {
                    Utils.notify('비밀번호 변경을 위해 현재 비밀번호를 입력해주세요.', 'warning');
                    return;
                }

                if (newPw && (!Validation.password(newPw))) {
                    Utils.notify('비밀번호는 8~16자, 대문자/소문자/숫자/특수문자(@,#,$,!,%,*,?,&)를 포함해야 합니다', 'error');
                    return;
                }

                if (!nickname) {
                    Utils.notify('닉네임을 입력해주세요.', 'warning');
                    return;
                }

                if (!ProfileEdit.isNicknameChecked) {
                    Utils.notify('닉네임 중복확인을 해주세요.', 'warning');
                    return;
                }

                if (newPw && newPw !== newPwCheck) {
                    Utils.notify('새 비밀번호가 일치하지 않습니다.', 'warning');
                    return;
                }

                const formData = new FormData();
                const updateData = {
                    nickname: nickname,
                    address: address,
                    lat: lat ? parseFloat(lat) : null,
                    lng: lng ? parseFloat(lng) : null,
                    currentPassword: currentPw,
                    newPassword: newPw || null
                };

                formData.append('data', new Blob([JSON.stringify(updateData)], { type: 'application/json' }));
                if (ProfileEdit.selectedFile) {
                    formData.append('profileImage', ProfileEdit.selectedFile);
                }

                try {
                    const response = await fetch('/profile/update', {
                        method: 'PUT',
                        body: formData
                    });

                    if (response.ok) {
                        Utils.notify('프로필이 수정되었습니다.', 'success');
                        ProfileEdit.close();
                        ProfileApp.loadData(); // Reload data
                    } else {
                        const errorText = await response.text();
                        // ErrorCode에 따라 메시지 분기 가능
                        if (errorText.includes("INVALID_PASSWORD")) {
                            Utils.notify('현재 비밀번호가 일치하지 않습니다.', 'error');
                        } else {
                            Utils.notify('수정 실패: ' + errorText, 'error');
                        }
                    }
                } catch (e) {
                    console.error(e);
                    Utils.notify('오류가 발생했습니다.', 'error');
                }
            }
        };

        // 초기화
        ProfileApp.init();

        window.ProfileApp = ProfileApp;
        window.openProfile = ProfileApp.open;
    </script>
</div>
