<div th:fragment="div" id="profile-layer" class="profile-layer">

    <div class="app-container" style="background: transparent; box-shadow: none;">
        <!-- Header -->
        <header class="profile-header">
            <button class="profile-icon-btn btn-back">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
            <div class="profile-header-title" id="profile-title">내 프로필</div>
            <div class="profile-icon-btn" id="profile-header-right-icon">
                <ion-icon name="settings-outline"></ion-icon>
            </div>
        </header>

        <div class="profile-scroll-content">
            <!-- Profile Info -->
            <div class="profile-info-section">
                <img src="/images/default-profile.png" class="profile-img" id="profile-user-img">
                <div class="profile-text-group">
                    <div class="profile-user-name" id="profile-user-name">Loading...</div>
                    <div class="profile-user-desc" id="profile-user-desc">...</div>
                </div>
            </div>

            <!-- Stats Box 내가 쓴 글 / 내가 쓴 댓글 / 누른 좋아요 그 박스임.-->
            <div class="profile-stats-box" id="profile-stats-box">
                <!-- Injected via JS -->
            </div>

            <!-- Action Button -->
            <button class="profile-action-btn edit" id="profile-main-btn">프로필 수정</button>

            <!-- Manner Score -->
            <div class="profile-manner-card">
                <div class="profile-manner-header">
                    <span>매너 점수</span>
                    <span class="profile-manner-score" id="profile-manner-val">0°C</span>
                </div>
                <div class="profile-progress-bg">
                    <div class="profile-progress-bar" id="profile-manner-bar" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Dynamic Content List -->
            <div id="profile-dynamic-area" class="profile-dynamic-content"></div>

        </div>
    </div>

    <script>
        // ==========================================
        //  1. Event Handler (이벤트 리스너 모음)
        // ==========================================
        const ProfileEventHandler = {
            init: () => {
                const layer = document.getElementById('profile-layer');
                // 뒤로가기 버튼
                layer.querySelector('.btn-back').addEventListener('click', ProfileApp.close);
                // 프로필 메인 버튼 (수정/채팅)
                document.getElementById('profile-main-btn').addEventListener('click', () => {
                    alert('준비중입니다.');
                });
                // 통계 탭 클릭 (Delegation) ///   내가 쓴 글 / 내가 쓴 댓글 / 누른 좋아요
                document.getElementById('profile-stats-box').addEventListener('click', (e) => {
                    const item = e.target.closest('.profile-stat-item');
                    if (item && !item.classList.contains('readonly')) {
                        const key = item.dataset.tabKey;
                        if (key) ProfileApp.switchTab(key);
                    }
                });
                // 리스트 내부 서브탭 & 아이템 클릭 (Delegation)   ///   중고거래 / 커뮤니티 선택
                document.getElementById('profile-dynamic-area').addEventListener('click', (e) => {
                    // 서브탭 클릭
                    const subTabBtn = e.target.closest('.profile-sub-tab-btn');
                    if (subTabBtn) {
                        const key = subTabBtn.dataset.subKey;
                        if (key) ProfileApp.switchSubTab(key);
                        return;
                    }
                    // 리스트 아이템 클릭
                    const listItem = e.target.closest('.profile-list-item');
                    if (listItem) {
                        const id = listItem.dataset.id;
                        if (id) ProfileApp.goToDetail(id);
                    }
                });
            }
        };

        // ==========================================
        //  2. Renderer (HTML 생성 함수 모음)
        // ==========================================
        const ProfileRenderer = {
            createStatsHTML: (tabs, currentTab) => {
                let html = '';
                tabs.forEach(t => {
                    const isActive = (currentTab === t.key) ? 'active' : '';
                    const clickAttr = t.active ? `data-tab-key="${t.key}"` : 'class="profile-stat-item readonly"';
                    const className = t.active ? `profile-stat-item ${isActive}` : 'profile-stat-item readonly';

                    // data-tab-key 속성 추가
                    html += `
                        <div class="${className}" ${t.active ? `data-tab-key="${t.key}"` : ''}>
                            <div class="profile-stat-label">${t.label}</div>
                            <div class="profile-stat-value">${t.value}</div>
                        </div>
                    `;
                });
                return html;
            },

            createListHTML: (title, showSubTabs, subTab, items, currentTab) => {
                let html = `<div class="profile-section-title">${title}</div>`;

                if (showSubTabs) {
                    const mkActive = subTab === 'market' ? 'active' : '';
                    const cmActive = subTab === 'community' ? 'active' : '';
                    // onclick 제거하고 data-sub-key 추가
                    html += `
                        <div class="profile-sub-tabs">
                            <button class="profile-sub-tab-btn ${mkActive}" data-sub-key="market">중고거래</button>
                            <button class="profile-sub-tab-btn ${cmActive}" data-sub-key="community">커뮤니티</button>
                        </div>
                    `;
                }

                if (items.length > 0) {
                    items.forEach(item => {
                        const thumb = item.thumbnail
                            ? `<img src="${item.thumbnail}" class="profile-list-thumb">`
                            : "";

                        const timeStr = (typeof Utils !== 'undefined') ? Utils.timeAgo(item.timeAgo) : item.timeAgo;
                        let badgeText = (currentTab === 'comments') ? "댓글" : item.category;

                        // onclick 제거하고 data-id 추가
                        html += `
                            <div class="profile-list-item" data-id="${item.id}">
                                
                                <div class="profile-list-info">
                                    <div class="profile-list-meta">
                                        <span class="profile-badge comm">${badgeText}</span>   ${timeStr}
                                    </div>
                                    <div class="profile-list-title">${item.title}</div>
                                    <div class="profile-feed-preview">${item.contentPreview || ''}</div>
                                </div>
                                ${thumb}
                            </div>
                        `;
                    });
                } else {
                    const msg = (subTab === 'market') ? "중고거래 기능은 준비중입니다." : "내역이 없습니다.";
                    html += `<div class="profile-empty-state">${msg}</div>`;
                }
                return html;
            }
        };

        // ==========================================
        //  3. Profile App (데이터 및 로직 관리)
        // ==========================================
        const ProfileApp = {
            state: {
                data: null,
                currentTab: 'posts',
                subTab: 'community',
                isLoading: false
            },

            // 초기화
            init: () => {
                ProfileEventHandler.init();
            },

            open: async (targetUserIdx = null) => {
                ProfileApp.resetUI();
                ProfileApp.showModal();

                if (!history.state || history.state.modal !== 'profile') {
                    history.pushState({ modal: 'profile', userIdx: targetUserIdx }, 'Profile', '');
                }
                ProfileApp.bindHistoryEvent();

                await ProfileApp.loadData(targetUserIdx);
            },

            showModal: () => {
                const layer = document.getElementById('profile-layer');
                if (typeof window.modalZIndex === 'undefined') window.modalZIndex = 5000;
                window.modalZIndex++;
                layer.style.zIndex = window.modalZIndex;

                layer.style.display = 'flex';
                void layer.offsetWidth;
                layer.classList.add('active');
            },

            bindHistoryEvent: () => {
                window.onpopstate = function (event) {
                    const viewForm = document.querySelector('#viewForm');
                    if (viewForm && viewForm.classList.contains('active')) {
                        if (typeof CommunityView !== 'undefined') CommunityView.closeView();
                        return;
                    }
                    if (document.getElementById('profile-layer').classList.contains('active')) {
                        ProfileApp.close();
                    }
                };
            },

            close: () => {
                const layer = document.getElementById('profile-layer');
                layer.classList.remove('active');
                layer.classList.add('closing');

                setTimeout(() => {
                    layer.style.display = 'none';
                    layer.classList.remove('closing');
                    ProfileApp.resetState();
                }, 300);
            },

            resetUI: () => {
                document.getElementById('profile-user-name').innerText = '';
                document.getElementById('profile-user-desc').innerText = '';
                document.getElementById('profile-user-img').src = '/images/default-profile.png';
                document.getElementById('profile-manner-val').innerText = '0°C';
                document.getElementById('profile-manner-bar').style.width = '0%';
                document.getElementById('profile-stats-box').innerHTML = '';
                document.getElementById('profile-dynamic-area').innerHTML = '<div class="profile-empty-state">로딩 중...</div>';
            },

            resetState: () => {
                ProfileApp.state.data = null;
                ProfileApp.state.currentTab = 'posts';
                ProfileApp.state.subTab = 'community';
            },

            loadData: async (userIdx) => {
                try {
                    ProfileApp.state.isLoading = true;
                    const url = userIdx ? `/profile/api/${userIdx}` : '/profile/api/me';

                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Failed to load profile");

                    const data = await response.json();
                    ProfileApp.state.data = data;

                    ProfileApp.render();

                } catch (e) {
                    console.error(e);
                    alert("프로필 정보를 불러올 수 없습니다.");
                    ProfileApp.close();
                } finally {
                    ProfileApp.state.isLoading = false;
                }
            },

            render: () => {
                if (!ProfileApp.state.data) return;
                ProfileApp.renderHeader();
                ProfileApp.renderStats();
                ProfileApp.renderList();
            },

            renderHeader: () => {
                const { data } = ProfileApp.state;
                const isMe = data.myProfile;

                document.getElementById('profile-title').innerText = isMe ? "내 프로필" : "프로필";
                document.getElementById('profile-user-name').innerText = data.nickname;
                document.getElementById('profile-user-desc').innerText = data.description || "소개글이 없습니다.";
                document.getElementById('profile-user-img').src = data.profileImg || "/images/default-profile.png";

                const score = data.mannerScore || 36;
                document.getElementById('profile-manner-val').innerText = score + "°C";
                document.getElementById('profile-manner-bar').style.width = Math.min(score, 100) + "%";

                const rightIcon = document.getElementById('profile-header-right-icon');
                const mainBtn = document.getElementById('profile-main-btn');

                if (isMe) {
                    rightIcon.innerHTML = '<ion-icon name="settings-outline"></ion-icon>';
                    mainBtn.innerText = "프로필 수정";
                    mainBtn.className = "profile-action-btn edit";
                } else {
                    rightIcon.innerHTML = '<ion-icon name="ellipsis-vertical"></ion-icon>';
                    mainBtn.innerText = "1:1 채팅하기";
                    mainBtn.className = "profile-action-btn";
                }
            },

            renderStats: () => {
                const { data, currentTab } = ProfileApp.state;
                const isMe = data.myProfile;
                const statsBox = document.getElementById('profile-stats-box');

                let tabs = [
                    { key: 'posts', label: '작성한 글', value: data.postCount, active: true },
                    { key: 'comments', label: '작성한 댓글', value: data.commentCount, active: isMe }
                ];

                if (isMe) {
                    tabs.push({ key: 'likes', label: '누른 좋아요', value: data.likeCount, active: true });
                }

                statsBox.innerHTML = ProfileRenderer.createStatsHTML(tabs, currentTab);
            },

            switchTab: (key) => {
                ProfileApp.state.currentTab = key;
                ProfileApp.state.subTab = 'community';
                ProfileApp.renderStats();
                ProfileApp.renderList();
            },

            switchSubTab: (key) => {
                ProfileApp.state.subTab = key;
                ProfileApp.renderList();
            },

            renderList: () => {
                const { data, currentTab, subTab } = ProfileApp.state;
                const container = document.getElementById('profile-dynamic-area');

                let items = [];
                let title = "";
                let showSubTabs = false;

                if (currentTab === 'posts') {
                    title = "작성한 글 목록";
                    showSubTabs = true;
                    items = (subTab === 'community') ? (data.posts || []) : [];
                } else if (currentTab === 'comments') {
                    title = "내가 쓴 댓글";
                    items = data.comments || [];
                } else if (currentTab === 'likes') {
                    title = "관심 목록";
                    showSubTabs = true;
                    items = (subTab === 'community') ? (data.likes || []) : [];
                }

                container.innerHTML = ProfileRenderer.createListHTML(title, showSubTabs, subTab, items, currentTab);
            },

            goToDetail: (id) => {
                if (location.pathname.includes('/community') && typeof CommunityView !== 'undefined') {
                    CommunityView.openView(id);
                } else {
                    const profileUserIdx = ProfileApp.state.data ? ProfileApp.state.data.userIdx : '';
                    location.href = `/community?openBoard=${id}&from=profile&profileUser=${profileUserIdx}`;
                }
            }
        };

        // 초기화
        ProfileApp.init();

        window.ProfileApp = ProfileApp;
        window.openProfile = ProfileApp.open;
    </script>
</div>
