<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/common.css">
    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script async defer
        th:src="@{https://maps.googleapis.com/maps/api/js(key=${googleMapsApiKey},libraries='places,geocoding')}"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/validation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            signup.init();
        });

        const signup = {
            init: () => {
                signup.evtHandler();
            },
            evtHandler: () => {
                document.querySelector('.geocode_btn').addEventListener('click', () => signup.getGoogleGeocode());
                document.querySelector('.btn-send-code').addEventListener('click', () => signup.sendVerificationCode());
                document.querySelector('.btn-verify-code').addEventListener('click', () => signup.verifyEmail());
                document.querySelector('.btn-check-nickname').addEventListener('click', () => signup.checkNickname());
                document.querySelector('.btn-primary').addEventListener('click', () => signup.submitForm());
            },
            getGoogleGeocode: () => {
                const address = document.querySelector('input[name="userAddress"]').value;

                if (!address) {
                    Utils.notify('주소를 입력해주세요', 'warning');
                    return;
                }

                new google.maps.Geocoder().geocode({ address }, (results, status) => {
                    if (status === 'OK') {
                        const lat = results[0].geometry.location.lat();
                        const lng = results[0].geometry.location.lng();

                        document.querySelector('input[name="userAddress"]').value = results[0].formatted_address;
                        document.querySelector('input[name="userLat"]').value = lat;
                        document.querySelector('input[name="userLng"]').value = lng;
                    } else {
                        Utils.notify('주소를 찾을 수 없습니다: ' + status, 'error');
                    }
                });
            },
            sendVerificationCode: async () => {
                const userEmail = document.querySelector('[name="userEmail"]').value;

                if (!Validation.required(userEmail) || !Validation.email(userEmail)) {
                    Utils.notify('올바른 이메일을 입력해주세요', 'error');
                    return;
                }

                try {
                    const res = await API.post('/auth/send-verification-code', { userEmail });

                    if (res.status === 200) {
                        Utils.notify('인증 코드가 이메일로 발송되었습니다', 'success');

                        // 인증 코드 입력 섹션 표시
                        document.querySelector('.verification-section').style.display = 'block';
                        document.querySelector('[name="verificationCode"]').focus();

                        // 버튼 비활성화
                        document.querySelector('.btn-send-code').disabled = true;
                        document.querySelector('[name="userEmail"]').disabled = true;
                    }
                } catch (error) {
                    Utils.notify(error.message, 'error');
                }
            },

            verifyEmail: async () => {
                const verificationCode = document.querySelector('[name="verificationCode"]').value;
                const userEmail = document.querySelector('[name="userEmail"]').value;

                if (!Validation.required(verificationCode)) {
                    Utils.notify('인증 코드를 입력해주세요', 'warning');
                    return;
                }

                try {
                    const res = await API.post('/auth/verify-email', { userEmail, verificationCode });

                    if (res.status === 200) {
                        Utils.notify('이메일 인증이 완료되었습니다!', 'success');

                        // 이메일 필드 비활성화
                        document.querySelector('[name="userEmail"]').disabled = true;
                        document.querySelector('.btn-send-code').disabled = true;

                        // 인증 섹션 숨김
                        document.querySelector('.verification-section').style.display = 'none';

                        // 비밀번호 필드로 포커스 이동
                        document.querySelector('[name="password"]').focus();
                    }
                } catch (error) {
                    Utils.notify('인증에 실패했습니다: ' + error.message, 'error');
                }
            },

            checkNickname: async () => {
                const userNickname = document.querySelector('[name="userNickname"]').value;

                if (!Validation.required(userNickname)) {
                    Utils.notify('닉네임을 입력해주세요', 'warning');
                    return;
                }

                try {
                    const res = await API.post('/auth/check-nickname', { userNickname });

                    const statusEl = document.querySelector('.nickname-status');
                    if (res.data.isDuplicate) {
                        statusEl.textContent = '이미 사용 중인 닉네임입니다';
                        statusEl.style.color = '#FF4B4B';
                        Utils.notify('이미 사용 중인 닉네임입니다', 'warning');
                    } else {
                        statusEl.textContent = '사용 가능한 닉네임입니다';
                        statusEl.style.color = '#00C46B';
                        Utils.notify('사용 가능한 닉네임입니다', 'success');
                    }
                } catch (error) {
                    Utils.notify('닉네임 확인 실패: ' + error.message, 'error');
                }
            },

            submitForm: async () => {
                const userEmail = document.querySelector('[name="userEmail"]').value;
                const password = document.querySelector('[name="password"]').value;
                const userPwCheck = document.querySelector('[name="userPwCheck"]').value;
                const userName = document.querySelector('[name="userName"]').value;
                const userNickname = document.querySelector('[name="userNickname"]').value;
                const userAddress = document.querySelector('[name="userAddress"]').value;
                const userLat = document.querySelector('[name="userLat"]').value;
                const userLng = document.querySelector('[name="userLng"]').value;

                // 필수 검증
                if (!Validation.required(password) || !Validation.password(password)) {
                    Utils.notify('비밀번호는 8~16자, 대문자/소문자/숫자/특수문자(@,#,$,!,%,*,?,&)를 포함해야 합니다', 'error');
                    return;
                }
                if (password !== userPwCheck) {
                    Utils.notify('비밀번호가 일치하지 않습니다', 'error');
                    return;
                }
                if (!Validation.required(userName)) {
                    Utils.notify('이름을 입력해주세요', 'warning');
                    return;
                }
                if (!Validation.required(userNickname)) {
                    Utils.notify('닉네임을 입력해주세요', 'warning');
                    return;
                }
                if (!Validation.required(userAddress)) {
                    Utils.notify('주소를 입력해주세요', 'warning');
                    return;
                }
                if (!userLat || !userLng) {
                    Utils.notify('주소 검색을 완료해주세요', 'warning');
                    return;
                }

                // 닉네임 중복 검증
                const nicknameStatus = document.querySelector('.nickname-status').textContent;
                if (!nicknameStatus.includes('사용 가능')) {
                    Utils.notify('닉네임 중복확인을 해주세요', 'warning');
                    return;
                }

                // 약관 검증
                const termChks = document.querySelectorAll('.term-chk[required]');
                for (let chk of termChks) {
                    if (!chk.checked) {
                        Utils.notify('필수 약관에 동의해주세요', 'warning');
                        return;
                    }
                }

                // 서버 전송
                try {
                    const formData = {
                        userEmail,
                        password,
                        userName,
                        userNickname,
                        userAddress,
                        userLat: parseFloat(userLat),
                        userLng: parseFloat(userLng)
                    };

                    const res = await API.post('/auth/signup', formData);

                    if (res.status === 200) {
                        Utils.notify('회원가입이 완료되었습니다!\n로그인 페이지로 이동합니다.', 'success', 4000);
                        setTimeout(() => {
                            window.location.href = '/auth/login';
                        }, 1500);
                    }
                } catch (error) {
                    Utils.notify('회원가입 실패: ' + error.message, 'error');
                }
            }
        };

        /**
         * 약관 전체 동의/해제
         */
        function toggleAll(checkbox) {
            const termChks = document.querySelectorAll('.term-chk');
            termChks.forEach(chk => {
                chk.checked = checkbox.checked;
            });
        }
    </script>
</head>

<body>

    <div class="app-container bg-gradient no-scrollbar">

        <div class="page-header transparent">
            <div class="header-left" onclick="history.back()">
                <ion-icon name="chevron-back"></ion-icon>
            </div>
            <div class="header-title">회원가입</div>
        </div>

        <div class="form-area no-scrollbar">

            <!-- Phase 2: 회원가입 폼 (항상 표시) -->
            <div class="signup-form-section">
                <!-- Phase 1: 이메일 인증 -->
                <div class="email-section">
                    <div class="input-group">
                        <label class="label">아이디 (이메일) <span>*</span></label>
                        <input type="email" name="userEmail" class="input-field" placeholder="example@email.com">
                    </div>
                    <button type="button" class="btn-send-code">인증코드 발송</button>
                </div>

                <!-- Phase 1.5: 인증 코드 입력 (초기에 숨김) -->
                <div class="verification-section" style="display: none;">
                    <div class="input-group">
                        <label class="label">인증 코드 <span>*</span></label>
                        <input type="text" name="verificationCode" class="input-field"
                            placeholder="메일로 받은 인증 코드 입력 (예: 123456)">
                    </div>
                    <button type="button" class="btn-verify-code">이메일 인증</button>
                </div>
                <div class="input-group">
                    <label class="label">비밀번호 <span>*</span></label>
                    <input type="password" name="password" class="input-field" placeholder="8자리 이상 (대문자/소문자/숫자/특수문자)">
                    <input type="password" name="userPwCheck" class="input-field" placeholder="비밀번호 확인"
                        style="margin-top:8px;">
                </div>

                <div class="input-group">
                    <label class="label">이름 <span>*</span></label>
                    <input type="text" name="userName" class="input-field" placeholder="이름 입력">
                </div>

                <div class="input-group">
                    <label class="label">닉네임 <span>*</span></label>
                    <div style="display:flex; gap: 8px;">
                        <input type="text" name="userNickname" class="input-field" placeholder="활동명 입력" maxlength="8">
                        <button type="button" class="btn-check-nickname">중복 확인</button>
                    </div>
                    <span class="nickname-status"></span>
                </div>

                <div class="input-group">
                    <label class="label">주소 <span>*</span></label>
                    <div style="display:flex; gap: 8px;">
                        <input type="text" name="userAddress" class="input-field" placeholder="주소 입력">
                        <button type="button" class="geocode_btn">주소 찾기</button>
                    </div>
                    <input type="hidden" name="userLat">
                    <input type="hidden" name="userLng">
                </div>

                <div class="terms-box">
                    <label class="check-row all">
                        <input type="checkbox" name="checkAll" onchange="toggleAll(this)"><span>약관 전체 동의</span>
                    </label>

                    <label class="check-row">
                        <input type="checkbox" class="term-chk" required>
                        <span class="term-text">(필수) 서비스 이용약관</span>
                        <span class="term-link">보기</span>
                    </label>

                    <label class="check-row">
                        <input type="checkbox" class="term-chk" required>
                        <span class="term-text">(필수) 개인정보 수집 및 이용</span>
                        <span class="term-link">보기</span>
                    </label>

                    <label class="check-row">
                        <input type="checkbox" class="term-chk" required>
                        <span class="term-text">(필수) 위치기반 서비스 이용</span>
                    </label>

                    <label class="check-row">
                        <input type="checkbox" class="term-chk" required>
                        <span class="term-text">(필수) 만 14세 이상입니다</span>
                    </label>

                    <label class="check-row">
                        <input type="checkbox" class="term-chk" id="marketingChk">
                        <span class="term-text">(선택) 마케팅 정보 수신 동의</span>
                    </label>
                </div>

                <button type="button" class="btn-primary">회원가입 완료</button>
            </div>

        </div>
    </div>

</body>

</html>
