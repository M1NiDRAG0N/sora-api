<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 소라고동</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/common.css">
    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/validation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            login.init();
        });

        const login = {
            init: () => {
                login.evtHandler();
            },
            evtHandler: () => {
                document.querySelector('.login-btn').addEventListener('click', () => login.submitForm());
            },
            submitForm: async () => {
                const loginId = document.querySelector('#loginId').value.trim();
                const loginPw = document.querySelector('#loginPw').value;

                // 필수 검증
                if (!Validation.required(loginId) || !Validation.email(loginId)) {
                    Utils.notify('올바른 이메일을 입력해주세요', 'error');
                    return;
                }
                if (!Validation.required(loginPw)) {
                    Utils.notify('비밀번호를 입력해주세요', 'error');
                    return;
                }

                try {
                    // FormData로 form-based 인증 요청
                    const formData = new FormData();
                    formData.append('userEmail', loginId);
                    formData.append('password', loginPw);

                    const response = await fetch('/auth/login-proc', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        Utils.notify(errorData.message || '로그인 실패', 'error');
                        return;
                    }

                    Utils.notify('로그인되었습니다!', 'success', 4000);
                    
                    // 1.5초 후 홈으로 이동
                    setTimeout(() => {
                        window.location.href = '/main';
                    }, 1500);
                } catch (error) {
                    console.error('로그인 실패:', error);
                    Utils.notify('로그인 실패: ' + error.message, 'error');
                }
            }
        };

        /**
         * Enter 키 처리
         */
        function handleEnter(event) {
            if (event.key === 'Enter') {
                login.submitForm();
            }
        }
    </script>
</head>
<body>
    <div class="app-container bg-gradient">
        
        <div class="login-content">
            
            <img src="/images/logo.png" alt="소라고동" class="login-logo">
            
            <div class="login-title">
                반가워요!<br>
                <span style="color:var(--primary-dark)">소라고동</span>에 접속해 볼까요?
            </div>

            <div class="login-form-area">
                <input type="text" id="loginId" class="input-field" placeholder="아이디 입력">
                <input type="password" id="loginPw" class="input-field" placeholder="비밀번호 입력" onkeypress="handleEnter(event)">
            </div>

            <button class="login-btn btn-primary">로그인</button>

            <div class="login-links">
                <span class="link-item" onclick="location.href='/auth/find'">비밀번호 재설정</span>
                <span class="link-divider">|</span>
                <span class="link-item" onclick="location.href='/auth/signup'" style="font-weight: 700; color:var(--text-main);">회원가입</span>
            </div>

        </div>
    </div>
</body>
</html>
