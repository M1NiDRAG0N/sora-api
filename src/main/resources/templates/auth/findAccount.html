<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소라고동 - 계정 찾기</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/findAccount.css">
    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script>
        // --- 탭 및 아이디 찾기 로직 (동일) ---
        function switchTab(mode) {
            document.getElementById('tab-id').classList.toggle('active', mode === 'findId');
            document.getElementById('tab-pw').classList.toggle('active', mode === 'findPw');
            document.getElementById('section-findId').classList.toggle('hidden', mode !== 'findId');
            document.getElementById('section-findPw').classList.toggle('hidden', mode !== 'findPw');
        }
        function showIdResult() {
            document.getElementById('findId-form').classList.add('hidden');
            document.getElementById('findId-result').classList.remove('hidden');
        }

        // --- 비밀번호 찾기 로직 (수정됨) ---
        let timerInterval;
        let isAuthSent = false;
        let isResendMode = false; // 현재 재전송 가능 상태인지

        function handleMainButton() {
            const btn = document.getElementById('mainActionBtn');

            if (!isAuthSent) {
                // [전송 시작]
                alert('인증번호가 발송되었습니다.');
                isAuthSent = true;

                // UI 변경
                document.getElementById('auth-code-row').classList.remove('hidden');
                btn.innerText = "인증 확인";
                btn.classList.add('btn-disabled');
                btn.disabled = true;

                startTimer(10); // 3분
            } else {
                // [인증 확인]
                clearInterval(timerInterval);
                document.getElementById('pw-step1').classList.add('hidden');
                document.getElementById('pw-step2').classList.remove('hidden');
            }
        }

        function checkAuthCode() {
            const input = document.getElementById('authInput');
            const btn = document.getElementById('mainActionBtn');
            if (input.value.length >= 6) {
                btn.classList.remove('btn-disabled');
                btn.disabled = false;
            } else {
                btn.classList.add('btn-disabled');
                btn.disabled = true;
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer');

            // 타이머 모드로 초기화
            isResendMode = false;
            display.classList.remove('is-resend'); // 버튼 스타일 제거
            display.innerText = "00:10"; // 텍스트 초기화

            clearInterval(timerInterval);
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    // [시간 초과 시] 재전송 버튼으로 변신
                    switchToResendMode(display);
                }
            }, 1000);
        }

        function switchToResendMode(element) {
            isResendMode = true;
            element.innerText = "재전송";  // 텍스트 변경
            element.classList.add('is-resend'); // 버튼 스타일(보라색) 적용
        }

        // 타이머(재전송 버튼) 클릭 시
        function handleTimerClick() {
            if (isResendMode) {
                alert('인증번호가 재전송되었습니다.');
                document.getElementById('authInput').value = '';
                checkAuthCode();

                // 다시 타이머 시작
                startTimer(10);
            }
        }
    </script>
</head>

<body>

    <div class="app-container bg-gradient">

        <div class="page-header transparent">
            <button class="header-btn-icon" onclick="history.back()">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
            <div class="header-title-center">계정찾기</div>
            <button class="header-btn-icon" style="opacity: 0; cursor: default;">
                <ion-icon name="ellipsis-horizontal"></ion-icon>
            </button>
        </div>

        <div class="account-tabs">
            <button class="tab-btn active" onclick="switchTab('findId')" id="tab-id">아이디 찾기</button>
            <button class="tab-btn" onclick="switchTab('findPw')" id="tab-pw">비밀번호 찾기</button>
        </div>

        <div class="community-scroll-area">

            <div id="section-findId">
                <div id="findId-form" class="form-container">
                    <div>
                        <label class="input-label">이메일</label>
                        <input type="email" class="input-field-styled" placeholder="example@email.com">
                    </div>
                    <div>
                        <label class="input-label">전화번호</label>
                        <input type="tel" class="input-field-styled" placeholder="하이픈(-) 없이 입력">
                    </div>
                    <button class="btn-primary" style="margin-top: 20px;" onclick="showIdResult()">아이디 찾기</button>
                </div>

                <div id="findId-result" class="result-box hidden">
                    <div class="result-text">정보와 일치하는 아이디입니다.</div>
                    <div class="id-display-card">sora_godong_123</div>
                    <button class="btn-primary" onclick="alert('로그인 페이지로 이동')">로그인</button>
                </div>
            </div>

            <div id="section-findPw" class="hidden">
                <div id="pw-step1" class="form-container">
                    <div>
                        <label class="input-label">아이디</label>
                        <input type="text" class="input-field-styled" placeholder="아이디를 입력하세요">
                    </div>
                    <div>
                        <label class="input-label">이메일</label>
                        <input type="email" class="input-field-styled" placeholder="가입한 이메일 입력">
                    </div>
                    <div>
                        <label class="input-label">전화번호</label>
                        <input type="tel" class="input-field-styled" placeholder="전화번호 입력">
                    </div>

                    <div id="auth-code-row" class="hidden">
                        <label class="input-label">인증번호</label>
                        <div class="auth-row">
                            <div class="input-with-timer">
                                <input type="number" id="authInput" class="input-field-styled" placeholder="인증번호 6자리"
                                    oninput="checkAuthCode()">

                                <span class="timer-text" id="timer" onclick="handleTimerClick()">03:00</span>
                            </div>
                        </div>
                    </div>

                    <button id="mainActionBtn" class="btn-primary" style="margin-top: 20px;"
                        onclick="handleMainButton()">
                        이메일 인증번호 전송
                    </button>
                </div>

                <div id="pw-step2" class="form-container hidden">
                    <div style="text-align:center; margin: 20px 0; font-weight:700; color:#333;">비밀번호를 재설정해주세요.</div>
                    <div>
                        <label class="input-label">새 비밀번호</label>
                        <input type="password" class="input-field-styled" placeholder="새 비밀번호 입력">
                    </div>
                    <div>
                        <label class="input-label">새 비밀번호 확인</label>
                        <input type="password" class="input-field-styled" placeholder="비밀번호 다시 입력">
                    </div>
                    <button class="btn-primary" style="margin-top: 20px;"
                        onclick="alert('비밀번호가 변경되었습니다!'); location.reload();">비밀번호 변경완료</button>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
