<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소라고동 - 계정 찾기</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/findAccount.css">
    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/validation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            findAccount.init();
        });

        const findAccount = {
            state: {
                timerInterval: null,
                isAuthSent: false,
                isResendMode: false,
                userEmail: "",
                verificationCode: ""
            },

            init: () => {
                findAccount.evtHandler();
            },

            evtHandler: () => {
                document.getElementById('mainActionBtn').addEventListener('click', () => findAccount.handleMainButton());
                document.getElementById('timer').addEventListener('click', () => findAccount.handleTimerClick());
                document.getElementById('authInput').addEventListener('input', () => findAccount.checkAuthCode());
                document.querySelector('.form-container:last-child button').addEventListener('click', () => findAccount.handlePasswordChange());
            },

            handleMainButton: async () => {
                const btn = document.getElementById('mainActionBtn');
                const email = document.getElementById('emailInput').value.trim();

                if (!findAccount.state.isAuthSent) {
                    // [전송 시작] - 비밀번호 리셋 코드 발송
                    if (!Validation.required(email)) {
                        Utils.notify('이메일을 입력해주세요.', 'error');
                        return;
                    }

                    if (!Validation.email(email)) {
                        Utils.notify('올바른 이메일 형식을 입력해주세요.', 'error');
                        return;
                    }

                    try {
                        await API.post('/auth/send-password-reset-code', { userEmail: email });
                        
                        findAccount.state.userEmail = email;
                        findAccount.state.isAuthSent = true;

                        Utils.notify('인증번호가 발송되었습니다.', 'success');

                        // UI 변경
                        document.getElementById('auth-code-row').classList.remove('hidden');
                        btn.innerText = "인증 확인";
                        btn.classList.add('btn-disabled');
                        btn.disabled = true;

                        findAccount.startTimer(600); // 10분
                    } catch (error) {
                        console.error('Error:', error);
                        Utils.notify(error.message || '인증번호 발송 실패', 'error');
                    }
                } else {
                    // [인증 확인] - 인증번호 검증
                    const authInput = document.getElementById('authInput').value.trim();
                    
                    if (!Validation.required(authInput)) {
                        Utils.notify('인증번호를 입력해주세요.', 'error');
                        return;
                    }

                    try {
                        await API.post('/auth/verify-password-reset-code', { 
                            userEmail: findAccount.state.userEmail,
                            verificationCode: authInput 
                        });
                        
                        findAccount.state.verificationCode = authInput;
                        clearInterval(findAccount.state.timerInterval);
                        document.getElementById('pw-step1').classList.add('hidden');
                        document.getElementById('pw-step2').classList.remove('hidden');
                    } catch (error) {
                        console.error('Error:', error);
                        Utils.notify(error.message || '인증 실패', 'error');
                    }
                }
            },

            checkAuthCode: () => {
                const input = document.getElementById('authInput');
                const btn = document.getElementById('mainActionBtn');
                if (input.value.length >= 6) {
                    btn.classList.remove('btn-disabled');
                    btn.disabled = false;
                } else {
                    btn.classList.add('btn-disabled');
                    btn.disabled = true;
                }
            },

            startTimer: (duration) => {
                let timer = duration, minutes, seconds;
                const display = document.getElementById('timer');

                // 타이머 모드로 초기화
                findAccount.state.isResendMode = false;
                display.classList.remove('is-resend');

                clearInterval(findAccount.state.timerInterval);
                findAccount.state.timerInterval = setInterval(function () {
                    minutes = parseInt(timer / 60, 10);
                    seconds = parseInt(timer % 60, 10);
                    minutes = minutes < 10 ? "0" + minutes : minutes;
                    seconds = seconds < 10 ? "0" + seconds : seconds;

                    display.innerText = minutes + ":" + seconds;

                    if (--timer < 0) {
                        clearInterval(findAccount.state.timerInterval);
                        findAccount.switchToResendMode(display);
                    }
                }, 1000);
            },

            switchToResendMode: (element) => {
                findAccount.state.isResendMode = true;
                element.innerText = "재전송";
                element.classList.add('is-resend');
            },

            handleTimerClick: async () => {
                if (findAccount.state.isResendMode) {
                    try {
                        await API.post('/auth/send-password-reset-code', { userEmail: findAccount.state.userEmail });
                        
                        Utils.notify('인증번호가 재전송되었습니다.', 'success');
                        document.getElementById('authInput').value = '';
                        findAccount.checkAuthCode();

                        findAccount.startTimer(600); // 10분
                    } catch (error) {
                        console.error('Error:', error);
                        Utils.notify(error.message || '재전송 실패', 'error');
                    }
                }
            },

            handlePasswordChange: async () => {
                const pw1 = document.getElementById('newPassword').value.trim();
                const pw2 = document.getElementById('confirmPassword').value.trim();
                
                if (!Validation.required(pw1)) {
                    Utils.notify('새 비밀번호를 입력해주세요.', 'error');
                    return;
                }

                if (!Validation.required(pw2)) {
                    Utils.notify('비밀번호 확인을 입력해주세요.', 'error');
                    return;
                }
                
                if (pw1 !== pw2) {
                    Utils.notify('비밀번호가 일치하지 않습니다.', 'error');
                    return;
                }
                
                if (!Validation.password(pw1)) {
                    Utils.notify('비밀번호는 8-16자이며, 대문자, 소문자, 숫자, 특수문자를 포함해야 합니다.', 'error');
                    return;
                }
                
                try {
                    await API.post('/auth/reset-password', { 
                        userEmail: findAccount.state.userEmail,
                        newPassword: pw1
                    });
                    
                    Utils.notify('비밀번호가 변경되었습니다!', 'success', 2000);
                    setTimeout(() => {
                        window.location.href = '/auth/login';
                    }, 2000);
                } catch (error) {
                    console.error('Error:', error);
                    Utils.notify(error.message || '비밀번호 변경 실패', 'error');
                }
            }
        };
    </script>
</head>

<body>

    <div class="app-container bg-gradient">

        <div class="page-header transparent">
            <button class="header-btn-icon" onclick="history.back()">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
            <div class="header-title-center">비밀번호 재설정</div>
            <button class="header-btn-icon" style="opacity: 0; cursor: default;">
                <ion-icon name="ellipsis-horizontal"></ion-icon>
            </button>
        </div>

        <div class="community-scroll-area findaccount-page">

            <div id="section-findPw">
                <div id="pw-step1" class="form-container">
                    <div>
                        <label class="input-label">이메일</label>
                        <input type="email" id="emailInput" class="input-field-styled" placeholder="가입한 이메일 입력">
                    </div>

                    <div id="auth-code-row" class="hidden">
                        <label class="input-label">인증번호</label>
                        <div class="auth-row">
                            <div class="input-with-timer">
                                <input type="text" id="authInput" class="input-field-styled" placeholder="인증번호 6자리">

                                <span class="timer-text" id="timer">10:00</span>
                            </div>
                        </div>
                    </div>

                    <button id="mainActionBtn" class="btn-primary" style="margin-top: 20px;">
                        이메일 인증번호 전송
                    </button>
                </div>

                <div id="pw-step2" class="form-container hidden">
                    <div style="text-align:center; margin: 20px 0; font-weight:700; color:#333;">비밀번호를 재설정해주세요.</div>
                    <div>
                        <label class="input-label">새 비밀번호</label>
                        <input type="password" id="newPassword" class="input-field-styled" placeholder="새 비밀번호 입력">
                    </div>
                    <div>
                        <label class="input-label">새 비밀번호 확인</label>
                        <input type="password" id="confirmPassword" class="input-field-styled" placeholder="비밀번호 다시 입력">
                    </div>
                    <button class="btn-primary" style="margin-top: 20px;">비밀번호 변경완료</button>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
