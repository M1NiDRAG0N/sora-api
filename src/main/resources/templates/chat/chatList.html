<div class="profile-app-container" th:fragment="div">

    <div class="filter-tabs">
        <button class="filter-btn active">전체</button>
        <button class="filter-btn">중고거래</button>
        <button class="filter-btn">1:1채팅</button>
    </div>

    <div class="chat-list-content"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            chatList.init();
        });

        const chatList = {
            data: [], // 전체 데이터 저장
            currentFilter: 'ALL', // 현재 필터 상태
            stompClient: null,
            userId: null, // 로그인한 사용자 ID (API 등으로 가져와야 함)

            init: () => {
                chatList.load();
                chatList.bindEvents();
                chatList.connectWebSocket();
            },

            load: async () => {
                try {
                    const data = await API.get('/api/chat/list');
                    // 최신 메시지 순으로 정렬 (null이면 맨 뒤로)
                    data.sort((a, b) => {
                        if (!a.lastMessageAt) return 1;
                        if (!b.lastMessageAt) return -1;
                        return new Date(b.lastMessageAt) - new Date(a.lastMessageAt);
                    });
                    chatList.data = data;
                    chatList.render();
                } catch (error) {
                    console.error('Error loading chat list:', error);
                }
            },

            render: () => {
                const container = document.querySelector('.chat-list-content');
                if (!container) return;
                
                let filtered = chatList.data;
                if (chatList.currentFilter === 'USED') {
                    filtered = chatList.data.filter(d => d.type === 'USED');
                } else if (chatList.currentFilter === 'NORMAL') {
                    filtered = chatList.data.filter(d => d.type === 'NORMAL');
                }

                if (filtered.length === 0) {
                    container.innerHTML = '<div style="padding: 50px; text-align: center; color: #aaa;">채팅 내역이 없습니다.</div>';
                    return;
                }

                container.innerHTML = filtered.map(dto => {
                    if (dto.type === 'USED') return Renderer.createUsedCardHTML(dto);
                    else return Renderer.createNormalCardHtml(dto);
                }).join('');
            },

            bindEvents: () => {
                const buttons = document.querySelectorAll('.filter-btn');
                buttons.forEach((btn, idx) => {
                    btn.addEventListener('click', () => {
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        if (idx === 0) chatList.currentFilter = 'ALL';
                        else if (idx === 1) chatList.currentFilter = 'USED';
                        else chatList.currentFilter = 'NORMAL';
                        
                        chatList.render();
                    });
                });
            },

            connectWebSocket: () => {
                // SSE를 통해 채팅 알림이 오면 목록 실시간 갱신
                window.addEventListener('sse-notification', (e) => {
                    const data = e.detail;
                    if (data && data.type === 'CHAT') {
                        chatList.load(); // 채팅 알림이 오면 목록 다시 로드
                    }
                });
            }
        }
        const Renderer = {
            createUsedCardHTML: (dto) => {
                const profileImg = dto.otherUserProfileIdx != null ? `/img/${dto.otherUserProfileIdx}` : '/images/default-profile.png';
                const productImg = profileImg; // 임시
                const timeAgo = (window.Utils && window.Utils.timeAgo) ? Utils.timeAgo(dto.lastMessageAt) : (dto.lastMessageAt || '');

                return `
                        <div class="chat-item market" onclick="location.href='/chat/room/${dto.chatRoomIdx}'">
                            <div class="chat-thumb-wrap">
                                <img src="${productImg}" class="chat-thumb">
                                <img src="${profileImg}" class="profile-badge">
                            </div>
                            <div class="chat-info">
                                <div class="chat-top">
                                    <span class="chat-name">${dto.otherUserNickname}</span>
                                    <span class="chat-time">${timeAgo}</span>
                                </div>
                                <div class="chat-bottom">
                                    <div class="chat-preview">${dto.lastMessage || '대화 내용이 없습니다.'}</div>
                                    ${dto.unreadCount > 0 ? `<div class="unread-badge">${dto.unreadCount}</div>` : ''}
                                </div>
                            </div>
                        </div>
                `;
            },
            createNormalCardHtml: (dto) => {
                const profileImg = dto.otherUserProfileIdx != null ? `/img/${dto.otherUserProfileIdx}` : '/images/default-profile.png';
                const timeAgo = (window.Utils && window.Utils.timeAgo) ? Utils.timeAgo(dto.lastMessageAt) : (dto.lastMessageAt || '');

                return `
                        <div class="chat-item" onclick="location.href='/chat/room/${dto.chatRoomIdx}'">
                            <div class="chat-thumb-wrap">
                                <img src="${profileImg}" class="chat-thumb">
                            </div>
                            <div class="chat-info">
                                <div class="chat-top">
                                    <span class="chat-name">${dto.otherUserNickname}</span>
                                    <span class="chat-time">${timeAgo}</span>
                                </div>
                                <div class="chat-bottom">
                                    <div class="chat-preview">${dto.lastMessage || '대화 내용이 없습니다.'}</div>
                                    ${dto.unreadCount > 0 ? `<div class="unread-badge">${dto.unreadCount}</div>` : ''}
                                </div>
                            </div>
                        </div>
                `;
            }
        }
    </script>
</div>
