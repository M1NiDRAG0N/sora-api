<div class="chat-room-container" th:fragment="div">

    <!-- 헤더 (ai-chat 스타일) -->
    <div class="ai-chat-header">
        <button type="button" class="ai-chat-close-btn" onclick="history.back()">
            <ion-icon name="chevron-back"></ion-icon>
        </button>
        <div class="ai-chat-title">
            <img th:src="${partnerProfileImg != null ? '/img/' + partnerProfileImg : '/images/default-profile.png'}"
                class="ai-chat-logo" style="border-radius:50%; width: 32px; height: 32px;">
            <span th:text="${partnerNickname ?: '상대방'}">상대방</span>
        </div>
        <button type="button" class="ai-chat-clear-btn" title="메뉴">
            <ion-icon name="ellipsis-vertical"></ion-icon>
        </button>
    </div>

    <!-- 중고거래 마켓일 경우에만 노출되는 상품 정보 카드 -->
    <th:block th:if="${chatRoomType == 'USED'}">
        <div class="product-info-card">
            <img th:src="${productImg != null ? '/img/' + productImg : '/images/default-store.jpg'}"
                class="product-thumb">
            <div class="product-details">
                <div class="product-status-row">
                    <span class="status-badge" th:text="${productStatus ?: '판매중'}">판매중</span>
                    <span class="product-name" th:text="${productName ?: '상품명 정보 없음'}">상품명</span>
                </div>
                <div class="product-price"
                    th:text="${productPrice != null ? #numbers.formatInteger(productPrice, 3, 'COMMA') + '원' : '-원'}">
                    가격</div>
            </div>
            <!-- 거래 상태 변경 버튼 -->
            <button class="complete-btn" onclick="alert('거래 상태를 변경하시겠습니까?')">상태 변경</button>
        </div>
    </th:block>

    <!-- 채팅 내용 -->
    <div class="ai-chat-body no-scrollbar" id="chatContainer">
        <!-- 채팅 내역 로드 및 실시간 메시지 추가 영역 -->
    </div>

    <!-- 입력창 -->
    <div class="ai-chat-input-area">
        <div class="chat-input-box">
            <input type="text" class="chat-input" id="chatInput" placeholder="메시지를 입력하세요...">
            <button type="button" class="btn-send-circle" id="chatSendBtn">
                <ion-icon name="paper-plane"></ion-icon>
            </button>
        </div>
    </div>

    <script th:inline="javascript">
        const roomId = /*[[${roomId}]]*/ 0;
        const loginUserIdx = /*[[${loginUserIdx}]]*/ 0;
        const loginUserNickname = /*[[${loginUserNickname}]]*/ '';
        const partnerProfileImg = /*[[${partnerProfileImg}]]*/ null;

        const ChatApp = {
            stompClient: null,
            partnerImg: partnerProfileImg ? `/img/${partnerProfileImg}` : '/images/default-profile.png',

            init() {
                this.loadHistory();
                this.connect();
                this.bindEvents();
            },

            connect() {
                const socket = new SockJS('/ws-chat');
                this.stompClient = Stomp.over(socket);
                this.stompClient.debug = null; // 디버그 로그 끄기

                this.stompClient.connect({}, (frame) => {
                    this.stompClient.subscribe(`/sub/chat/room/${roomId}`, (message) => {
                        const chat = JSON.parse(message.body);
                        this.appendMessage(chat);
                    });
                }, (error) => {
                    console.error('WebSocket Connection Error:', error);
                    setTimeout(() => this.connect(), 5000); // 5초 후 재연결 시도
                });
            },

            async loadHistory() {
                try {
                    const response = await fetch(`/api/chat/history/${roomId}`);
                    const data = await response.json();
                    data.forEach(chat => this.appendMessage(chat));
                    this.scrollToBottom();
                } catch (e) {
                    console.error('History Load Error:', e);
                }
            },

            send() {
                const input = document.getElementById('chatInput');
                const message = input.value.trim();
                if (!message || !this.stompClient) return;

                const payload = {
                    roomId: roomId,
                    senderIdx: loginUserIdx,
                    senderNickname: loginUserNickname,
                    message: message,
                    type: 'TALK'
                };

                this.stompClient.send("/pub/chat/message", {}, JSON.stringify(payload));
                input.value = '';
            },

            appendMessage(chat) {
                const container = document.getElementById('chatContainer');
                const isMe = Number(chat.senderIdx) === Number(loginUserIdx);

                const row = document.createElement('div');
                row.className = isMe ? 'bubble-row me' : 'bubble-row';

                let html = '';
                if (!isMe) {
                    html += `<img src="${this.partnerImg}" class="chat-profile" onclick="window.openProfile(${chat.senderIdx})" style="cursor:pointer;">`;
                }
                html += `<div class="bubble ${isMe ? 'me' : 'other'}">${this.escapeHtml(chat.message)}</div>`;

                row.innerHTML = html;
                container.appendChild(row);
                this.scrollToBottom();
            },

            scrollToBottom() {
                const container = document.getElementById('chatContainer');
                container.scrollTop = container.scrollHeight;
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            bindEvents() {
                document.getElementById('chatSendBtn').addEventListener('click', () => this.send());
                document.getElementById('chatInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.send();
                    }
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => ChatApp.init());
    </script>
</div>
