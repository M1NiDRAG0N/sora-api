<div class="chat-room-container" th:fragment="div">

    <!-- 헤더 -->
    <div class="room-chat-header">
        <button type="button" class="room-chat-close-btn" onclick="history.back()">
            <ion-icon name="chevron-back"></ion-icon>
        </button>
        <div class="room-chat-title">
            <img th:src="${partnerProfileImg != null ? '/img/' + partnerProfileImg : '/images/default-profile.png'}"
                class="room-chat-logo" style="border-radius:50%; width: 32px; height: 32px;">
            <span th:text="${partnerNickname ?: '상대방'}">상대방</span>
        </div>
        <button type="button" class="room-chat-clear-btn" title="메뉴">
            <ion-icon name="ellipsis-vertical"></ion-icon>
        </button>
    </div>

    <!-- 중고거래 마켓일 경우에만 노출되는 상품 정보 카드 -->
    <th:block th:if="${chatRoomType == 'USED'}">
        <div class="product-info-card">
            <img th:src="${productImg != null ? '/img/' + productImg : '/images/default-store.jpg'}"
                class="product-thumb">
            <div class="product-details">
                <div class="product-status-row">
                    <span class="status-badge" th:text="${productStatus == 'SOLD' ? '판매완료' : (productStatus == 'RESERVED' ? '예약중' : '판매중')}">판매중</span>
                    <span class="product-name" th:text="${productName ?: '상품명 정보 없음'}">상품명</span>
                </div>
                <div class="product-price"
                    th:text="${productPrice != null ? #numbers.formatInteger(productPrice, 3, 'COMMA') + '원' : '-원'}">
                    가격</div>
            </div>
            <!-- 거래 상태 변경 버튼 -->
            <th:block th:if="${isOwner}">
                <div id="status-dropdown" class="status-dropdown">
                    <th:block th:if="${productStatus == 'SOLD'}">
                        <button class="complete-btn" disabled style="background: transparent; color: #757575; cursor: default;">판매완료</button>
                    </th:block>
                    <th:block th:unless="${productStatus == 'SOLD'}">
                        <button class="complete-btn" id="status-dropdown-btn" type="button" onclick="ChatApp.toggleStatusDropdown(event)">
                            <span id="status-dropdown-label" th:text="${productStatus == 'RESERVED' ? '예약중' : '판매중'}">판매중</span>
                            <ion-icon name="chevron-down-outline" style="font-size: 14px; margin-left: 4px;"></ion-icon>
                        </button>
                        <ul class="status-dropdown-menu" id="status-dropdown-menu" style="bottom: auto; top: calc(100% + 5px); left: auto; right: 0; transform: none;">
                            <li data-value="TRADING" onclick="ChatApp.changeStatus('TRADING', '판매중')">판매중</li>
                            <li data-value="RESERVED" onclick="ChatApp.changeStatus('RESERVED', '예약중')">예약중</li>
                            <li data-value="SOLD" onclick="ChatApp.changeStatus('SOLD', '판매완료')">판매완료</li>
                        </ul>
                    </th:block>
                </div>
            </th:block>
        </div>
    </th:block>

    <!-- 채팅 내용 -->
    <div class="room-chat-body no-scrollbar" id="roomChatContainer">
        <!-- 채팅 내역 로드 및 실시간 메시지 추가 영역 -->
    </div>

    <!-- 입력창 -->
    <div class="room-chat-input-area">
        <div class="chat-input-box">
            <input type="text" class="chat-input" id="chatInput" placeholder="메시지를 입력하세요...">
            <button type="button" class="btn-send-circle" id="chatSendBtn">
                <ion-icon name="paper-plane"></ion-icon>
            </button>
        </div>
    </div>

    <!-- 상태 변경 모달 -->
    <div class="chat-modal-overlay" id="statusConfirmModal">
        <div class="chat-custom-modal">
            <div class="chat-modal-title">거래 상태 변경</div>
            <div class="chat-modal-desc" id="statusModalDesc">
                거래 상태를 변경하시겠습니까?
            </div>
            <div class="chat-modal-btn-row">
                <button class="chat-modal-btn chat-btn-close" onclick="ChatApp.closeStatusModal()">취소</button>
                <button class="chat-modal-btn chat-btn-confirm" onclick="ChatApp.executeChangeStatus()">변경</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const roomId = /*[[${roomId}]]*/ 0;
        const loginUserIdx = /*[[${loginUserIdx}]]*/ 0;
        const loginUserNickname = /*[[${loginUserNickname}]]*/ '';
        const partnerProfileImg = /*[[${partnerProfileImg}]]*/ null;
        const partnerUserIdx = /*[[${partnerUserIdx}]]*/ null;
        const usedIdx = /*[[${usedIdx}]]*/ null;
        let currentStatus = /*[[${productStatus}]]*/ 'TRADING';

        const ChatApp = {
            stompClient: null,
            partnerImg: partnerProfileImg ? `/img/${partnerProfileImg}` : '/images/default-profile.png',

            init() {
                const modal = document.getElementById('statusConfirmModal');
                if (modal && modal.parentElement !== document.body) {
                    document.body.appendChild(modal);
                }
                
                this.loadHistory();
                this.connect();
                this.bindEvents();
                document.addEventListener('click', () => this.closeStatusDropdown());
            },

                                    toggleStatusDropdown(e) {
                                        e.stopPropagation();
                                        const dropdown = document.getElementById('status-dropdown');
                                        dropdown?.classList.toggle('open');
                                    },
                        
                                    closeStatusDropdown() {
                                        document.getElementById('status-dropdown')?.classList.remove('open');
                                    },
                        
                                    changeStatus(nextState, nextLabel) {
                                        if (!usedIdx) return;
                                        if (currentStatus === nextState) return;
                        
                                        this.pendingNextState = nextState;
                                        this.pendingNextLabel = nextLabel;
                                        this.closeStatusDropdown();
                        
                                        document.getElementById('statusModalDesc').innerText = `거래 상태를 '${nextLabel}'(으)로 변경하시겠습니까?`;
                                        document.getElementById('statusConfirmModal').classList.add('show');
                                    },
                        
                                    closeStatusModal() {
                                        document.getElementById('statusConfirmModal').classList.remove('show');
                                    },
                        
                                    async executeChangeStatus() {
                                        const nextState = this.pendingNextState;
                                        const nextLabel = this.pendingNextLabel;
                                        
                                        document.getElementById('statusConfirmModal').classList.remove('show');
                        
                                        try {
                                            let apiUrl = `/used-market/${usedIdx}/status?state=${nextState}`;
                                            if (nextState === 'SOLD' && partnerUserIdx) {
                                                apiUrl += `&buyerIdx=${partnerUserIdx}`;
                                            }
                                            const res = await API.patch(apiUrl);
                                            if (res.status === 200) {
                                                currentStatus = nextState;
                                                const badge = document.querySelector('.status-badge');
                                                if (badge) {
                                                    badge.innerText = nextLabel;
                                                    if (nextState === 'SOLD') {
                                                        badge.style.background = '#e9ecef';
                                                        badge.style.color = '#757575';
                                                    } else if (nextState === 'RESERVED') {
                                                        badge.style.background = '#fff3cd';
                                                        badge.style.color = '#856404';
                                                    } else {
                                                        badge.style.background = '#F0EDFF';
                                                        badge.style.color = '#8F7DF5';
                                                    }
                                                }
                        
                                                if (nextState === 'SOLD') {
                                                    const dropdown = document.getElementById('status-dropdown');
                                                    if (dropdown) {
                                                        dropdown.innerHTML = `<button class="complete-btn" disabled style="background: transparent; color: #757575; cursor: default;">판매완료</button>`;
                                                    }
                                                } else {
                                                    const label = document.getElementById('status-dropdown-label');
                                                    if (label) label.innerText = nextLabel;
                                                }
                        
                                                Utils.notify("거래 상태가 변경되었습니다.", "success");
                                            }
                                        } catch (e) {
                                            Utils.notify("상태 변경에 실패했습니다.", "error");
                                        }
                                    },            connect() {
                const socket = new SockJS('/ws-chat');
                this.stompClient = Stomp.over(socket);
                this.stompClient.debug = null; // 디버그 로그 끄기

                this.stompClient.connect({}, (frame) => {
                    this.stompClient.subscribe(`/sub/chat/room/${roomId}`, (message) => {
                        const chat = JSON.parse(message.body);
                        this.appendMessage(chat);
                    });
                }, (error) => {
                    console.error('WebSocket Connection Error:', error);
                    setTimeout(() => this.connect(), 5000); // 5초 후 재연결 시도
                });
            },

            async loadHistory() {
                try {
                    const data = await API.get(`/api/chat/history/${roomId}`);
                    data.forEach(chat => this.appendMessage(chat));
                    this.scrollToBottom();
                } catch (e) {
                    console.error('History Load Error:', e);
                }
            },

            send() {
                const input = document.getElementById('chatInput');
                const message = input.value.trim();
                if (!message || !this.stompClient) return;

                const payload = {
                    roomId: roomId,
                    senderIdx: loginUserIdx,
                    senderNickname: loginUserNickname,
                    message: message,
                    type: 'TALK'
                };

                this.stompClient.send("/pub/chat/message", {}, JSON.stringify(payload));
                input.value = '';
            },

            appendMessage(chat) {
                const container = document.getElementById('roomChatContainer');
                const isMe = Number(chat.senderIdx) === Number(loginUserIdx);

                const row = document.createElement('div');
                row.className = isMe ? 'bubble-row me' : 'bubble-row';

                let html = '';
                if (!isMe) {
                    html += `<img src="${this.partnerImg}" class="chat-profile" onclick="window.openProfile(${chat.senderIdx})" style="cursor:pointer;">`;
                }
                html += `<div class="bubble ${isMe ? 'me' : 'other'}">${this.escapeHtml(chat.message)}</div>`;

                row.innerHTML = html;
                container.appendChild(row);
                this.scrollToBottom();

                // 새로 메시지가 추가될 때마다 읽음 처리 (서버 부하가 우려되면 디바운스 적용 가능)
                API.post(`/api/chat/read/${roomId}`).catch(console.error);
            },

            scrollToBottom() {
                const container = document.getElementById('roomChatContainer');
                container.scrollTop = container.scrollHeight;
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            bindEvents() {
                document.getElementById('chatSendBtn').addEventListener('click', () => this.send());
                document.getElementById('chatInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.send();
                    }
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => ChatApp.init());
    </script>
</div>
