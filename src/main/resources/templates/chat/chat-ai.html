<div th:fragment="div" id="chatLayer">

    <!-- 헤더 -->
    <div class="ai-chat-header">
        <button type="button" class="ai-chat-close-btn" id="aiChatCloseBtn">
            <ion-icon name="chevron-back"></ion-icon>
        </button>
        <div class="ai-chat-title">
            <img src="/images/logo.png" class="ai-chat-logo">
            <span>마법의 소라고동</span>
        </div>
        <button type="button" class="ai-chat-clear-btn" id="aiChatClearBtn" title="대화 초기화">
            <ion-icon name="refresh-outline"></ion-icon>
        </button>
    </div>

    <!-- 채팅 내용 -->
    <div class="ai-chat-body no-scrollbar" id="chatContainer"></div>

    <!-- 입력창 -->
    <div class="ai-chat-input-area">
        <div class="chat-input-box">
            <input type="text" class="chat-input" id="aiChatInput" placeholder="메시지를 입력하세요...">
            <button class="btn-send-circle" id="aiChatSendBtn">
                <ion-icon name="paper-plane"></ion-icon>
            </button>
        </div>
    </div>

    <style>
        /* 날짜 구분선 */
        .chat-date-separator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 4px;
            padding: 0 4px;
        }

        .chat-date-separator::before,
        .chat-date-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(150, 150, 180, 0.25);
        }

        .chat-date-separator span {
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
        }

        /* 말풍선 시간 */
        .bubble-time {
            font-size: 10px;
            color: #aaa;
            align-self: flex-end;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bubble-row .bubble-time {
            margin-left: 2px;
        }

        .bubble-row.me .bubble-time {
            margin-left: 0;
            margin-right: 2px;
        }

        /* AI 응답 내 링크 */
        .chat-link {
            color: #5b8dee;
            text-decoration: underline;
            font-weight: 500;
            cursor: pointer;
        }

        .chat-link:hover {
            color: #3a6fd8;
        }

        /* AI 말풍선 내 마크다운 스타일 */
        .bubble.ai strong {
            font-weight: 700;
            color: inherit;
        }

        .bubble.ai .ai-list-item {
            display: block;
            padding-left: 4px;
            margin-top: 2px;
        }

        .bubble.ai .ai-list-item::before {
            content: '• ';
            color: #8F7DF5;
            font-weight: 700;
        }

        .bubble.ai .ai-section-break {
            display: block;
            height: 6px;
        }
    </style>

    <script th:inline="none">
        const AiChat = {
            isStreaming: false,
            lastDateKey: null,
            historyLoaded: false,
            _rafPending: false,

            init() {
                document.getElementById('aiChatCloseBtn').addEventListener('click', () => {
                    document.getElementById('chatLayer').classList.remove('active');
                    this.historyLoaded = false; // 다음 오픈 시 이력 재로드
                });
                document.getElementById('aiChatSendBtn').addEventListener('click', () => this.send());
                document.getElementById('aiChatClearBtn').addEventListener('click', () => this.clearHistory());
                document.getElementById('aiChatInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.send();
                    }
                });

                // chatLayer에 active 클래스 추가 감지 → 이력 로드
                const chatLayer = document.getElementById('chatLayer');
                new MutationObserver(() => {
                    if (chatLayer.classList.contains('active') && !this.historyLoaded) {
                        this.loadHistory();
                    }
                }).observe(chatLayer, { attributes: true, attributeFilter: ['class'] });

                // 이미 active 상태라면 즉시 로드
                if (chatLayer.classList.contains('active')) {
                    this.loadHistory();
                }
            },

            /* ── 날짜/시간 포맷 유틸 ── */
            _formatTime(timestamp) {
                const d = timestamp ? new Date(timestamp) : new Date();
                const h = d.getHours();
                const m = d.getMinutes();
                return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(m).padStart(2, '0')}`;
            },

            _dateKey(timestamp) {
                const d = timestamp ? new Date(timestamp) : new Date();
                return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
            },

            _formatDateLabel(timestamp) {
                const days = ['일', '월', '화', '수', '목', '금', '토'];
                const d = timestamp ? new Date(timestamp) : new Date();
                return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
            },

            _checkDateSeparator(timestamp) {
                const key = this._dateKey(timestamp);
                if (key !== this.lastDateKey) {
                    this.lastDateKey = key;
                    const sep = document.createElement('div');
                    sep.className = 'chat-date-separator';
                    sep.innerHTML = `<span>${this._formatDateLabel(timestamp)}</span>`;
                    document.getElementById('chatContainer').appendChild(sep);
                }
            },

            /* ── 마크다운 → HTML 변환 ── */
            _formatText(text) {
                // RegExp 생성자 사용: Thymeleaf가 [] 를 표현식으로 파싱하는 문제 회피
                const mdLink = new RegExp('\\[([^\\]]+)\\]\\((\\/[^)]+)\\)', 'g');

                // 1) HTML 이스케이프
                let html = this.escapeHtml(text);

                // 2) 리터럴 \n(백슬래시+n) → 실제 줄바꿈 (히스토리 로드 시 Redis에 저장된 포맷 호환)
                html = html.replace(/\\n/g, '\n');
                // 실제 \r\n(Windows 줄바꿈) → \n 통일
                html = html.replace(/\r\n/g, '\n');

                // 3) **bold** → <strong>
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

                // 4) 빈 줄(단락 구분) → section-break
                html = html.replace(/\n{2,}/g, '\n<span class="ai-section-break"></span>\n');

                // 5) "- 항목" 리스트 → ai-list-item
                html = html.replace(/^[-•]\s(.+)$/gm, '<span class="ai-list-item">$1</span>');

                // 6) 남은 단일 줄바꿈 → <br>
                html = html.replace(/\n/g, '<br>');

                // 7) 마크다운 링크 → <a>
                html = html.replace(mdLink, '<a href="$2" class="chat-link">$1</a>');

                return html;
            },

            /* ── 말풍선 DOM 생성 ── */
            _appendAiBubble(text, timestamp) {
                const container = document.getElementById('chatContainer');
                const row = document.createElement('div');
                row.className = 'bubble-row';
                row.innerHTML = `
                    <img src="/images/logo.png" class="chat-profile">
                    <div class="bubble ai">${this._formatText(text)}</div>
                    <span class="bubble-time">${this._formatTime(timestamp)}</span>`;
                container.appendChild(row);
            },

            _appendUserBubble(text, timestamp) {
                const container = document.getElementById('chatContainer');
                const row = document.createElement('div');
                row.className = 'bubble-row me';
                row.innerHTML = `
                    <span class="bubble-time">${this._formatTime(timestamp)}</span>
                    <div class="bubble me">${this._formatText(text)}</div>`;
                container.appendChild(row);
            },

            /* ── 이력 로드 ── */
            async loadHistory() {
                this.historyLoaded = true;
                const container = document.getElementById('chatContainer');
                container.innerHTML = '';
                this.lastDateKey = null;

                try {
                    const res = await fetch('/ai/chat/history');
                    if (!res.ok) throw new Error('fetch failed');
                    const json = await res.json();
                    const messages = json.data;

                    if (!messages || messages.length === 0) {
                        this._showWelcome();
                        return;
                    }

                    for (const msg of messages) {
                        this._checkDateSeparator(msg.timestamp);
                        if (msg.role === 'user') {
                            this._appendUserBubble(msg.content, msg.timestamp);
                        } else {
                            this._appendAiBubble(msg.content, msg.timestamp);
                        }
                    }
                    this.scrollToBottom();
                } catch (e) {
                    this._showWelcome();
                }
            },

            _showWelcome() {
                const container = document.getElementById('chatContainer');
                if (container.innerHTML.trim()) return;
                const now = Date.now();
                this._checkDateSeparator(now);
                this._appendAiBubble('무엇을 도와줄까? 🐚', now);
            },

            /* ── 대화 초기화 ── */
            async clearHistory() {
                if (this.isStreaming) return;
                try {
                    await fetch('/ai/chat/history', { method: 'DELETE' });
                } catch (e) { /* 무시 */ }

                this.lastDateKey = null;
                this.historyLoaded = true;
                const container = document.getElementById('chatContainer');
                container.innerHTML = '';
                const now = Date.now();
                this._checkDateSeparator(now);
                this._appendAiBubble('대화 기록을 초기화했어요. 무엇을 도와줄까요? 🐚', now);
                this.scrollToBottom();
            },

            /* ── 메시지 전송 ── */
            send() {
                if (this.isStreaming) return;
                const input = document.getElementById('aiChatInput');
                const message = input.value.trim();
                if (!message) return;

                const now = Date.now();
                input.value = '';
                this._checkDateSeparator(now);
                this._appendUserBubble(message, now);
                this.showTyping();
                this.streamResponse(message);
            },

            showTyping() {
                const container = document.getElementById('chatContainer');
                const indicator = document.createElement('div');
                indicator.id = 'aiTypingIndicator';
                indicator.className = 'ai-typing-indicator';
                indicator.innerHTML = `
                    <img src="/images/logo.png" class="chat-profile">
                    <div class="ai-typing-dots">
                        <span></span><span></span><span></span>
                    </div>`;
                container.appendChild(indicator);
                this.scrollToBottom();
            },

            hideTyping() {
                document.getElementById('aiTypingIndicator')?.remove();
            },

            /* ── SSE 스트리밍 수신 ── */
            async streamResponse(message) {
                this.isStreaming = true;
                const sendBtn = document.getElementById('aiChatSendBtn');
                sendBtn.style.opacity = '0.5';

                try {
                    const response = await fetch('/ai/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });

                    if (!response.ok) throw new Error('서버 오류');

                    this.hideTyping();

                    // AI 말풍선 생성
                    const now = Date.now();
                    this._checkDateSeparator(now);
                    const container = document.getElementById('chatContainer');
                    const row = document.createElement('div');
                    row.className = 'bubble-row';
                    row.innerHTML = `
                        <img src="/images/logo.png" class="chat-profile">
                        <div class="bubble ai"></div>
                        <span class="bubble-time">${this._formatTime(now)}</span>`;
                    container.appendChild(row);
                    const bubble = row.querySelector('.bubble.ai');

                    // SSE 스트리밍 수신 — \n을 <br>로 변환하며 누적
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let rawText = ''; // 원본 누적 (변환 전)

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });

                        // SSE는 \n\n 이 하나의 이벤트 구분자.
                        // 이벤트 단위로 파싱해야 같은 이벤트 내 여러 data: 라인을 \n으로 복원할 수 있음.
                        const events = buffer.split('\n\n');
                        buffer = events.pop(); // 마지막 미완성 이벤트 보존

                        for (const event of events) {
                            // 하나의 이벤트 내 data: 라인들을 \n으로 join → 줄바꿈 복원
                            const dataLines = event.split('\n').filter(l => l.startsWith('data:'));
                            if (dataLines.length === 0) continue;

                            const text = dataLines
                                .map(l => l.slice(5)) // "data:" is 5 chars — preserve leading space (GPT-4o BPE tokens like " 하세요")
                                .join('\n');

                            if (text !== '[DONE]') {
                                rawText += text;
                                // rAF로 쓰로틀링 — 급격한 innerHTML 재설정으로 인한 렌더링 아티팩트 방지
                                if (!this._rafPending) {
                                    this._rafPending = true;
                                    requestAnimationFrame(() => {
                                        bubble.innerHTML = this._formatText(rawText);
                                        this.scrollToBottom();
                                        this._rafPending = false;
                                    });
                                }
                            }
                        }
                        // 스트림 종료 후 최종 렌더링 보장
                        bubble.innerHTML = this._formatText(rawText);
                        this.scrollToBottom();
                    }
                } catch (e) {
                    this.hideTyping();
                    const now = Date.now();
                    this._checkDateSeparator(now);
                    this._appendAiBubble('죄송해요, 오류가 발생했어요. 다시 시도해주세요. 🐚', now);
                    this.scrollToBottom();
                } finally {
                    this.isStreaming = false;
                    sendBtn.style.opacity = '1';
                }
            },

            scrollToBottom() {
                const container = document.getElementById('chatContainer');
                container.scrollTop = container.scrollHeight;
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        };

        document.addEventListener('DOMContentLoaded', () => AiChat.init());
    </script>
</div>
