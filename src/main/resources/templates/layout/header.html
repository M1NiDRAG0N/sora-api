<div th:fragment="header" class="page-header transparent"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- SSE 클라이언트 초기화용 사용자 ID -->
    <input type="hidden" id="loginUserIdx"
           th:if="${#authentication != null}"
           th:value="${#authentication.principal.userIdx}">

    <div class="header-profile-section" onclick="window.openProfile()" style="cursor: pointer;">
        <img id="headerProfile"
             th:if="${#authentication != null and #authentication.principal.profileIdx != null}"
             th:src="@{/img/{id}(id=${#authentication.principal.profileIdx})}"
             alt="프로필" class="header-profile-img">
        <img id="headerProfile"
             th:unless="${#authentication != null and #authentication.principal.profileIdx != null}"
             src="/images/default-profile.png"
             alt="프로필" class="header-profile-img">

        <div class="header-profile-info">
            <span id="headerGreeting" class="header-profile-greeting"></span>
            <span id="headerNickname" class="header-title header-nickname"
                  th:text="${#authentication?.principal?.userNickname + '님'}"></span>
        </div>
    </div>

    <div class="header-actions">
        <div onclick="alert('채팅 목록 페이지로 이동')" class="header-icon">
            <ion-icon name="chatbubbles-outline"></ion-icon>
        </div>

        <div onclick="alert('알림 확인')" class="header-icon">
            <ion-icon name="notifications-outline"></ion-icon>
        </div>
    </div>

    <script>
        (function() {
            const hour = new Date().getHours();
            let greeting;
            if (hour >= 5 && hour < 12) {
                greeting = '좋은 아침,';
            } else if (hour >= 12 && hour < 18) {
                greeting = '좋은 오후,';
            } else if (hour >= 18 && hour < 22) {
                greeting = '좋은 저녁,';
            } else {
                greeting = '좋은 밤,';
            }
            const el = document.getElementById('headerGreeting');
            if (el) el.textContent = greeting;
        })();
    </script>
</div>
