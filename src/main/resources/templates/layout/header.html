<div th:fragment="header" class="page-header transparent" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- SSE 클라이언트 초기화용 사용자 ID -->
    <input type="hidden" id="loginUserIdx"
           th:if="${#authentication != null}"
           th:value="${#authentication.principal.userIdx}">

    <div class="header-profile-section" onclick="window.openProfile()" style="cursor: pointer;">
        <img id="headerProfile" th:if="${#authentication != null and #authentication.principal.profileIdx != null}"
            th:src="@{/img/{id}(id=${#authentication.principal.profileIdx})}" alt="프로필" class="header-profile-img">
        <img id="headerProfile" th:unless="${#authentication != null and #authentication.principal.profileIdx != null}"
            src="/images/default-profile.png" alt="프로필" class="header-profile-img">

        <div class="header-profile-info">
            <span id="headerGreeting" class="header-profile-greeting"></span>
            <span id="headerNickname" class="header-title header-nickname"
                th:text="${#authentication?.principal?.userNickname + '님'}"></span>
        </div>
    </div>

    <div class="header-actions">
        <div onclick="location.href='/chatList'" class="header-icon">
            <ion-icon name="chatbubbles-outline"></ion-icon>
        </div>

        <div class="open-noti-modal header-icon" style="position:relative; cursor:pointer;">
            <ion-icon name="notifications-outline"></ion-icon>
            <span id="notiUnreadBadge" style="display:none; position:absolute; top:2px; right:2px;
                  min-width:16px; height:16px; background:#fa5252; color:#fff; font-size:10px;
                  font-weight:700; border-radius:8px; align-items:center; justify-content:center;
                  padding:0 4px; pointer-events:none;"></span>
        </div>
    </div>

    <script>
        (function () {
            const hour = new Date().getHours();
            let greeting;
            if (hour >= 5 && hour < 12) {
                greeting = '좋은 아침,';
            } else if (hour >= 12 && hour < 18) {
                greeting = '좋은 오후,';
            } else if (hour >= 18 && hour < 22) {
                greeting = '좋은 저녁,';
            } else {
                greeting = '좋은 밤,';
            }
            const el = document.getElementById('headerGreeting');
            if (el) el.textContent = greeting;
        })();

        // 읽지 않은 알림 배지
        (function() {
            const badge = document.getElementById('notiUnreadBadge');
            if (!badge) return;

            function updateBadge(count) {
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }

            // 페이지 로드 시 미읽음 수 조회
            fetch('/notifications/unread-count')
                .then(r => r.json())
                .then(res => { if (res?.data != null) updateBadge(res.data); })
                .catch(() => {});

            // SSE 새 알림 수신 시 배지 +1
            window.addEventListener('sse-notification', () => {
                const cur = parseInt(badge.textContent) || 0;
                updateBadge(cur + 1);
            });

            // 알림 모달 열릴 때 배지 갱신 (열고 나서 최신 카운트 재조회)
            document.querySelector('.open-noti-modal')?.addEventListener('click', () => {
                setTimeout(() => {
                    fetch('/notifications/unread-count')
                        .then(r => r.json())
                        .then(res => { if (res?.data != null) updateBadge(res.data); })
                        .catch(() => {});
                }, 1000);
            });
        })();
    </script>
</div>
