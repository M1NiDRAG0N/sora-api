<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소라고동 - 시작하기</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        /* 슬라이더 영역 */
        .slider-section {
            width: 100%;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .swiper {
            width: 100%;
            padding-bottom: 40px !important;
        }

        /* ✅ 카드 스타일 (중앙 정렬 강화) */
        .swiper-slide {
            background: var(--white);
            border-radius: 20px;
            width: 260px !important;
            height: 180px !important;
            padding: 25px;
            /* Flexbox 중앙 정렬 */
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            text-align: center !important;
            /* 텍스트 강제 중앙 */
            box-shadow: 0 10px 20px rgba(178, 164, 255, 0.15);
            transition: transform 0.3s;
        }

        .swiper-slide-active {
            transform: scale(1.05);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #F0EDFF;
            color: var(--primary-dark);
            font-size: 24px;
            margin-bottom: 15px;
            /* 아이콘 내부 중앙 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: auto;
            margin-right: auto;
            /* 마진 오토로 한번 더 중앙 보장 */
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            width: 100%;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.4;
            word-break: keep-all;
            width: 100%;
        }

        .swiper-pagination-bullet-active {
            background: var(--primary-dark) !important;
            width: 20px;
            border-radius: 5px;
            transition: width 0.3s;
        }

    </style>
</head>
<body>

    <div class="app-container bg-gradient">
        
        <div class="top-section">
            <img src="/images/logo.png" alt="소라고동" class="mascot-img">
            <div class="title-text">
                혼자서도 완벽하게,<br>
                <span class="highlight">소라고동</span>이 도와줄게!
            </div>
            <div class="sub-text">
                가계부부터 중고거래, 타임세일까지<br>자취생을 위한 AI 올인원 비서
            </div>
        </div>

        <div class="slider-section">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <div class="card-icon"><ion-icon name="wallet"></ion-icon></div>
                        <div class="card-title">AI 스마트 가계부</div>
                        <div class="card-desc">"오니기리 5천원" 말만 하세요.<br>AI가 알아서 정리해 드려요.</div>
                    </div>
                    <div class="swiper-slide">
                        <div class="card-icon"><ion-icon name="time"></ion-icon></div>
                        <div class="card-title">우리동네 타임세일</div>
                        <div class="card-desc">마트 마감 할인 정보를<br>놓치지 않고 알려드릴게요.</div>
                    </div>
                    <div class="swiper-slide">
                        <div class="card-icon"><ion-icon name="cube"></ion-icon></div>
                        <div class="card-title">초간편 중고거래</div>
                        <div class="card-desc">사진만 찍어 올리면 끝!<br>판매글도 AI가 써줍니다.</div>
                    </div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </div>

        <div class="bottom-section">
            <button class="btn-primary" onclick="location.href='/auth/signup'">시작하기</button>
            <div class="login-link">
                이미 계정이 있나요? <span onclick="location.href='/auth/login'">로그인</span>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow", 
            grabCursor: true, 
            centeredSlides: true, 
            slidesPerView: "auto", 
            coverflowEffect: { 
                rotate: 0, 
                stretch: 0, 
                depth: 100, 
                modifier: 1, 
                slideShadows: false 
            },
            spaceBetween: 20,
            pagination: { el: ".swiper-pagination", clickable: true },
            autoplay: { delay: 3000, disableOnInteraction: false }
        });
    </script>
</body>
</html>
