services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sora-api
    networks:
      - app-network

  sora-api:
    image: ghcr.io/m1nidrag0n/sora-api:latest
    container_name: sora-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    networks:
      - app-network
    volumes:
      - /opt/sora-api/upload:/upload
    mem_limit: 768m
    mem_reservation: 512m

networks:
  app-network:
    driver: bridge
