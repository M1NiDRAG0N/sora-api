name: CI/CD Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 수동 실행 허용

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push 권한

    steps:
      # 1. 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 이미지 이름 소문자 변환 (Docker 태그는 소문자만 허용)
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 2. JDK 21 세팅 + Gradle 캐시
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4. GHCR 로그인
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Docker 이미지 빌드 & GHCR 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 6. 서버 SSH 접속 → 설정 파일 작성 → 이미지 pull → 재시작
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_PAT,GITHUB_ACTOR
          script: |
            # 디렉토리 생성 및 권한 설정
            sudo mkdir -p /opt/sora-api/nginx /opt/sora-api/upload
            sudo chown -R $USER:$USER /opt/sora-api

            # docker-compose.yml 작성
            cat > /opt/sora-api/docker-compose.yml << 'COMPOSE_EOF'
            services:
              nginx:
                image: nginx:alpine
                container_name: nginx
                restart: unless-stopped
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                depends_on:
                  - sora-api
                networks:
                  - app-network

              sora-api:
                image: ghcr.io/m1nidrag0n/sora-api:latest
                container_name: sora-api
                restart: unless-stopped
                expose:
                  - "8080"
                env_file:
                  - .env
                networks:
                  - app-network
                volumes:
                  - /opt/sora-api/upload:/upload

            networks:
              app-network:
                driver: bridge
            COMPOSE_EOF

            # nginx.conf 작성
            cat > /opt/sora-api/nginx/nginx.conf << 'NGINX_EOF'
            events {
                worker_connections 1024;
            }

            http {
                include       /etc/nginx/mime.types;
                default_type  application/octet-stream;
                client_max_body_size 20m;

                upstream sora-api {
                    server sora-api:8080;
                }

                server {
                    listen 80;

                    location /notifications/ {
                        proxy_pass http://sora-api;
                        proxy_http_version 1.1;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_buffering off;
                        proxy_cache off;
                        proxy_read_timeout 3600s;
                        proxy_send_timeout 3600s;
                        chunked_transfer_encoding on;
                    }

                    location /ws {
                        proxy_pass http://sora-api;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_read_timeout 3600s;
                    }

                    location / {
                        proxy_pass http://sora-api;
                        proxy_http_version 1.1;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                }
            }
            NGINX_EOF

            # GHCR 로그인
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd /opt/sora-api

            # 최신 이미지 pull 후 컨테이너 재시작
            docker compose pull
            docker compose up -d --remove-orphans

            # 사용하지 않는 이미지 정리
            docker image prune -f
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
